<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Slate -->
    <linearGradient id="cubeBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <!-- Top Facet (Compute Layer): Radiant Gold / Amber -->
    <linearGradient id="topFacet" x1="13" y1="18" x2="51" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Left Facet (Storage Layer): High-Tech Sky / Azure -->
    <linearGradient id="leftFacet" x1="13" y1="18" x2="32" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#034d75"/>
    </linearGradient>

    <!-- Right Facet (Network Layer): Deep Amber / Bronze -->
    <linearGradient id="rightFacet" x1="51" y1="18" x2="32" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Core Nexus Radial Glow -->
    <radialGradient id="nexusCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Container with Subtle Tech Border -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#cubeBg)" stroke="#f59e0b" stroke-opacity="0.38" stroke-width="1.8"/>

  <!-- 3D Isometric Architecture Cube Monolith -->
  <!-- Left Facet: Storage Engine -->
  <path d="M13 18L32 29V53L13 42V18Z" fill="url(#leftFacet)" stroke="#080c16" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- Right Facet: Network & Messaging -->
  <path d="M32 29L51 18V42L32 53V29Z" fill="url(#rightFacet)" stroke="#080c16" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- Top Facet: Compute & Ingress Gateway -->
  <path d="M32 7L51 18L32 29L13 18L32 7Z" fill="url(#topFacet)" stroke="#080c16" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- High-Tech Circuit Bus Lines connecting to Center Core -->
  <path d="M22.5 23.5L32 29" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M41.5 23.5L32 29" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M32 29V42" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Central Orchestration Nexus (Raft / Master Node) -->
  <circle cx="32" cy="29" r="6" fill="#f59e0b" fill-opacity="0.25"/>
  <circle cx="32" cy="29" r="4.2" fill="url(#nexusCoreGlow)"/>
  <circle cx="32" cy="29" r="1.8" fill="#ffffff"/>

  <!-- Peripheral Vertex Gateway Nodes -->
  <circle cx="32" cy="7" r="2.8" fill="#fde047" stroke="#080c16" stroke-width="1.2"/>
  <circle cx="51" cy="18" r="2.8" fill="#f59e0b" stroke="#080c16" stroke-width="1.2"/>
  <circle cx="13" cy="18" r="2.8" fill="#38bdf8" stroke="#080c16" stroke-width="1.2"/>
  <circle cx="32" cy="53" r="2.8" fill="#fbbf24" stroke="#080c16" stroke-width="1.2"/>
  <circle cx="13" cy="42" r="2.2" fill="#0284c7" stroke="#080c16" stroke-width="1"/>
  <circle cx="51" cy="42" r="2.2" fill="#d97706" stroke="#080c16" stroke-width="1"/>
</svg>