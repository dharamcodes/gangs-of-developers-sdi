<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">SCALABILITY ARCHITECTURE: VERTICAL (SCALE UP) VS HORIZONTAL (SCALE OUT)</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Hardware Saturation Ceilings • Single Point of Failure (SPOF) • Stateless Auto-Scaling • Distributed Data Tiers</text>

  <g id="diagram-canvas">
    
      <!-- Left Panel: Scale Up -->
      <rect x="40" y="85" width="430" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="40" y="85" width="430" height="34" rx="8" fill="#f8fafc" />
      <text x="60" y="108" font-family="sans-serif" font-size="13" font-weight="800" fill="#0f172a">VERTICAL SCALING (Scale Up)</text>
      <text x="380" y="108" font-family="sans-serif" font-size="10" font-weight="700" fill="#ef4444">Monolithic Limit</text>
      
      <rect x="70" y="135" width="80" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
      <text x="110" y="162" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700">Small Svr</text>
      <text x="110" y="178" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">4 vCPU / 16GB</text>

      <line x1="160" y1="165" x2="195" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

      <rect x="205" y="125" width="95" height="80" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
      <text x="252" y="157" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700">Large Svr</text>
      <text x="252" y="173" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">32 vCPU / 128GB</text>

      <line x1="310" y1="165" x2="340" y2="165" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)" />

      <rect x="350" y="115" width="105" height="100" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
      <text x="402" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#b91c1c">Max Host</text>
      <text x="402" y="165" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7f1d1d">128 vCPU / 1TB</text>
      <text x="402" y="195" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#dc2626">HARD LIMIT</text>

      <rect x="60" y="235" width="390" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="75" y="255" font-family="sans-serif" font-size="10" font-weight="700" fill="#b91c1c">⚠ Severe Limitations:</text>
      <text x="75" y="272" font-family="sans-serif" font-size="9.5" fill="#334155">• Single Point of Failure (SPOF) — crash takes down entire system</text>
      <text x="75" y="288" font-family="sans-serif" font-size="9.5" fill="#334155">• Upgrades require downtime • Exponential cost curve per compute unit</text>

      <!-- Right Panel: Scale Out -->
      <rect x="495" y="85" width="465" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="495" y="85" width="465" height="34" rx="8" fill="#f8fafc" />
      <text x="515" y="108" font-family="sans-serif" font-size="13" font-weight="800" fill="#0f172a">HORIZONTAL SCALING (Scale Out)</text>
      <text x="850" y="108" font-family="sans-serif" font-size="10" font-weight="700" fill="#059669">Elastic Fleet</text>

      <rect x="515" y="150" width="90" height="46" rx="6" fill="#0f172a" />
      <text x="560" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">Load Balancer</text>
      <text x="560" y="186" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#38bdf8">Round Robin</text>

      <line x1="605" y1="173" x2="650" y2="135" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowBlue)" />
      <line x1="605" y1="173" x2="650" y2="173" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowBlue)" />
      <line x1="605" y1="173" x2="650" y2="210" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowBlue)" />

      <rect x="655" y="120" width="85" height="32" rx="4" fill="#f0fdf4" stroke="#22c55e" />
      <text x="697" y="140" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#15803d">Node 1 (4 vCPU)</text>

      <rect x="655" y="158" width="85" height="32" rx="4" fill="#f0fdf4" stroke="#22c55e" />
      <text x="697" y="178" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#15803d">Node 2 (4 vCPU)</text>

      <rect x="655" y="196" width="85" height="32" rx="4" fill="#f0fdf4" stroke="#22c55e" />
      <text x="697" y="216" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#15803d">Node N (Elastic)</text>

      <line x1="740" y1="173" x2="780" y2="173" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

      <rect x="785" y="130" width="155" height="85" rx="6" fill="#f8fafc" stroke="#94a3b8" />
      <text x="862" y="152" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#0f172a">Shared State Tier</text>
      <rect x="795" y="160" width="135" height="22" rx="3" fill="#e0f2fe" />
      <text x="862" y="175" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#0369a1">Redis Cluster (Sessions)</text>
      <rect x="795" y="186" width="135" height="22" rx="3" fill="#fef3c7" />
      <text x="862" y="201" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#92400e">Sharded DB (PostgreSQL)</text>

      <rect x="515" y="240" width="425" height="65" rx="6" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="530" y="258" font-family="sans-serif" font-size="10" font-weight="700" fill="#15803d">✓ Production Strengths:</text>
      <text x="530" y="275" font-family="sans-serif" font-size="9.5" fill="#334155">• Infinite theoretical scale • Zero-downtime rolling deployments</text>
      <text x="530" y="291" font-family="sans-serif" font-size="9.5" fill="#334155">• N-1 fault tolerance: individual node death causes zero user disruption</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Architecture Rule: Scale stateless web/app tiers horizontally from Day 1; vertically scale stateful DBs until write IOPs force sharding.</text>
    
  </g>
</svg>