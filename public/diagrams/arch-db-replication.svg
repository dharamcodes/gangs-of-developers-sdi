<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">DATABASE REPLICATION &amp; READ SCALING ARCHITECTURE</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Synchronous Standby (Zero RPO) vs Asynchronous Read Replicas (Low Latency) • Replication Lag</text>

  <g id="diagram-canvas">
    
      <!-- Primary DB -->
      <rect x="50" y="115" width="220" height="150" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
      <rect x="50" y="115" width="220" height="32" rx="8" fill="#0f172a" />
      <text x="160" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">PRIMARY DATABASE</text>

      <text x="160" y="168" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Handles ALL Writes</text>
      <text x="160" y="186" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#475569">Appends to Write-Ahead Log (WAL)</text>
      <rect x="75" y="200" width="170" height="30" rx="4" fill="#e0f2fe" />
      <text x="160" y="220" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0369a1">PostgreSQL / MySQL Primary</text>

      <!-- Sync line -->
      <line x1="270" y1="150" x2="370" y2="110" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" />
      <text x="320" y="122" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#059669">Sync Stream</text>

      <!-- Standby Replica -->
      <rect x="375" y="85" width="220" height="75" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
      <text x="485" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#15803d">SYNCHRONOUS STANDBY</text>
      <text x="485" y="125" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#166534">Zero Data Loss (RPO = 0)</text>
      <text x="485" y="140" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#166534">Automatic Failover Target</text>

      <!-- Async lines -->
      <line x1="270" y1="180" x2="370" y2="190" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
      <line x1="270" y1="210" x2="370" y2="250" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
      <text x="320" y="210" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#0284c7">Async WAL</text>

      <!-- Async Read Replicas -->
      <rect x="375" y="170" width="220" height="65" rx="6" fill="#f8fafc" stroke="#94a3b8" />
      <text x="485" y="192" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Read Replica 1</text>
      <text x="485" y="208" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#64748b">Handles GET /catalog requests</text>
      <text x="485" y="222" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#dc2626">Lag: ~25ms</text>

      <rect x="375" y="245" width="220" height="65" rx="6" fill="#f8fafc" stroke="#94a3b8" />
      <text x="485" y="267" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Read Replica 2</text>
      <text x="485" y="283" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#64748b">Handles analytical report queries</text>
      <text x="485" y="297" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#dc2626">Lag: ~120ms</text>

      <!-- Read-Your-Own-Writes Box -->
      <rect x="635" y="95" width="325" height="195" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="635" y="95" width="325" height="30" rx="8" fill="#fef3c7" />
      <text x="797" y="115" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#92400e">READ-YOUR-OWN-WRITES CONSISTENCY</text>

      <text x="655" y="145" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">The Problem:</text>
      <text x="655" y="162" font-family="sans-serif" font-size="8.5" fill="#475569">User edits bio → Writes to Primary. Browser redirects to /profile.</text>
      <text x="655" y="176" font-family="sans-serif" font-size="8.5" fill="#475569">Read hits Replica 2 (lagging) → Old bio rendered! User panics.</text>

      <text x="655" y="200" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#15803d">The Solution (Session Sticky Routing):</text>
      <text x="655" y="217" font-family="sans-serif" font-size="8.5" fill="#166534">• Set cookie: last_write_ts = current_timestamp</text>
      <text x="655" y="232" font-family="sans-serif" font-size="8.5" fill="#166534">• If (now - last_write_ts) &lt; 5s: Route read to PRIMARY</text>
      <text x="655" y="247" font-family="sans-serif" font-size="8.5" fill="#166534">• Otherwise: Route read to read replicas</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Staff Rule: Read replicas scale read concurrency, not write throughput. Always enforce session sticky routing to primary post-write.</text>
    
  </g>
</svg>