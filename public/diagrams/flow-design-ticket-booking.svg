<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <rect width="1000" height="440" fill="#ffffff" />
  <rect width="1000" height="440" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="64" fill="url(#headerGrad)" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#blueGrad)" />
  <text x="36" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">TICKET BOOKING SYSTEM: DEEP-DIVE EXECUTION PIPELINES</text>
  <text x="36" y="49" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8">Hold Path: 10-Minute Expiring Redis Seat Lock || Booking Path: Distributed Confirmation &amp; Ticket Issuance</text>

  <!-- LANE 1 CONTAINER -->
  <rect x="35" y="76" width="930" height="146" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="35" y="76" width="930" height="28" rx="8" fill="#f8fafc" />
  <rect x="45" y="82" width="132.5" height="16" rx="3" fill="#0284c7" />
  <text x="111.25" y="94" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">SEAT HOLD LEASE</text>
  <text x="187.5" y="94" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">Atomic Seat Hold with 10-Minute Expiring Lease (Redis Lua Script)</text>
  
        <rect x="55" y="118" width="150" height="66" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="69" cy="132" r="8" fill="#0284c7" />
        <text x="69" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">1</text>
        <text x="83" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">User App</text>
        <text x="130" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Select Seat 42</text>
        <text x="130" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Concert: Taylor Swift</text>
      
          <line x1="205" y1="151" x2="240" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="222.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">POST /seat/hold</text>
        
        <rect x="240" y="118" width="150" height="66" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="254" cy="132" r="8" fill="#0284c7" />
        <text x="254" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">2</text>
        <text x="268" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Booking Svc</text>
        <text x="315" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Evaluate Lua</text>
        <text x="315" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Atomic check &amp; set in Redis</text>
      
          <line x1="390" y1="151" x2="425" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
