          <text x="222.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Commit DB</text>
        
        <rect x="240" y="276" width="150" height="66" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="254" cy="290" r="8" fill="#0284c7" />
        <text x="254" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">2</text>
        <text x="268" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">PostgreSQL DB</text>
        <text x="315" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Mark BOOKED</text>
        <text x="315" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Status = CONFIRMED, User = A</text>
      
          <line x1="390" y1="309" x2="425" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="407.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Clear Redis Lock</text>
        
        <rect x="425" y="276" width="150" height="66" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" />
        <circle cx="439" cy="290" r="8" fill="#059669" />
        <text x="439" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">3</text>
        <text x="453" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Ticket Svc</text>
        <text x="500" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Issue QR Pass</text>
        <text x="500" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Cryptographic signed ticket</text>
      
          <line x1="575" y1="309" x2="610" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="592.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Deliver Pass</text>
        
        <rect x="610" y="276" width="150" height="66" rx="6" fill="#fefce8" stroke="#d97706" stroke-width="1.5" />
        <circle cx="624" cy="290" r="8" fill="#d97706" />
        <text x="624" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">4</text>
        <text x="638" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Timeout Path</text>
        <text x="685" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">If Unpaid at 10m</text>
        <text x="685" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Redis key expiry notification</text>
      
          <line x1="760" y1="309" x2="795" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="777.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Auto-Release</text>
        
        <rect x="795" y="276" width="150" height="66" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" />
        <circle cx="809" cy="290" r="8" fill="#059669" />
        <text x="809" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">5</text>
        <text x="823" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Seat Available</text>
        <text x="870" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Seat Green Again</text>
        <text x="870" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Returns to public pool</text>
      

  <!-- BOTTOM TAKEAWAY BANNER -->
  <rect x="35" y="392" width="930" height="36" rx="6" fill="#0f172a" />
  <text x="500" y="414" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Staff Principle: Use expiring in-memory leases (Redis TTL) to prevent permanent seat holding without locking database table rows.</text>
</svg>