        <text x="500" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">SET lock:seat NX</text>
        <text x="500" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">TTL = 600s (10 Minutes)</text>
      
          <line x1="575" y1="151" x2="610" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="592.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Lock Acquired</text>
        
        <rect x="610" y="118" width="150" height="66" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="624" cy="132" r="8" fill="#0284c7" />
        <text x="624" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">4</text>
