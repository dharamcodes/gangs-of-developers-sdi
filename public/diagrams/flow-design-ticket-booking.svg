        <text x="685" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Seat Held (Yellow)</text>
        <text x="685" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">10-minute countdown starts</text>
      
          <line x1="760" y1="151" x2="795" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="777.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Proceed Pay</text>
        
        <rect x="795" y="118" width="150" height="66" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
        <circle cx="809" cy="132" r="8" fill="#ef4444" />
        <text x="809" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">5</text>
        <text x="823" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Compete Fan</text>
        <text x="870" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Seat 42 Blocked</text>
        <text x="870" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Returns 409 Conflict</text>
      

  <!-- LANE 2 CONTAINER -->
  <rect x="35" y="234" width="930" height="146" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="35" y="234" width="930" height="28" rx="8" fill="#f8fafc" />
  <rect x="45" y="240" width="170" height="16" rx="3" fill="#d97706" />
