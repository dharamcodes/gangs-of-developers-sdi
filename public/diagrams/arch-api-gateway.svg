<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />
  <!-- Header Title (Clean Whiteboard) -->
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">API GATEWAY ARCHITECTURE &amp; CROSS-CUTTING INGRESS CONTROLS</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#475569">SSL Termination • Token Authentication • Distributed Rate Limiting • Microservice Dynamic Routing</text>

  <g id="diagram-canvas">
    
      <!-- Client -->
      <rect x="40" y="150" width="90" height="60" rx="6" fill="#0f172a" />
      <text x="85" y="178" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">Clients</text>
      <text x="85" y="194" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#94a3b8">Web / iOS / Android</text>

      <line x1="130" y1="180" x2="190" y2="180" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
      <text x="160" y="172" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#64748b">HTTPS</text>

      <!-- Gateway Box -->
      <rect x="195" y="95" width="370" height="215" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
      <rect x="195" y="95" width="370" height="32" rx="8" fill="#0284c7" />
      <text x="380" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">API GATEWAY (KONG / ENVOY)</text>

      <rect x="215" y="138" width="155" height="42" rx="5" fill="#f1f5f9" stroke="#94a3b8" />
      <text x="292" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700">TLS 1.3 Termination</text>
      <text x="292" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Cert Manager Offload</text>

      <rect x="390" y="138" width="155" height="42" rx="5" fill="#f1f5f9" stroke="#94a3b8" />
      <text x="467" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700">Auth &amp; JWT Validation</text>
      <text x="467" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Claims Extraction</text>

      <rect x="215" y="190" width="155" height="42" rx="5" fill="#fef3c7" stroke="#f59e0b" />
      <text x="292" y="208" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#92400e">Rate Limiter (Redis)</text>
      <text x="292" y="222" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#b45309">1,000 req/min per IP</text>

      <rect x="390" y="190" width="155" height="42" rx="5" fill="#f0fdf4" stroke="#22c55e" />
      <text x="467" y="208" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#15803d">Circuit Breaker</text>
      <text x="467" y="222" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#166534">Fast Fail &amp; Fallbacks</text>

      <rect x="215" y="244" width="330" height="50" rx="5" fill="#0f172a" />
      <text x="380" y="265" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">Header Enrichment &amp; Dispatcher</text>
      <text x="380" y="281" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#38bdf8">Injects: X-Request-ID, X-User-ID, traceparent</text>

      <!-- Fan out arrows -->
      <line x1="565" y1="165" x2="630" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
      <line x1="565" y1="180" x2="630" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
      <line x1="565" y1="200" x2="630" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
      <line x1="565" y1="220" x2="630" y2="270" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

      <!-- Microservices -->
      <rect x="635" y="105" width="150" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="710" y="125" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700">Auth Service (:8081)</text>

      <rect x="635" y="155" width="150" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="710" y="175" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700">User Service (:8082)</text>

      <rect x="635" y="205" width="150" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="710" y="225" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700">Order Service (:8083)</text>

      <rect x="635" y="255" width="150" height="32" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="710" y="275" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700">Payment Svc (:8084)</text>

      <!-- Redis sidecar -->
      <rect x="815" y="160" width="140" height="80" rx="6" fill="#fef2f2" stroke="#ef4444" />
      <text x="885" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#b91c1c">Redis Cache</text>
      <text x="885" y="202" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#7f1d1d">• Token Blacklist</text>
      <text x="885" y="218" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#7f1d1d">• Rate limit buckets</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Architecture Rule: Never inject business logic into the API Gateway. Keep it strictly focused on cross-cutting ingress concerns.</text>
    
  </g>
</svg>