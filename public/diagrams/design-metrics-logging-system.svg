<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#cbd5e1" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
  </defs>
  <rect width="1100" height="580" fill="#ffffff" />
  <rect width="1100" height="580" fill="url(#dotGrid)" />

  <text x="40" y="46" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">
    Metrics &amp; Logging System Architecture
  </text>

  <!-- 1. 100k Hosts OTel Agents -->
  <rect x="40" y="120" width="180" height="150" rx="8" fill="#dbeafe" stroke="#0f172a" stroke-width="2.2" />
  <text x="130" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">100k Server Fleet</text>
  <rect x="58" y="168" width="144" height="40" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" />
  <text x="130" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">OTel DaemonSet</text>
  <rect x="58" y="218" width="144" height="36" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" />
  <text x="130" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">Batch + Zstd (5s)</text>

  <!-- Arrow 1 -->
  <line x1="220" y1="195" x2="295" y2="195" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arrow)" />
  <circle cx="257" cy="172" r="13" fill="#0f172a" />
  <text x="257" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="257" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">gRPC OTLP</text>

  <!-- 2. Collector & Cardinality Firewall -->
  <rect x="300" y="120" width="185" height="150" rx="8" fill="#dcfce7" stroke="#0f172a" stroke-width="2.2" />
  <text x="392" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Ingestion Collectors</text>
  <rect x="316" y="168" width="152" height="40" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" />
  <text x="392" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Cardinality Firewall</text>
  <rect x="316" y="218" width="152" height="36" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" />
  <text x="392" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">PII Scrub &amp; Rate Limit</text>

  <!-- Arrow 2 -->
  <line x1="485" y1="195" x2="555" y2="195" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arrow)" />
  <circle cx="520" cy="172" r="13" fill="#0f172a" />
  <text x="520" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>

  <!-- 3. Kafka Buffering Cluster -->
  <rect x="560" y="110" width="180" height="170" rx="8" fill="#fef3c7" stroke="#0f172a" stroke-width="2.2" />
  <text x="650" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Kafka Buffer Bus</text>
  <rect x="578" y="152" width="144" height="32" rx="4" fill="#fde68a" stroke="#0f172a" stroke-width="1.5" />
  <text x="650" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">telemetry.metrics</text>
  <rect x="578" y="194" width="144" height="32" rx="4" fill="#fde68a" stroke="#0f172a" stroke-width="1.5" />
  <text x="650" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">telemetry.logs</text>
  <rect x="578" y="236" width="144" height="30" rx="4" fill="#fde68a" stroke="#0f172a" stroke-width="1.5" />
  <text x="650" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0f172a">Partition: tenant+hash</text>

  <!-- Fanout Arrows 3a, 3b, 3c -->
  <path d="M 740 165 L 825 115" stroke="#0f172a" stroke-width="2.2" fill="none" marker-end="url(#arrow)" />
  <circle cx="782" cy="128" r="13" fill="#0f172a" />
  <text x="782" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">3a</text>

  <path d="M 740 210 L 825 260" stroke="#0f172a" stroke-width="2.2" fill="none" marker-end="url(#arrow)" />
  <circle cx="782" cy="248" r="13" fill="#0f172a" />
  <text x="782" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">3b</text>

  <path d="M 650 280 L 650 385" stroke="#0f172a" stroke-width="2.2" fill="none" marker-end="url(#arrow)" />
  <circle cx="672" cy="332" r="13" fill="#0f172a" />
  <text x="672" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">3c</text>

  <!-- 4a. TSDB Engine (Gorilla XOR + Roaring Bitmap) -->
  <rect x="830" y="60" width="230" height="125" rx="10" fill="#fce7f3" stroke="#0f172a" stroke-width="2.2" />
  <text x="945" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Time-Series DB (TSDB)</text>
  <text x="945" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Gorilla XOR (1.37 B/sample)</text>
  <text x="945" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Roaring Bitmap Inverted Index</text>
  <text x="945" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• 10s Raw → 1m / 1h Rollups</text>

  <!-- 4b. ClickHouse / Loki Columnar Log Store -->
  <rect x="830" y="215" width="230" height="125" rx="10" fill="#e0e7ff" stroke="#0f172a" stroke-width="2.2" />
  <text x="945" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">ClickHouse / Log Index</text>
  <text x="945" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Hot NVMe SSD (3-Day Tier)</text>
  <text x="945" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Zstd Columnar Blocks (10:1)</text>
  <text x="945" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Bloom Filter Skip Indexes</text>

  <!-- 4c. Streaming Alert Engine -->
  <rect x="540" y="390" width="220" height="115" rx="8" fill="#f3e8ff" stroke="#0f172a" stroke-width="2.2" />
  <text x="650" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Streaming Alert Evaluator</text>
  <text x="650" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">Sliding Window Rules (Flink)</text>
  <text x="650" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">PENDING → FIRING → PagerDuty</text>

  <!-- 5. Cold S3 Object Storage Tier -->
  <rect x="830" y="390" width="230" height="115" rx="10" fill="#bae6fd" stroke="#0f172a" stroke-width="2.2" />
  <text x="945" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">S3 Cold Parquet Tier</text>
  <text x="945" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• 1-Year Retention &amp; Audit</text>
  <text x="945" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Downsampled Blocks &amp; Logs</text>

  <line x1="945" y1="340" x2="945" y2="385" stroke="#0f172a" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <circle cx="970" cy="364" r="13" fill="#0f172a" />
  <text x="970" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>

  <!-- 6. Query Federation & Grafana UI -->
  <rect x="140" y="390" width="310" height="115" rx="8" fill="#fed7aa" stroke="#0f172a" stroke-width="2.2" />
  <text x="295" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Query Federation &amp; Dashboards</text>
  <text x="295" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">PromQL / LogQL Scatter-Gather</text>
  <text x="295" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">Redis Result Cache + TraceID Correlation</text>
</svg>