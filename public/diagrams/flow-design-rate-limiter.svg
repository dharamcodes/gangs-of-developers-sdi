          <text x="222.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Inspect Count</text>
        
        <rect x="240" y="276" width="150" height="66" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
        <circle cx="254" cy="290" r="8" fill="#ef4444" />
