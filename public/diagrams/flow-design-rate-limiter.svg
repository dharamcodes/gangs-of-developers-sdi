        <text x="823" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Downstream</text>
        <text x="870" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Target Microservice</text>
        <text x="870" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">X-RateLimit-Remain: 84</text>
      

  <!-- LANE 2 CONTAINER -->
  <rect x="35" y="234" width="930" height="146" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="35" y="234" width="930" height="28" rx="8" fill="#f8fafc" />
  <rect x="45" y="240" width="132.5" height="16" rx="3" fill="#d97706" />
