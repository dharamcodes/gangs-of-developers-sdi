        <text x="500" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Rate Limit Svc</text>
        <text x="500" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Compute window (now-60s)</text>
      
          <line x1="575" y1="151" x2="610" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
