        <text x="685" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">ZREMRANGE + ZCARD</text>
        <text x="685" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">ZADD key now uuid</text>
      
