  <rect x="45" y="82" width="147.5" height="16" rx="3" fill="#0284c7" />
  <text x="118.75" y="94" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">QUOTA ENFORCEMENT</text>
  <text x="202.5" y="94" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">High-Concurrency Sliding Window Counter Ingress (Atomic Redis Lua Script)</text>
  
        <rect x="55" y="118" width="150" height="66" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="69" cy="132" r="8" fill="#0284c7" />
        <text x="69" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">1</text>
        <text x="83" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Client App</text>
        <text x="130" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">API Request</text>
        <text x="130" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">X-Forwarded-For: IP</text>
      
          <line x1="205" y1="151" x2="240" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
