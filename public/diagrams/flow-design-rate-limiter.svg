        <text x="130" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Excess Request</text>
        <text x="130" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">1,001st Req / min</text>
      
