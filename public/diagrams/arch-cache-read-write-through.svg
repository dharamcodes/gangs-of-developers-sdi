<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />
  <!-- Header Title (Clean Whiteboard) -->
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">CACHING STRATEGIES: READ-THROUGH VS WRITE-THROUGH VS WRITE-BEHIND</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#475569">Inline Cache vs Cache-Aside • Synchronous Data Consistency • Asynchronous Dirty Batching</text>

  <g id="diagram-canvas">
    
      <!-- Read Through -->
      <rect x="40" y="85" width="290" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="40" y="85" width="290" height="32" rx="8" fill="#f1f5f9" />
      <text x="55" y="106" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#0f172a">1. READ-THROUGH</text>

      <rect x="55" y="130" width="80" height="36" rx="4" fill="#0f172a" />
      <text x="95" y="152" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">App Svc</text>

      <line x1="135" y1="148" x2="165" y2="148" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />

      <rect x="170" y="130" width="60" height="36" rx="4" fill="#e0f2fe" stroke="#38bdf8" />
      <text x="200" y="152" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0369a1">Cache</text>

      <line x1="230" y1="148" x2="255" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

      <rect x="260" y="130" width="55" height="36" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="287" y="152" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700">DB</text>

      <rect x="55" y="180" width="260" height="125" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="68" y="200" font-family="sans-serif" font-size="9" font-weight="700" fill="#0369a1">Architecture:</text>
      <text x="68" y="218" font-family="sans-serif" font-size="8.5" fill="#334155">• App treats Cache as primary datastore</text>
      <text x="68" y="234" font-family="sans-serif" font-size="8.5" fill="#334155">• On miss: Cache fetches from DB directly</text>
      <text x="68" y="250" font-family="sans-serif" font-size="8.5" fill="#334155">• App never queries DB directly</text>
      <text x="68" y="266" font-family="sans-serif" font-size="8.5" fill="#15803d">✓ Simplifies client code</text>
      <text x="68" y="282" font-family="sans-serif" font-size="8.5" fill="#dc2626">✗ Cache plugin must know DB schema</text>

      <!-- Write Through -->
      <rect x="355" y="85" width="290" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="355" y="85" width="290" height="32" rx="8" fill="#f1f5f9" />
      <text x="370" y="106" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#0f172a">2. WRITE-THROUGH</text>

      <rect x="370" y="130" width="80" height="36" rx="4" fill="#0f172a" />
      <text x="410" y="152" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">App Svc</text>

      <line x1="450" y1="148" x2="480" y2="148" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)" />

      <rect x="485" y="130" width="60" height="36" rx="4" fill="#f0fdf4" stroke="#22c55e" />
      <text x="515" y="152" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#15803d">Cache</text>

      <line x1="545" y1="148" x2="570" y2="148" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)" />

      <rect x="575" y="130" width="55" height="36" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="602" y="152" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700">DB</text>

      <rect x="370" y="180" width="260" height="125" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="383" y="200" font-family="sans-serif" font-size="9" font-weight="700" fill="#15803d">Architecture:</text>
      <text x="383" y="218" font-family="sans-serif" font-size="8.5" fill="#334155">• App writes to Cache synchronously</text>
      <text x="383" y="234" font-family="sans-serif" font-size="8.5" fill="#334155">• Cache writes to DB synchronously</text>
      <text x="383" y="250" font-family="sans-serif" font-size="8.5" fill="#334155">• Success returned ONLY after both commit</text>
      <text x="383" y="266" font-family="sans-serif" font-size="8.5" fill="#15803d">✓ Zero stale cache windows</text>
      <text x="383" y="282" font-family="sans-serif" font-size="8.5" fill="#dc2626">✗ Higher write latency (2 network hops)</text>

      <!-- Write Behind -->
      <rect x="670" y="85" width="290" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="670" y="85" width="290" height="32" rx="8" fill="#f1f5f9" />
      <text x="685" y="106" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#0f172a">3. WRITE-BEHIND (BACK)</text>

      <rect x="685" y="130" width="80" height="36" rx="4" fill="#0f172a" />
      <text x="725" y="152" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">App Svc</text>

      <line x1="765" y1="148" x2="795" y2="148" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />

      <rect x="800" y="130" width="60" height="36" rx="4" fill="#fef3c7" stroke="#f59e0b" />
      <text x="830" y="152" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#92400e">Cache</text>

      <path d="M 860 148 Q 875 148 880 180 T 895 200" fill="none" stroke="#ef4444" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arrowRed)" />

      <rect x="880" y="205" width="65" height="36" rx="4" fill="#fef2f2" stroke="#ef4444" />
      <text x="912" y="227" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#b91c1c">Async DB</text>

      <rect x="685" y="180" width="185" height="125" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="698" y="200" font-family="sans-serif" font-size="9" font-weight="700" fill="#b45309">Architecture:</text>
      <text x="698" y="218" font-family="sans-serif" font-size="8.5" fill="#334155">• App writes to Cache only</text>
      <text x="698" y="234" font-family="sans-serif" font-size="8.5" fill="#334155">• Returns success instantly (&lt;1ms)</text>
      <text x="698" y="250" font-family="sans-serif" font-size="8.5" fill="#334155">• Dirty writes batched &amp; flushed to DB</text>
      <text x="698" y="266" font-family="sans-serif" font-size="8.5" fill="#15803d">✓ Extreme write performance</text>
      <text x="698" y="282" font-family="sans-serif" font-size="8.5" fill="#dc2626">✗ Data loss if cache node crashes!</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Architecture Rule: Default to Cache-Aside with TTLs. Reserve Write-Behind strictly for high-volume telemetry where losing &lt;1s data is acceptable.</text>
    
  </g>
</svg>