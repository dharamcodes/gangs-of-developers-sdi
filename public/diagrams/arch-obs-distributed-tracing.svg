<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">DISTRIBUTED TRACING &amp; CONTEXT PROPAGATION ARCHITECTURE</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">W3C Trace Context (traceparent) • Span Parent-Child Hierarchy • Bottleneck Detection Across Microservices</text>

  <g id="diagram-canvas">
    
      <!-- Trace Header Banner -->
      <rect x="40" y="85" width="920" height="36" rx="6" fill="#0f172a" />
      <text x="60" y="108" font-family="sans-serif" font-size="11" font-weight="800" fill="#38bdf8">Trace ID: 4bf92f3577b34da6a3ce929d0e0e4736</text>
      <text x="600" y="108" font-family="sans-serif" font-size="10" font-weight="600" fill="#94a3b8">W3C Header: traceparent: 00-4bf92f35...-01</text>
      <text x="890" y="108" font-family="sans-serif" font-size="10" font-weight="800" fill="#f59e0b">Total: 250ms</text>

      <!-- Waterfall Timeline Spans -->
      <!-- Span 1: API Gateway -->
      <rect x="40" y="130" width="920" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="55" y="150" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">API Gateway Ingress (Proxy)</text>
      <rect x="250" y="136" width="690" height="18" rx="3" fill="#0284c7" />
      <text x="600" y="150" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">250 ms</text>

      <!-- Span 2: Auth Service -->
      <rect x="40" y="165" width="920" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="75" y="185" font-family="sans-serif" font-size="10" font-weight="600" fill="#475569">└─ Auth Svc: Verify JWT &amp; Scopes</text>
      <rect x="250" y="171" width="90" height="18" rx="3" fill="#059669" />
      <text x="295" y="185" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">32 ms</text>

      <!-- Span 3: Order Service -->
      <rect x="40" y="200" width="920" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="75" y="220" font-family="sans-serif" font-size="10" font-weight="600" fill="#475569">└─ Order Svc: POST /checkout</text>
      <rect x="350" y="206" width="580" height="18" rx="3" fill="#0284c7" />
      <text x="640" y="220" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">210 ms</text>

      <!-- Span 4: Inventory Service -->
      <rect x="40" y="235" width="920" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="95" y="255" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#64748b">└─ Inventory Svc: Stock Check</text>
      <rect x="370" y="241" width="110" height="18" rx="3" fill="#059669" />
      <text x="425" y="255" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">40 ms</text>

      <!-- Span 5: Payment Gateway (Bottleneck) -->
      <rect x="40" y="270" width="920" height="30" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
      <text x="95" y="290" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#b91c1c">└─ Payment Svc: Stripe API [BOTTLENECK DETECTED]</text>
      <rect x="500" y="276" width="410" height="18" rx="3" fill="#ef4444" />
      <text x="705" y="290" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff">150 ms (60% of total request time)</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Architecture Rule: Inject W3C traceparent headers across all asynchronous message queues and HTTP hops to maintain end-to-end auditability.</text>
    
  </g>
</svg>