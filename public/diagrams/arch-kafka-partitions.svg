<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#ffffff" />
  <rect width="1000" height="360" fill="url(#grid)" />
  <!-- Header Title (Clean Whiteboard) -->
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">APACHE KAFKA TOPIC PARTITIONS &amp; CONSUMER GROUP SCALING</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#475569">Horizontal Scaling via Partitions • Strict Per-Partition Ordering • Consumer Group Rebalancing &amp; Lag</text>

  <g id="diagram-canvas">
    
      <rect x="40" y="100" width="140" height="190" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="110" y="125" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Producer Fleet</text>
      <rect x="55" y="145" width="110" height="35" rx="5" fill="#ffffff" stroke="#94a3b8" /><text x="110" y="167" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0f172a">Producer 1</text>
      <rect x="55" y="195" width="110" height="35" rx="5" fill="#ffffff" stroke="#94a3b8" /><text x="110" y="217" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0f172a">Producer 2</text>
      <rect x="55" y="245" width="110" height="35" rx="5" fill="#ffffff" stroke="#94a3b8" /><text x="110" y="267" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0f172a">Producer N</text>
      <rect x="230" y="100" width="370" height="190" rx="8" fill="#0f172a" />
      <text x="415" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#fbbf24">Kafka Topic: orders-v1 (3 Partitions)</text>
      <rect x="250" y="145" width="330" height="32" rx="4" fill="#1e293b" stroke="#475569" /><text x="260" y="165" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Partition 0</text>
      <rect x="330" y="150" width="35" height="22" rx="3" fill="#334155" /><text x="347" y="165" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffffff">0</text>
      <rect x="375" y="150" width="35" height="22" rx="3" fill="#334155" /><text x="392" y="165" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffffff">1</text>
      <rect x="420" y="150" width="35" height="22" rx="3" fill="#334155" /><text x="437" y="165" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffffff">2</text>
      <rect x="465" y="150" width="35" height="22" rx="3" fill="#f59e0b" /><text x="482" y="165" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#0f172a">3</text>
      <rect x="250" y="195" width="330" height="32" rx="4" fill="#1e293b" stroke="#475569" /><text x="260" y="215" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Partition 1</text>
      <rect x="330" y="200" width="35" height="22" rx="3" fill="#334155" /><text x="347" y="215" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffffff">0</text>
      <rect x="375" y="200" width="35" height="22" rx="3" fill="#334155" /><text x="392" y="215" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffffff">1</text>
      <rect x="420" y="200" width="35" height="22" rx="3" fill="#f59e0b" /><text x="437" y="215" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#0f172a">2</text>
      <rect x="250" y="245" width="330" height="32" rx="4" fill="#1e293b" stroke="#475569" /><text x="260" y="265" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Partition 2</text>
      <rect x="330" y="250" width="35" height="22" rx="3" fill="#334155" /><text x="347" y="265" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffffff">0</text>
      <rect x="375" y="250" width="35" height="22" rx="3" fill="#f59e0b" /><text x="392" y="265" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#0f172a">1</text>
      <rect x="650" y="100" width="310" height="190" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="805" y="125" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">Consumer Group (orders-worker)</text>
      <rect x="670" y="145" width="270" height="35" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" /><text x="685" y="167" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Consumer Instance 1</text><text x="925" y="167" text-anchor="end" font-family="sans-serif" font-size="9" fill="#0284c7">Reads Part. 0</text>
      <rect x="670" y="195" width="270" height="35" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" /><text x="685" y="217" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Consumer Instance 2</text><text x="925" y="217" text-anchor="end" font-family="sans-serif" font-size="9" fill="#0284c7">Reads Part. 1</text>
      <rect x="670" y="245" width="270" height="35" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" /><text x="685" y="267" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Consumer Instance 3</text><text x="925" y="267" text-anchor="end" font-family="sans-serif" font-size="9" fill="#0284c7">Reads Part. 2</text>
      <line x1="180" y1="195" x2="230" y2="195" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />
      <line x1="600" y1="195" x2="650" y2="195" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
      <rect x="40" y="305" width="920" height="38" rx="6" fill="#f1f5f9" />
      <text x="500" y="328" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#334155">Cardinal Rule: Max parallel active consumers in 1 group = Number of Partitions. If you have 3 partitions and 4 consumers, 1 stays idle.</text>
    
  </g>
</svg>