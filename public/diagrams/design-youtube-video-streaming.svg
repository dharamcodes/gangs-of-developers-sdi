<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#cbd5e1" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
  </defs>
  <rect width="1100" height="580" fill="#ffffff" />
  <rect width="1100" height="580" fill="url(#dotGrid)" />

  <text x="40" y="46" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">
    YouTube / Video Streaming Architecture
  </text>

  <!-- 1. Creator Client -->
  <rect x="40" y="95" width="175" height="125" rx="8" fill="#dbeafe" stroke="#0f172a" stroke-width="2.2" />
  <text x="127" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Creator Client</text>
  <text x="127" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">Resumable Multipart</text>
  <text x="127" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">64 MB Chunk Upload</text>
  <text x="127" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">(Pre-Signed S3 URLs)</text>

  <!-- Arrow 1 -->
  <line x1="215" y1="157" x2="295" y2="157" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arrow)" />
  <circle cx="255" cy="135" r="13" fill="#0f172a" />
  <text x="255" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>

  <!-- 2. Raw Video Object Storage (S3) -->
  <rect x="300" y="95" width="180" height="125" rx="10" fill="#fef3c7" stroke="#0f172a" stroke-width="2.2" />
  <text x="390" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Raw Video S3 Store</text>
  <text x="390" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">Original Source Blob</text>
  <text x="390" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">S3 Event Notification</text>
  <text x="390" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">Triggers DAG Pipeline</text>

  <!-- Arrow 2 -->
  <line x1="480" y1="157" x2="555" y2="157" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arrow)" />
  <circle cx="517" cy="135" r="13" fill="#0f172a" />
  <text x="517" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>

  <!-- 3. Parallel GOP DAG Transcoding Engine -->
  <rect x="560" y="80" width="250" height="165" rx="8" fill="#dcfce7" stroke="#0f172a" stroke-width="2.2" />
  <text x="685" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Parallel GOP DAG Transcoder</text>
  <rect x="578" y="120" width="214" height="34" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  <text x="685" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">IDR Keyframe 4s GOP Splitter</text>
  <rect x="578" y="162" width="214" height="34" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  <text x="685" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0f172a">Fast Lane: 360p/720p H.264</text>
  <rect x="578" y="204" width="214" height="30" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  <text x="685" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">Async: 1080p/4K VP9 &amp; AV1</text>

  <!-- Arrow 3 -->
  <line x1="810" y1="157" x2="875" y2="157" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arrow)" />
  <circle cx="842" cy="135" r="13" fill="#0f172a" />
  <text x="842" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>

  <!-- 4. Segmented Media & Manifest Origin -->
  <rect x="880" y="85" width="185" height="150" rx="10" fill="#fce7f3" stroke="#0f172a" stroke-width="2.2" />
  <text x="972" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Encoded S3 Origin</text>
  <text x="972" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• HLS master.m3u8</text>
  <text x="972" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• DASH manifest.mpd</text>
  <text x="972" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• 4s fMP4 .m4s Chunks</text>
  <text x="972" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Thumbnail Sprites</text>

  <!-- Arrow 4 Down to Edge CDN -->
  <line x1="972" y1="235" x2="972" y2="345" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arrow)" />
  <circle cx="996" cy="290" r="13" fill="#0f172a" />
  <text x="996" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>

  <!-- 5. Global ISP Edge CDN PoPs -->
  <rect x="560" y="350" width="505" height="150" rx="10" fill="#e0e7ff" stroke="#0f172a" stroke-width="2.2" />
  <text x="812" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Global 3-Tier ISP Edge CDN (Open Connect / Edge PoPs)</text>
  <rect x="585" y="402" width="215" height="76" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" />
  <text x="692" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">L1 Edge NVMe Cache (95% Hit)</text>
  <text x="692" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">Serves .m4s over HTTP/3 QUIC</text>
  <rect x="825" y="402" width="215" height="76" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" />
  <text x="932" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">L2 Regional Mid-Tier Shield</text>
  <text x="932" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">Request Coalescing + Pre-Warm</text>

  <!-- 6. Viewer Adaptive Bitrate Player -->
  <rect x="40" y="350" width="370" height="150" rx="8" fill="#fed7aa" stroke="#0f172a" stroke-width="2.2" />
  <text x="225" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Viewer Client (Adaptive Bitrate Player)</text>
  <text x="225" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Fetches Signed Manifest (.m3u8 / .mpd)</text>
  <text x="225" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Measures Bandwidth &amp; Buffer per 4s Chunk</text>
  <text x="225" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Dynamically Switches 360p ↔ 720p ↔ 1080p ↔ 4K</text>

  <!-- Arrow 5 CDN to Viewer -->
  <line x1="560" y1="425" x2="415" y2="425" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arrow)" />
  <circle cx="487" cy="402" r="13" fill="#0f172a" />
  <text x="487" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text x="487" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">4s Segment Stream</text>
</svg>