<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">MULTI-REGION ACTIVE-ACTIVE CLOUD ARCHITECTURE</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Global Anycast Routing • Sub-Second Regional Failover • Cross-Region Data Replication &amp; Partition Isolation</text>

  <g id="diagram-canvas">
    
      <!-- Global Edge -->
      <rect x="350" y="85" width="300" height="50" rx="8" fill="#0f172a" />
      <text x="500" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">GLOBAL EDGE ROUTER (CLOUDFLARE / ROUTE 53)</text>
      <text x="500" y="122" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#38bdf8">Anycast BGP Geo-Proximity + Health Check Probes</text>

      <line x1="420" y1="135" x2="260" y2="170" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
      <text x="320" y="150" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#0284c7">Americas Traffic</text>

      <line x1="580" y1="135" x2="740" y2="170" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" />
      <text x="680" y="150" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#059669">Europe / APAC Traffic</text>

      <!-- Region 1: US-East -->
      <rect x="50" y="170" width="410" height="145" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <rect x="50" y="170" width="410" height="28" rx="8" fill="#0284c7" />
      <text x="255" y="189" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#ffffff">REGION 1: US-EAST (Active / Primary)</text>

      <rect x="70" y="210" width="100" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="120" y="228" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700">EKS Fleet</text>
      <text x="120" y="242" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#64748b">App Pods</text>

      <rect x="190" y="210" width="100" height="40" rx="4" fill="#e0f2fe" stroke="#38bdf8" />
      <text x="240" y="228" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#0369a1">Redis Cluster</text>
      <text x="240" y="242" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#0284c7">Local In-Memory</text>

      <rect x="310" y="210" width="130" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" />
      <text x="375" y="228" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#92400e">Aurora Global DB</text>
      <text x="375" y="242" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#b45309">Read &amp; Write Master</text>

      <text x="255" y="280" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Local VPC Latency: &lt; 2ms • Independent failure domain</text>
      <text x="255" y="295" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Zero cross-region blocking on client writes</text>

      <!-- Cross region replication link -->
      <line x1="460" y1="230" x2="540" y2="230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowAmber)" />
      <text x="500" y="222" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#b45309">Fiber Link</text>
      <text x="500" y="245" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#64748b">Async &lt; 80ms</text>

      <!-- Region 2: EU-West -->
      <rect x="540" y="170" width="410" height="145" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
      <rect x="540" y="170" width="410" height="28" rx="8" fill="#059669" />
      <text x="745" y="189" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#ffffff">REGION 2: EU-WEST (Active / Secondary)</text>

      <rect x="560" y="210" width="100" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="610" y="228" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700">EKS Fleet</text>
      <text x="610" y="242" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#64748b">App Pods</text>

      <rect x="680" y="210" width="100" height="40" rx="4" fill="#dcfce7" stroke="#86efac" />
      <text x="730" y="228" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#15803d">Redis Cluster</text>
      <text x="730" y="242" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#166534">Local In-Memory</text>

      <rect x="800" y="210" width="130" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" />
      <text x="865" y="228" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#92400e">Aurora Global DB</text>
      <text x="865" y="242" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#b45309">Replica + Write Forward</text>

      <text x="745" y="280" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Local VPC Latency: &lt; 2ms • Independent failure domain</text>
      <text x="745" y="295" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Failover promotion to Master completes in &lt; 1 minute</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Staff Rule: Partition user data by home geography so 99% of writes commit locally, avoiding cross-region distributed consensus latency.</text>
    
  </g>
</svg>