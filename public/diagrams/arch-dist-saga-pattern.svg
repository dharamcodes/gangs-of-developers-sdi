<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">DISTRIBUTED TRANSACTIONS: SAGA PATTERN ARCHITECTURE</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Orchestration vs Choreography • Forward Recovery • Compensating Transactions on Downstream Failure</text>

  <g id="diagram-canvas">
    
      <!-- Top: Orchestration Flow -->
      <rect x="40" y="85" width="920" height="115" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="40" y="85" width="920" height="28" rx="8" fill="#0f172a" />
      <text x="60" y="104" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">ORCHESTRATION SAGA (Centralized State Coordinator)</text>

      <rect x="60" y="125" width="160" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
      <text x="140" y="147" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#92400e">Saga Orchestrator</text>
      <text x="140" y="165" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#b45309">Temporal / Cadence Engine</text>

      <line x1="220" y1="145" x2="280" y2="145" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)" />
      <text x="250" y="138" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#059669">1. Reserve</text>

      <rect x="285" y="125" width="130" height="60" rx="6" fill="#f0fdf4" stroke="#22c55e" />
      <text x="350" y="150" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#15803d">Order Svc</text>
      <text x="350" y="168" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#166534">Pending State</text>

      <line x1="415" y1="145" x2="475" y2="145" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)" />
      <text x="445" y="138" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#059669">2. Charge</text>

      <rect x="480" y="125" width="130" height="60" rx="6" fill="#f0fdf4" stroke="#22c55e" />
      <text x="545" y="150" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#15803d">Payment Svc</text>
      <text x="545" y="168" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#166534">Card Charged</text>

      <line x1="610" y1="145" x2="670" y2="145" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)" />
      <text x="640" y="138" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#dc2626">3. Out of Stock!</text>

      <rect x="675" y="125" width="130" height="60" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
      <text x="740" y="150" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#b91c1c">Inventory Svc</text>
      <text x="740" y="168" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#dc2626">FAILURE</text>

      <rect x="820" y="125" width="125" height="60" rx="6" fill="#fef2f2" stroke="#ef4444" />
      <text x="882" y="148" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#b91c1c">COMPENSATION</text>
      <text x="882" y="164" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#7f1d1d">• Refund Payment</text>
      <text x="882" y="177" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#7f1d1d">• Cancel Order</text>

      <!-- Bottom: Choreography Flow -->
      <rect x="40" y="210" width="920" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="40" y="210" width="920" height="28" rx="8" fill="#f1f5f9" />
      <text x="60" y="229" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a">CHOREOGRAPHY SAGA (Decentralized Kafka Event Topics)</text>

      <rect x="60" y="250" width="130" height="55" rx="5" fill="#f8fafc" stroke="#94a3b8" />
      <text x="125" y="274" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700">Order Service</text>
      <text x="125" y="290" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#059669">Publishes OrderCreated</text>

      <line x1="190" y1="277" x2="250" y2="277" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

      <rect x="255" y="250" width="140" height="55" rx="5" fill="#0f172a" />
      <text x="325" y="274" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">Topic: order-events</text>
      <text x="325" y="290" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#38bdf8">Kafka Broker</text>

      <line x1="395" y1="277" x2="455" y2="277" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

      <rect x="460" y="250" width="130" height="55" rx="5" fill="#f8fafc" stroke="#94a3b8" />
      <text x="525" y="274" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700">Payment Svc</text>
      <text x="525" y="290" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#059669">Publishes PaymentDone</text>

      <line x1="590" y1="277" x2="650" y2="277" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

      <rect x="655" y="250" width="140" height="55" rx="5" fill="#0f172a" />
      <text x="725" y="274" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">Topic: payment-events</text>
      <text x="725" y="290" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#38bdf8">Kafka Broker</text>

      <line x1="795" y1="277" x2="825" y2="277" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

      <rect x="830" y="250" width="115" height="55" rx="5" fill="#f8fafc" stroke="#94a3b8" />
      <text x="887" y="274" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700">Inventory Svc</text>
      <text x="887" y="290" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Reserves stock</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Architecture Rule: Use Choreography for simple 2-3 step workflows. Use Orchestration (Temporal) for mission-critical multi-step payment flows.</text>
    
  </g>
</svg>