<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#ffffff" />
  <rect width="1000" height="360" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">CAP THEOREM &amp; PACELC TRADE-OFF SPECTRUM</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Consistency (C) • Availability (A) • Partition Tolerance (P) • PACELC (Else: Latency vs Consistency)</text>

  <g id="diagram-canvas">
    
      <polygon points="250,110 100,310 400,310" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
      <circle cx="250" cy="110" r="30" fill="#0284c7" />
      <text x="250" y="115" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">C</text>
      <text x="250" y="132" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#e0f2fe">Consistency</text>
      <circle cx="100" cy="310" r="30" fill="#059669" />
      <text x="100" y="315" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">A</text>
      <text x="100" y="332" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#d1fae5">Availability</text>
      <circle cx="400" cy="310" r="30" fill="#f59e0b" />
      <text x="400" y="315" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">P</text>
      <text x="400" y="332" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#451a03">Partition Tol.</text>
      <rect x="290" y="195" width="130" height="32" rx="6" fill="#0f172a" />
      <text x="355" y="210" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fbbf24">CP Systems</text>
      <text x="355" y="222" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#94a3b8">HBase, Spanner, Redis</text>
      <rect x="75" y="195" width="130" height="32" rx="6" fill="#0f172a" />
      <text x="140" y="210" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">CA (Non-Partitionable)</text>
      <text x="140" y="222" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#94a3b8">Single-node RDBMS only</text>
      <rect x="185" y="305" width="130" height="32" rx="6" fill="#0f172a" />
      <text x="250" y="320" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399">AP Systems</text>
      <text x="250" y="332" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#94a3b8">Cassandra, DynamoDB, Couch</text>
      <rect x="470" y="95" width="490" height="225" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="495" y="125" font-family="sans-serif" font-size="13" font-weight="800" fill="#0f172a">PACELC Theorem Matrix</text>
      <text x="495" y="145" font-family="sans-serif" font-size="10.5" fill="#475569">If Partition (P) -&gt; Trade Availability (A) vs Consistency (C)</text>
      <text x="495" y="162" font-family="sans-serif" font-size="10.5" fill="#475569">Else (E)          -&gt; Trade Latency (L) vs Consistency (C)</text>
      <rect x="495" y="180" width="220" height="60" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="505" y="200" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e40af">PC/EC (Consistent)</text>
      <text x="505" y="217" font-family="sans-serif" font-size="9" fill="#1e3a8a">Partition -&gt; Strong Consistency (Wait)</text>
      <text x="505" y="230" font-family="sans-serif" font-size="9" fill="#1e3a8a">Normal -&gt; Wait for synchronous replica</text>
      <rect x="730" y="180" width="215" height="60" rx="6" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="740" y="200" font-family="sans-serif" font-size="11" font-weight="700" fill="#166534">PA/EL (Low Latency)</text>
      <text x="740" y="217" font-family="sans-serif" font-size="9" fill="#14532d">Partition -&gt; Available (Eventual sync)</text>
      <text x="740" y="230" font-family="sans-serif" font-size="9" fill="#14532d">Normal -&gt; Return fast from local cache</text>
      <rect x="495" y="255" width="450" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="510" y="275" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Production Rule of Thumb:</text>
      <text x="510" y="292" font-family="sans-serif" font-size="9.5" fill="#64748b">Network partitions are inevitable across cloud AZs/regions. Design for AP or CP intentionally.</text>
    
  </g>
</svg>