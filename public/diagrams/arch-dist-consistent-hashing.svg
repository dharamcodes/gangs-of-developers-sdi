<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">CONSISTENT HASHING &amp; VIRTUAL NODES (VNODES) ARCHITECTURE</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Hash Ring (0 to 2^32-1) • Clockwise Key Assignment • Hotspot Elimination • Minimal Key Rebalancing on Node Death</text>

  <g id="diagram-canvas">
    
      <!-- Ring Canvas -->
      <circle cx="280" cy="205" r="95" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-dasharray="4,4" />

      <!-- Nodes on ring -->
      <!-- Node A -->
      <circle cx="280" cy="110" r="18" fill="#059669" />
      <text x="280" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff">Node A</text>

      <!-- Node B -->
      <circle cx="375" cy="205" r="18" fill="#0284c7" />
      <text x="375" y="210" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff">Node B</text>

      <!-- Node C -->
      <circle cx="280" cy="300" r="18" fill="#d97706" />
      <text x="280" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff">Node C</text>

      <!-- Node D -->
      <circle cx="185" cy="205" r="18" fill="#7e22ce" />
      <text x="185" y="210" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff">Node D</text>

      <!-- Center text -->
      <text x="280" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a">HASH RING</text>
      <text x="280" y="215" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#64748b">0 to (2^32 - 1)</text>

      <!-- Keys -->
      <circle cx="340" cy="135" r="5" fill="#ef4444" />
      <text x="360" y="138" font-family="sans-serif" font-size="9" font-weight="700" fill="#b91c1c">Key 1 → Node B</text>

      <circle cx="330" cy="275" r="5" fill="#ef4444" />
      <text x="350" y="278" font-family="sans-serif" font-size="9" font-weight="700" fill="#b91c1c">Key 2 → Node C</text>

      <circle cx="210" cy="140" r="5" fill="#ef4444" />
      <text x="140" y="130" font-family="sans-serif" font-size="9" font-weight="700" fill="#b91c1c">Key 3 → Node A</text>

      <!-- Right Explanation Panel -->
      <rect x="490" y="85" width="470" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="490" y="85" width="470" height="34" rx="8" fill="#0f172a" />
      <text x="510" y="108" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">VIRTUAL NODES (VNODES) MATHEMATICS</text>

      <rect x="510" y="130" width="430" height="52" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="525" y="148" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">The Hotspot Problem with Physical Nodes:</text>
      <text x="525" y="165" font-family="sans-serif" font-size="8.5" fill="#475569">With only 3 physical nodes, one node may receive 70% of keys due to non-uniform distribution.</text>

      <rect x="510" y="190" width="430" height="52" rx="5" fill="#f0fdf4" stroke="#86efac" />
      <text x="525" y="208" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#15803d">The Vnodes Solution:</text>
      <text x="525" y="225" font-family="sans-serif" font-size="8.5" fill="#166534">Assign 100 to 256 virtual tokens per physical node (e.g. A-1, A-2... A-256). Variance drops to &lt; 3%.</text>

      <rect x="510" y="250" width="430" height="60" rx="5" fill="#e0f2fe" stroke="#7dd3fc" />
      <text x="525" y="268" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">Rebalance Efficiency (When Node Dies or Joins):</text>
      <text x="525" y="285" font-family="sans-serif" font-size="8.5" fill="#0284c7">Traditional Modulo (N): 100% of keys move (catastrophic cache stampede).</text>
      <text x="525" y="299" font-family="sans-serif" font-size="8.5" fill="#0284c7">Consistent Hashing: Only K/N keys move (smooth, zero stampede).</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Architecture Rule: In Cassandra / DynamoDB rings, configure 128-256 virtual nodes per server to achieve statistically uniform hash distribution.</text>
    
  </g>
</svg>