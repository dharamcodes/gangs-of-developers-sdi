<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#ffffff" />
  <rect width="1000" height="360" fill="url(#grid)" />
  <!-- Header Title (Clean Whiteboard) -->
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">CIRCUIT BREAKER STATE MACHINE ARCHITECTURE</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#475569">Fault Isolation • CLOSED (Normal) • OPEN (Tripped / Fast-Fail) • HALF-OPEN (Canary Probe)</text>

  <g id="diagram-canvas">
    
      <rect x="60" y="130" width="240" height="120" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
      <text x="180" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#15803d">CLOSED (Normal)</text>
      <text x="180" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">Requests pass through to downstream</text>
      <text x="180" y="202" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#166534">Failure rate &lt; 50% threshold</text>
      <text x="180" y="225" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#14532d">Status: HEALTHY</text>
      <rect x="680" y="130" width="260" height="120" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
      <text x="810" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#b91c1c">OPEN (Tripped)</text>
      <text x="810" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">Fails FAST immediately (No network call)</text>
      <text x="810" y="202" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#991b1b">Returns cached fallback or 503</text>
      <text x="810" y="225" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#7f1d1d">Status: SLEEPING (Wait 30s)</text>
      <rect x="370" y="130" width="250" height="120" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2" />
      <text x="495" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#854d0e">HALF-OPEN (Trial)</text>
      <text x="495" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#713f12">Allows small canary % of probe requests</text>
      <text x="495" y="202" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#713f12">Checks if downstream has recovered</text>
      <text x="495" y="225" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#713f12">Status: PROBING</text>
      <path d="M 300 150 Q 490 85 680 150" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />
      <text x="490" y="105" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#dc2626">Failure rate &gt; 50% (Trip)</text>
      <line x1="680" y1="210" x2="620" y2="210" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)" />
      <text x="650" y="200" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#854d0e">Timeout elapsed (30s)</text>
      <line x1="370" y1="210" x2="300" y2="210" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" />
      <text x="335" y="200" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#15803d">Canary Succeeds</text>
      <path d="M 495 250 Q 495 285 750 250" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />
      <text x="620" y="285" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#dc2626">Canary Fails (Re-trip immediately)</text>
      <rect x="60" y="295" width="880" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="500" y="320" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#334155">Primary Goal: Prevents cascading failure across microservices by cutting off dead dependencies before connection threads saturate.</text>
    
  </g>
</svg>