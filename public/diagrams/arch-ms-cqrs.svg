<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">CQRS: COMMAND QUERY RESPONSIBILITY SEGREGATION ARCHITECTURE</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Normalized Write Domain Model vs Denormalized Read Views • Change Data Capture (CDC) Event Streaming</text>

  <g id="diagram-canvas">
    
      <!-- Client -->
      <rect x="40" y="150" width="85" height="70" rx="6" fill="#0f172a" />
      <text x="82" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">Client UI</text>
      <text x="82" y="196" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#94a3b8">Web / Mobile</text>

      <!-- Command Write Path -->
      <line x1="125" y1="165" x2="210" y2="120" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />
      <text x="165" y="132" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#b45309">POST /orders</text>

      <rect x="215" y="95" width="220" height="65" rx="6" fill="#fefce8" stroke="#f59e0b" stroke-width="1.5" />
      <text x="325" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#854d0e">COMMAND SERVICE (Write)</text>
      <text x="325" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#713f12">Executes Domain Validation &amp; Invariants</text>
      <text x="325" y="149" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#713f12">Writes to PostgreSQL (Normalized 3NF)</text>

      <!-- CDC Event Stream -->
      <line x1="435" y1="125" x2="520" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
      <text x="477" y="117" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">WAL Commit</text>

      <rect x="525" y="95" width="180" height="65" rx="6" fill="#0f172a" />
      <text x="615" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff">EVENT BUS (KAFKA)</text>
      <text x="615" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#38bdf8">Debezium CDC Connector</text>
      <text x="615" y="149" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#f59e0b">Topic: order-events</text>

      <!-- Projector -->
      <line x1="705" y1="125" x2="760" y2="155" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" />
      <text x="735" y="135" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#059669">Async Projection</text>

      <!-- Query Read Path -->
      <rect x="765" y="130" width="195" height="135" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
      <rect x="765" y="130" width="195" height="28" rx="8" fill="#15803d" />
      <text x="862" y="149" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff">READ DATASTORE (View)</text>
      <text x="862" y="178" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#166534">Elasticsearch / Redis</text>
      <text x="862" y="196" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#334155">Pre-joined Denormalized JSON</text>
      <text x="862" y="214" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#334155">Sub-millisecond query response</text>
      <text x="862" y="235" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#15803d">Zero SQL Joins Needed</text>

      <line x1="765" y1="230" x2="445" y2="230" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />

      <rect x="215" y="200" width="220" height="65" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
      <text x="325" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0369a1">QUERY SERVICE (Read)</text>
      <text x="325" y="239" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#0284c7">High Concurrency In-Memory Read</text>
      <text x="325" y="253" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#0284c7">Scales to 100k+ read req/sec</text>

      <line x1="215" y1="230" x2="125" y2="200" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
      <text x="165" y="230" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#0369a1">GET /orders</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Staff Rule: CQRS eliminates complex SQL joins by projecting denormalized read views via CDC (Debezium), isolating writes from read load.</text>
    
  </g>
</svg>