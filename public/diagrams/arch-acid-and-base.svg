<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />
  <!-- Header Title (Clean Whiteboard) -->
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">CONSISTENCY MODELS: ACID (PESSIMISTIC) VS BASE (EVENTUAL)</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#475569">RDBMS Strict Serializability vs Distributed Eventual Consistency • Trade-Offs in Distributed Systems</text>

  <g id="diagram-canvas">
    
      <rect x="50" y="85" width="420" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="50" y="85" width="420" height="34" rx="8" fill="#0f172a" />
      <text x="70" y="108" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">ACID: Strict Guarantees (RDBMS)</text>
      <text x="390" y="108" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Pessimistic</text>

      <rect x="70" y="130" width="380" height="36" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="85" y="152" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">A • Atomicity:</text>
      <text x="180" y="152" font-family="sans-serif" font-size="10" fill="#475569">All operations succeed or all roll back (WAL log)</text>

      <rect x="70" y="172" width="380" height="36" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="85" y="194" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">C • Consistency:</text>
      <text x="180" y="194" font-family="sans-serif" font-size="10" fill="#475569">DB moves only from one valid state to another</text>

      <rect x="70" y="214" width="380" height="36" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="85" y="236" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">I • Isolation:</text>
      <text x="180" y="236" font-family="sans-serif" font-size="10" fill="#475569">Concurrent transactions do not interfere (2PL / MVCC)</text>

      <rect x="70" y="256" width="380" height="36" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="85" y="278" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">D • Durability:</text>
      <text x="180" y="278" font-family="sans-serif" font-size="10" fill="#475569">Committed changes survive system reboot (fsync disk)</text>

      <rect x="500" y="85" width="450" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="500" y="85" width="450" height="34" rx="8" fill="#0f172a" />
      <text x="520" y="108" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">BASE: High-Availability (Distributed NoSQL)</text>
      <text x="870" y="108" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Optimistic</text>

      <rect x="520" y="130" width="410" height="48" rx="5" fill="#fefce8" stroke="#fef08a" />
      <text x="535" y="152" font-family="sans-serif" font-size="10" font-weight="700" fill="#854d0e">BA • Basically Available:</text>
      <text x="535" y="168" font-family="sans-serif" font-size="9.5" fill="#713f12">System guarantees response, even if stale or degraded during network partitions.</text>

      <rect x="520" y="186" width="410" height="48" rx="5" fill="#fefce8" stroke="#fef08a" />
      <text x="535" y="208" font-family="sans-serif" font-size="10" font-weight="700" fill="#854d0e">S • Soft State:</text>
      <text x="535" y="224" font-family="sans-serif" font-size="9.5" fill="#713f12">State may change over time without new input due to background convergence.</text>

      <rect x="520" y="242" width="410" height="48" rx="5" fill="#fefce8" stroke="#fef08a" />
      <text x="535" y="264" font-family="sans-serif" font-size="10" font-weight="700" fill="#854d0e">E • Eventual Consistency:</text>
      <text x="535" y="280" font-family="sans-serif" font-size="9.5" fill="#713f12">Given enough time without new updates, all distributed replicas will converge.</text>

      <rect x="50" y="332" width="900" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Architecture Rule: Maintain local ACID within single service boundaries; adopt BASE (Sagas/Outbox) across distributed microservice boundaries.</text>
    
  </g>
</svg>