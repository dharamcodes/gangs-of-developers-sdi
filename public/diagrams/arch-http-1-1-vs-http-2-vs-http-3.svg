<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">PROTOCOL EVOLUTION: HTTP/1.1 VS HTTP/2 VS HTTP/3 (QUIC)</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Head-of-Line (HoL) Blocking • Multiplexed Binary Streams • 0-RTT Connection Resumption • UDP vs TCP</text>

  <g id="diagram-canvas">
    
      <!-- Col 1: HTTP/1.1 -->
      <rect x="40" y="85" width="290" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="40" y="85" width="290" height="32" rx="8" fill="#f1f5f9" />
      <text x="55" y="106" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">HTTP/1.1 (Sequential)</text>

      <rect x="55" y="130" width="260" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5" />
      <text x="185" y="147" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#991b1b">Req 1: GET /index.html [Blocks Conn]</text>

      <rect x="55" y="162" width="260" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="185" y="179" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Req 2: GET /style.css (WAITING...)</text>

      <rect x="55" y="194" width="260" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="185" y="211" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Req 3: GET /app.js (WAITING...)</text>

      <rect x="55" y="235" width="260" height="70" rx="5" fill="#fef2f2" />
      <text x="65" y="253" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">HoL Blocking at Application Tier:</text>
      <text x="65" y="270" font-family="sans-serif" font-size="8.5" fill="#7f1d1d">• Max 6 TCP sockets per browser domain</text>
      <text x="65" y="285" font-family="sans-serif" font-size="8.5" fill="#7f1d1d">• Uncompressed plain-text headers</text>

      <!-- Col 2: HTTP/2 -->
      <rect x="355" y="85" width="290" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="355" y="85" width="290" height="32" rx="8" fill="#f1f5f9" />
      <text x="370" y="106" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">HTTP/2 (Multiplexed TCP)</text>

      <rect x="370" y="130" width="260" height="24" rx="4" fill="#e0f2fe" stroke="#7dd3fc" />
      <text x="500" y="146" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#0369a1">Stream 1: GET /index.html (Frame 1)</text>

      <rect x="370" y="160" width="260" height="24" rx="4" fill="#e0e7ff" stroke="#a5b4fc" />
      <text x="500" y="176" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#4338ca">Stream 3: GET /style.css (Interleaved)</text>

      <rect x="370" y="190" width="260" height="24" rx="4" fill="#fef3c7" stroke="#fcd34d" />
      <text x="500" y="206" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#92400e">Stream 5: GET /app.js (Interleaved)</text>

      <rect x="370" y="235" width="260" height="70" rx="5" fill="#fefce8" />
      <text x="380" y="253" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#854d0e">TCP-Level HoL Bottleneck:</text>
      <text x="380" y="270" font-family="sans-serif" font-size="8.5" fill="#713f12">• 1 shared TCP connection + HPACK compression</text>
      <text x="380" y="285" font-family="sans-serif" font-size="8.5" fill="#713f12">• Single dropped packet stalls ALL streams!</text>

      <!-- Col 3: HTTP/3 -->
      <rect x="670" y="85" width="290" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="670" y="85" width="290" height="32" rx="8" fill="#f1f5f9" />
      <text x="685" y="106" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">HTTP/3 (QUIC / UDP)</text>

      <rect x="685" y="130" width="260" height="24" rx="4" fill="#dcfce7" stroke="#86efac" />
      <text x="815" y="146" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#15803d">QUIC Stream A (Independent UDP)</text>

      <rect x="685" y="160" width="260" height="24" rx="4" fill="#dcfce7" stroke="#86efac" />
      <text x="815" y="176" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#15803d">QUIC Stream B (Independent UDP)</text>

      <rect x="685" y="190" width="260" height="24" rx="4" fill="#dcfce7" stroke="#86efac" />
      <text x="815" y="206" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#15803d">QUIC Stream C (Independent UDP)</text>

      <rect x="685" y="235" width="260" height="70" rx="5" fill="#f0fdf4" />
      <text x="695" y="253" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#15803d">Zero HoL Blocking:</text>
      <text x="695" y="270" font-family="sans-serif" font-size="8.5" fill="#166534">• Dropped UDP packet affects ONLY its own stream</text>
      <text x="695" y="285" font-family="sans-serif" font-size="8.5" fill="#166534">• 0-RTT TLS 1.3 Handshake + Connection Migration</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Staff Rule: Deploy HTTP/3 QUIC on mobile client edge to eliminate cellular packet drop latency; use HTTP/2 or gRPC internally.</text>
    
  </g>
</svg>