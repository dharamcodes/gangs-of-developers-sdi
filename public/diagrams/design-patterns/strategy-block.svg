<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#38bdf8" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#38bdf8" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">STRATEGY PATTERN — UML ARCHITECTURE</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Defines a family of algorithms, encapsulates each one, and makes them interchangeable at runtime.</text>
  <rect x="810" y="18" width="162" height="26" rx="13" fill="#38bdf8" opacity="0.18" stroke="#38bdf8" stroke-width="1" />
  <text x="891" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#38bdf8">UML Class Architecture</text>

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 300 170 L 550 170" class="arrow-line" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="395" y="145" width="60" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="425" y="158.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">delegates to</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 530 320 L 630 250" class="arrow-line" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="540" y="275" width="60" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="570" y="288.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">implements</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 780 320 L 710 250" class="arrow-line" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="725" y="275" width="60" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="755" y="288.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">implements</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="50" y="120" width="250" height="140" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 51 121 L 299 121 A 9 9 0 0 1 300 130 L 300 160 L 50 160 L 50 130 A 9 9 0 0 1 51 121 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="50" y1="160" x2="300" y2="160" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(62, 131)">
          <circle cx="9" cy="9" r="7" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="3" fill="none" stroke="#38bdf8" stroke-width="1.3"/>
          <circle cx="9" cy="9" r="1.2" fill="#38bdf8"/>
        </g>
          
          
            <text x="86" y="136" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;context&gt;&gt;</text>
            <text x="86" y="151" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">PaymentService (Context)</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="218" y="128" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="255" y="140.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Context</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="175" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- strategy: PaymentStrategy</text>
        
          <text x="175" y="199" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ setStrategy(s)</text>
        
          <text x="175" y="218" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ process(amount: long)</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="550" y="110" width="260" height="140" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 551 111 L 809 111 A 9 9 0 0 1 810 120 L 810 150 L 550 150 L 550 120 A 9 9 0 0 1 551 111 Z" fill="#10b981" opacity="0.12" />
        <line x1="550" y1="150" x2="810" y2="150" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(562, 121)">
          <circle cx="9" cy="9" r="6.5" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <circle cx="9" cy="9" r="2.5" fill="#10b981"/>
        </g>
          
          
            <text x="586" y="126" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;interface&gt;&gt;</text>
            <text x="586" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">PaymentStrategy</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="728" y="118" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="765" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Strategy Interface</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="680" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ pay(amountInCents: long): void</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="420" y="320" width="220" height="130" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 421 321 L 639 321 A 9 9 0 0 1 640 330 L 640 360 L 420 360 L 420 330 A 9 9 0 0 1 421 321 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="420" y1="360" x2="640" y2="360" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(432, 331)">
          <circle cx="9" cy="9" r="7" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="3" fill="none" stroke="#f59e0b" stroke-width="1.3"/>
          <circle cx="9" cy="9" r="1.2" fill="#f59e0b"/>
        </g>
          
          
            <text x="456" y="336" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#f59e0b" letter-spacing="0.04em">&lt;&lt;concrete-strat&gt;&gt;</text>
            <text x="456" y="351" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">CreditCardPayment</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="558" y="328" width="74" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="595" y="340.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Strategy A</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="530" y="380" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ pay(): authorize Visa/MC</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="670" y="320" width="220" height="130" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 671 321 L 889 321 A 9 9 0 0 1 890 330 L 890 360 L 670 360 L 670 330 A 9 9 0 0 1 671 321 Z" fill="#a855f7" opacity="0.12" />
        <line x1="670" y1="360" x2="890" y2="360" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(682, 331)">
          <circle cx="9" cy="9" r="7" fill="none" stroke="#a855f7" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="3" fill="none" stroke="#a855f7" stroke-width="1.3"/>
          <circle cx="9" cy="9" r="1.2" fill="#a855f7"/>
        </g>
          
          
            <text x="706" y="336" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#a855f7" letter-spacing="0.04em">&lt;&lt;concrete-strat&gt;&gt;</text>
            <text x="706" y="351" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#a855f7">CryptoPayment</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="808" y="328" width="74" height="18" rx="9" fill="#a855f7" opacity="0.18" />
          <text x="845" y="340.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#a855f7">Strategy B</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="780" y="380" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ pay(): verify blockchain</text>
        
      </g>
    
</svg>