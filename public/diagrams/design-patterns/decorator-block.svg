<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">DECORATOR PATTERN — UML ARCHITECTURE</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Attaches additional responsibilities to an object dynamically, providing a flexible alternative to subclassing for extending functionality.</text>
  <rect x="810" y="18" width="162" height="26" rx="13" fill="#f59e0b" opacity="0.18" stroke="#f59e0b" stroke-width="1" />
  <text x="891" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#f59e0b">UML Class Architecture</text>

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 200 290 L 370 230" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="240" y="240" width="60" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="270" y="253.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">implements</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 640 280 L 490 230" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="550" y="240" width="60" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="580" y="253.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">implements</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 780 340 C 850 340 850 160 560 160" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="820" y="230" width="60" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="850" y="243.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">wraps (has-a)</text>
          
        
      </g>
    
      <g id="conn-3">
        <path d="M 470 460 L 580 420" class="arrow-line" stroke="#f59e0b" marker-end="url(#uml-inherit)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="480" y="430" width="60" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="510" y="443.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">extends</text>
          
        
      </g>
    
      <g id="conn-4">
        <path d="M 750 460 L 680 420" class="arrow-line" stroke="#f59e0b" marker-end="url(#uml-inherit)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="700" y="430" width="60" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="730" y="443.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">extends</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="300" y="100" width="260" height="130" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 301 101 L 559 101 A 9 9 0 0 1 560 110 L 560 140 L 300 140 L 300 110 A 9 9 0 0 1 301 101 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="300" y1="140" x2="560" y2="140" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(312, 111)">
          <circle cx="9" cy="9" r="6.5" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
          <circle cx="9" cy="9" r="2.5" fill="#f59e0b"/>
        </g>
          
          
            <text x="336" y="116" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#f59e0b" letter-spacing="0.04em">&lt;&lt;interface&gt;&gt;</text>
            <text x="336" y="131" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">DataStream</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="478" y="108" width="74" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="515" y="120.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Component</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="430" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ write(data: byte[]): void</text>
        
          <text x="430" y="179" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ read(): byte[]</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="80" y="290" width="240" height="120" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 81 291 L 319 291 A 9 9 0 0 1 320 300 L 320 330 L 80 330 L 80 300 A 9 9 0 0 1 81 291 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="80" y1="330" x2="320" y2="330" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(92, 301)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#38bdf8" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#38bdf8" stroke-width="1.2"/>
        </g>
          
          
            <text x="116" y="306" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;concrete&gt;&gt;</text>
            <text x="116" y="321" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">FileStream</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="238" y="298" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="275" y="310.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">ConcreteComponent</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="200" y="350" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ write(): raw disk I/O</text>
        
          <text x="200" y="369" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ read(): raw disk read</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="500" y="280" width="280" height="140" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 501 281 L 779 281 A 9 9 0 0 1 780 290 L 780 320 L 500 320 L 500 290 A 9 9 0 0 1 501 281 Z" fill="#a855f7" opacity="0.12" />
        <line x1="500" y1="320" x2="780" y2="320" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(512, 291)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#a855f7" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#a855f7"/>
          <circle cx="6" cy="3" r="0.7" fill="#a855f7"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#a855f7"/>
        </g>
          
          
            <text x="536" y="296" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#a855f7" letter-spacing="0.04em">&lt;&lt;decorator-base&gt;&gt;</text>
            <text x="536" y="311" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#a855f7">StreamDecorator</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="698" y="288" width="74" height="18" rx="9" fill="#a855f7" opacity="0.18" />
          <text x="735" y="300.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#a855f7">BaseDecorator</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="640" y="340" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- wrappee: DataStream</text>
        
          <text x="640" y="359" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ write(data): wrappee.write(data)</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="360" y="460" width="220" height="120" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 361 461 L 579 461 A 9 9 0 0 1 580 470 L 580 500 L 360 500 L 360 470 A 9 9 0 0 1 361 461 Z" fill="#10b981" opacity="0.12" />
        <line x1="360" y1="500" x2="580" y2="500" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(372, 471)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#10b981"/>
          <circle cx="6" cy="3" r="0.7" fill="#10b981"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#10b981"/>
        </g>
          
          
            <text x="396" y="476" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;concrete-dec&gt;&gt;</text>
            <text x="396" y="491" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">GzipCompressor</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="498" y="468" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="535" y="480.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Decorator A</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="470" y="520" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ write(): gzip -&gt; wrappee</text>
        
      </g>
    
      <g id="node-4" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="640" y="460" width="220" height="120" rx="10" class="card-bg" stroke="#ef4444" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 641 461 L 859 461 A 9 9 0 0 1 860 470 L 860 500 L 640 500 L 640 470 A 9 9 0 0 1 641 461 Z" fill="#ef4444" opacity="0.12" />
        <line x1="640" y1="500" x2="860" y2="500" stroke="#ef4444" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(652, 471)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#ef4444" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#ef4444"/>
          <circle cx="6" cy="3" r="0.7" fill="#ef4444"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#ef4444"/>
        </g>
          
          
            <text x="676" y="476" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#ef4444" letter-spacing="0.04em">&lt;&lt;concrete-dec&gt;&gt;</text>
            <text x="676" y="491" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ef4444">AesEncryptor</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="778" y="468" width="74" height="18" rx="9" fill="#ef4444" opacity="0.18" />
          <text x="815" y="480.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#ef4444">Decorator B</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="750" y="520" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ write(): aes -&gt; wrappee</text>
        
      </g>
    
</svg>