<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#10b981" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#10b981" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">BUILDER PATTERN — UML ARCHITECTURE</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Separates the construction of a complex object from its representation, allowing the same construction process to create various representations.</text>
  <rect x="810" y="18" width="162" height="26" rx="13" fill="#10b981" opacity="0.18" stroke="#10b981" stroke-width="1" />
  <text x="891" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#10b981">UML Class Architecture</text>

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 270 200 L 380 180" class="arrow-line" stroke="#10b981" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="295" y="160" width="60" height="20" rx="6" class="pill-bg" stroke="#10b981" stroke-width="1.2" />
            <text x="325" y="173.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#10b981">directs</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 505 330 L 505 270" class="arrow-line" stroke="#10b981" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="475" y="290" width="60" height="20" rx="6" class="pill-bg" stroke="#10b981" stroke-width="1.2" />
            <text x="505" y="303.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#10b981">implements</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 630 380 L 740 300" class="arrow-dash" stroke="#10b981" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="660" y="330" width="60" height="20" rx="6" class="pill-bg" stroke="#10b981" stroke-width="1.2" />
            <text x="690" y="343.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#10b981">assembles</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="50" y="130" width="220" height="140" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 51 131 L 269 131 A 9 9 0 0 1 270 140 L 270 170 L 50 170 L 50 140 A 9 9 0 0 1 51 131 Z" fill="#10b981" opacity="0.12" />
        <line x1="50" y1="170" x2="270" y2="170" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(62, 141)">
          <rect x="1" y="1" width="16" height="16" rx="2.5" fill="none" stroke="#10b981" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="3.5" fill="none" stroke="#10b981" stroke-width="1.3"/>
          <line x1="9" y1="2" x2="9" y2="5" stroke="#10b981" stroke-width="1.3"/>
          <line x1="9" y1="13" x2="9" y2="16" stroke="#10b981" stroke-width="1.3"/>
          <line x1="2" y1="9" x2="5" y2="9" stroke="#10b981" stroke-width="1.3"/>
          <line x1="13" y1="9" x2="16" y2="9" stroke="#10b981" stroke-width="1.3"/>
        </g>
          
          
            <text x="86" y="146" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;orchestrator&gt;&gt;</text>
            <text x="86" y="161" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">Director</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="188" y="138" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="225" y="150.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Director</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="160" y="190" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- builder: OrderBuilder</text>
        
          <text x="160" y="209" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ buildVipOrder(): Order</text>
        
          <text x="160" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ buildExpressOrder()</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="380" y="110" width="250" height="160" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 381 111 L 629 111 A 9 9 0 0 1 630 120 L 630 150 L 380 150 L 380 120 A 9 9 0 0 1 381 111 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="380" y1="150" x2="630" y2="150" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(392, 121)">
          <circle cx="9" cy="9" r="6.5" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <circle cx="9" cy="9" r="2.5" fill="#38bdf8"/>
        </g>
          
          
            <text x="416" y="126" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;builder-interface&gt;&gt;</text>
            <text x="416" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">OrderBuilder</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="548" y="118" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="585" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Builder</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="505" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ withItem(id): this</text>
        
          <text x="505" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ withDiscount(pct): this</text>
        
          <text x="505" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ withShipping(opt): this</text>
        
          <text x="505" y="227" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ build(): Order</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="380" y="330" width="250" height="130" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 381 331 L 629 331 A 9 9 0 0 1 630 340 L 630 370 L 380 370 L 380 340 A 9 9 0 0 1 381 331 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="380" y1="370" x2="630" y2="370" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(392, 341)">
          <rect x="1" y="1" width="16" height="16" rx="2.5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="3.5" fill="none" stroke="#f59e0b" stroke-width="1.3"/>
          <line x1="9" y1="2" x2="9" y2="5" stroke="#f59e0b" stroke-width="1.3"/>
          <line x1="9" y1="13" x2="9" y2="16" stroke="#f59e0b" stroke-width="1.3"/>
          <line x1="2" y1="9" x2="5" y2="9" stroke="#f59e0b" stroke-width="1.3"/>
          <line x1="13" y1="9" x2="16" y2="9" stroke="#f59e0b" stroke-width="1.3"/>
        </g>
          
          
            <text x="416" y="346" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#f59e0b" letter-spacing="0.04em">&lt;&lt;concrete-builder&gt;&gt;</text>
            <text x="416" y="361" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">StandardOrderBuilder</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="548" y="338" width="74" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="585" y="350.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">ConcreteBuilder</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="505" y="390" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- order: Order</text>
        
          <text x="505" y="409" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ build(): Order (validated)</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="740" y="220" width="200" height="140" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 741 221 L 939 221 A 9 9 0 0 1 940 230 L 940 260 L 740 260 L 740 230 A 9 9 0 0 1 741 221 Z" fill="#a855f7" opacity="0.12" />
        <line x1="740" y1="260" x2="940" y2="260" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(752, 231)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#a855f7" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#a855f7" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#a855f7" stroke-width="1.2"/>
        </g>
          
          
            <text x="776" y="236" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#a855f7" letter-spacing="0.04em">&lt;&lt;product&gt;&gt;</text>
            <text x="776" y="251" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#a855f7">Order (Immutable)</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="858" y="228" width="74" height="18" rx="9" fill="#a855f7" opacity="0.18" />
          <text x="895" y="240.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#a855f7">Product</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="840" y="280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- id: UUID</text>
        
          <text x="840" y="299" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- items: List&lt;Item&gt;</text>
        
          <text x="840" y="318" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- totalCents: long</text>
        
      </g>
    
</svg>