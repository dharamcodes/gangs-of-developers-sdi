<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #0f172a; }
      .header-sub { fill: #475569; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .header-title { fill: #f8fafc; }
        .header-sub { fill: #94a3b8; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#ef4444" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#ef4444" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 210 300 L 370 230" class="arrow-line" stroke="#ef4444" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="250" y="250" width="60" height="20" rx="6" class="pill-bg" stroke="#ef4444" stroke-width="1.2" />
            <text x="280" y="263.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ef4444">implements</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 660 300 L 490 230" class="arrow-line" stroke="#ef4444" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="550" y="250" width="60" height="20" rx="6" class="pill-bg" stroke="#ef4444" stroke-width="1.2" />
            <text x="580" y="263.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ef4444">implements</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 520 380 L 340 380" class="arrow-line" stroke="#ef4444" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="400" y="360" width="60" height="20" rx="6" class="pill-bg" stroke="#ef4444" stroke-width="1.2" />
            <text x="430" y="373.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ef4444">controls access &amp; delegates</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="300" y="100" width="260" height="130" rx="10" class="card-bg" stroke="#ef4444" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 301 101 L 559 101 A 9 9 0 0 1 560 110 L 560 140 L 300 140 L 300 110 A 9 9 0 0 1 301 101 Z" fill="#ef4444" opacity="0.12" />
        <line x1="300" y1="140" x2="560" y2="140" stroke="#ef4444" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(312, 111)">
          <circle cx="9" cy="9" r="6.5" fill="none" stroke="#ef4444" stroke-width="1.6"/>
          <circle cx="9" cy="9" r="2.5" fill="#ef4444"/>
        </g>
          
          
            <text x="336" y="116" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#ef4444" letter-spacing="0.04em">&lt;&lt;interface&gt;&gt;</text>
            <text x="336" y="131" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ef4444">DatabaseService</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="478" y="108" width="74" height="18" rx="9" fill="#ef4444" opacity="0.18" />
          <text x="515" y="120.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#ef4444">Subject Interface</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="430" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ query(sql: String): Data</text>
        
          <text x="430" y="179" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ ping(): boolean</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="80" y="300" width="260" height="140" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 81 301 L 339 301 A 9 9 0 0 1 340 310 L 340 340 L 80 340 L 80 310 A 9 9 0 0 1 81 301 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="80" y1="340" x2="340" y2="340" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(92, 311)">
          <circle cx="9" cy="13" r="2" fill="#38bdf8"/>
          <path d="M 5 9 a 5.5 5.5 0 0 1 8 0" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M 2 5 a 9.5 9.5 0 0 1 14 0" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>
        </g>
          
          
            <text x="116" y="316" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;real&gt;&gt;</text>
            <text x="116" y="331" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">PostgresDbService</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="258" y="308" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="295" y="320.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Real Subject</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="210" y="360" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- pool: HikariDataSource</text>
        
          <text x="210" y="379" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ query(): executes SQL on DB</text>
        
          <text x="210" y="398" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Cost: Heavy TCP handshake</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="520" y="300" width="280" height="160" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 521 301 L 799 301 A 9 9 0 0 1 800 310 L 800 340 L 520 340 L 520 310 A 9 9 0 0 1 521 301 Z" fill="#10b981" opacity="0.12" />
        <line x1="520" y1="340" x2="800" y2="340" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(532, 311)">
          <rect x="3" y="5" width="12" height="10" rx="2" fill="none" stroke="#10b981" stroke-width="1.5"/>
          <line x1="6" y1="1" x2="6" y2="5" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="12" y1="1" x2="12" y2="5" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
        </g>
          
          
            <text x="556" y="316" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;proxy&gt;&gt;</text>
            <text x="556" y="331" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">CachingSecurityProxy</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="718" y="308" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="755" y="320.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Proxy Surrogate</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="660" y="360" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- real: PostgresDbService</text>
        
          <text x="660" y="379" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- cache: LruCache&lt;Sql, Data&gt;</text>
        
          <text x="660" y="398" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ query(): check JWT -&gt; cache hit?</text>
        
      </g>
    
</svg>