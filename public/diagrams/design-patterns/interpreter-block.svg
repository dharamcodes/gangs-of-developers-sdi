<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #0f172a; }
      .header-sub { fill: #475569; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .header-title { fill: #f8fafc; }
        .header-sub { fill: #94a3b8; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 225 290 L 370 230" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="250" y="245" width="60" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="280" y="258.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">implements</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 685 290 L 530 230" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="605" y="245" width="60" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="635" y="258.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">implements</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 820 365 C 870 365 870 160 580 160" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="840" y="250" width="60" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="870" y="263.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">recursively evaluates</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="320" y="100" width="260" height="130" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 321 101 L 579 101 A 9 9 0 0 1 580 110 L 580 140 L 320 140 L 320 110 A 9 9 0 0 1 321 101 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="320" y1="140" x2="580" y2="140" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(332, 111)">
          <circle cx="9" cy="9" r="6.5" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
          <circle cx="9" cy="9" r="2.5" fill="#f59e0b"/>
        </g>
          
          
            <text x="356" y="116" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#f59e0b" letter-spacing="0.04em">&lt;&lt;interface&gt;&gt;</text>
            <text x="356" y="131" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">BooleanExpression</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="498" y="108" width="74" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="535" y="120.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">AbstractExpression</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="450" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ interpret(ctx: Context): boolean</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="100" y="290" width="250" height="140" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 101 291 L 349 291 A 9 9 0 0 1 350 300 L 350 330 L 100 330 L 100 300 A 9 9 0 0 1 101 291 Z" fill="#10b981" opacity="0.12" />
        <line x1="100" y1="330" x2="350" y2="330" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(112, 301)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#10b981" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#10b981" stroke-width="1.2"/>
        </g>
          
          
            <text x="136" y="306" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;terminal&gt;&gt;</text>
            <text x="136" y="321" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">TerminalRule</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="268" y="298" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="305" y="310.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Terminal</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="225" y="350" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- literal: String</text>
        
          <text x="225" y="369" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ interpret(ctx): ctx.contains(literal)</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="550" y="290" width="270" height="150" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 551 291 L 819 291 A 9 9 0 0 1 820 300 L 820 330 L 550 330 L 550 300 A 9 9 0 0 1 551 291 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="550" y1="330" x2="820" y2="330" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(562, 301)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#38bdf8" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#38bdf8" stroke-width="1.2"/>
        </g>
          
          
            <text x="586" y="306" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;non-terminal&gt;&gt;</text>
            <text x="586" y="321" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">AndExpression</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="738" y="298" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="775" y="310.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Non-Terminal</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="685" y="350" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- left: Expression</text>
        
          <text x="685" y="369" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- right: Expression</text>
        
          <text x="685" y="388" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ interpret(ctx): left.eval() &amp;amp;&amp;amp; right.eval()</text>
        
      </g>
    
</svg>