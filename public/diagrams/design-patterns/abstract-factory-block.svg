            <text x="696" y="301" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">LightThemeFactory</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
