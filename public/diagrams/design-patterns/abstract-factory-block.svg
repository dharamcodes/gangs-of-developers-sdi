<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#a855f7" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#a855f7" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">ABSTRACT FACTORY PATTERN — UML ARCHITECTURE</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Provides an interface for creating families of related or dependent objects without specifying their concrete classes.</text>
  <rect x="810" y="18" width="162" height="26" rx="13" fill="#a855f7" opacity="0.18" stroke="#a855f7" stroke-width="1" />
  <text x="891" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#a855f7">UML Class Architecture</text>

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 220 310 L 350 240" class="arrow-line" stroke="#a855f7" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="230" y="250" width="60" height="20" rx="6" class="pill-bg" stroke="#a855f7" stroke-width="1.2" />
            <text x="260" y="263.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#a855f7">implements</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 640 310 L 510 240" class="arrow-line" stroke="#a855f7" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="560" y="250" width="60" height="20" rx="6" class="pill-bg" stroke="#a855f7" stroke-width="1.2" />
            <text x="590" y="263.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#a855f7">implements</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="300" y="100" width="260" height="140" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 301 101 L 559 101 A 9 9 0 0 1 560 110 L 560 140 L 300 140 L 300 110 A 9 9 0 0 1 301 101 Z" fill="#a855f7" opacity="0.12" />
        <line x1="300" y1="140" x2="560" y2="140" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(312, 111)">
          <circle cx="9" cy="9" r="6.5" fill="none" stroke="#a855f7" stroke-width="1.6"/>
          <circle cx="9" cy="9" r="2.5" fill="#a855f7"/>
        </g>
          
          
            <text x="336" y="116" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#a855f7" letter-spacing="0.04em">&lt;&lt;factory-interface&gt;&gt;</text>
            <text x="336" y="131" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#a855f7">GUIFactory</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="478" y="108" width="74" height="18" rx="9" fill="#a855f7" opacity="0.18" />
          <text x="515" y="120.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#a855f7">AbstractFactory</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="430" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ createButton(): Button</text>
        
          <text x="430" y="179" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ createCheckbox(): Checkbox</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="100" y="310" width="240" height="130" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 101 311 L 339 311 A 9 9 0 0 1 340 320 L 340 350 L 100 350 L 100 320 A 9 9 0 0 1 101 311 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="100" y1="350" x2="340" y2="350" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(112, 321)">
          <rect x="1" y="1" width="16" height="16" rx="2.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="3.5" fill="none" stroke="#38bdf8" stroke-width="1.3"/>
          <line x1="9" y1="2" x2="9" y2="5" stroke="#38bdf8" stroke-width="1.3"/>
          <line x1="9" y1="13" x2="9" y2="16" stroke="#38bdf8" stroke-width="1.3"/>
          <line x1="2" y1="9" x2="5" y2="9" stroke="#38bdf8" stroke-width="1.3"/>
          <line x1="13" y1="9" x2="16" y2="9" stroke="#38bdf8" stroke-width="1.3"/>
        </g>
          
          
            <text x="136" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;concrete-factory&gt;&gt;</text>
            <text x="136" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">WinFactory</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="258" y="318" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="295" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Family A</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="220" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ createButton(): WinBtn</text>
        
          <text x="220" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ createCheckbox(): WinBox</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="520" y="310" width="240" height="130" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 521 311 L 759 311 A 9 9 0 0 1 760 320 L 760 350 L 520 350 L 520 320 A 9 9 0 0 1 521 311 Z" fill="#10b981" opacity="0.12" />
        <line x1="520" y1="350" x2="760" y2="350" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(532, 321)">
          <rect x="1" y="1" width="16" height="16" rx="2.5" fill="none" stroke="#10b981" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="3.5" fill="none" stroke="#10b981" stroke-width="1.3"/>
          <line x1="9" y1="2" x2="9" y2="5" stroke="#10b981" stroke-width="1.3"/>
          <line x1="9" y1="13" x2="9" y2="16" stroke="#10b981" stroke-width="1.3"/>
          <line x1="2" y1="9" x2="5" y2="9" stroke="#10b981" stroke-width="1.3"/>
          <line x1="13" y1="9" x2="16" y2="9" stroke="#10b981" stroke-width="1.3"/>
        </g>
          
          
            <text x="556" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;concrete-factory&gt;&gt;</text>
            <text x="556" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">MacFactory</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="678" y="318" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="715" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Family B</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="640" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ createButton(): MacBtn</text>
        
          <text x="640" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ createCheckbox(): MacBox</text>
        
      </g>
    
</svg>