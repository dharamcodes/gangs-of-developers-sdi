            <text x="335" y="243.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#a855f7">extends</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 780 270 L 570 210" class="arrow-line" stroke="#a855f7" marker-end="url(#uml-inherit)" />
        
          
