            <text x="416" y="86" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#a855f7" letter-spacing="0.04em">&lt;&lt;factory&gt;&gt;</text>
            <text x="416" y="101" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#a855f7">GUIFactory (Abstract)</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="558" y="78" width="74" height="18" rx="9" fill="#a855f7" opacity="0.18" />
