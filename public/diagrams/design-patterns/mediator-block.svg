          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(352, 111)">
          <circle cx="9" cy="9" r="6.5" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <circle cx="9" cy="9" r="2.5" fill="#38bdf8"/>
        </g>
          
          
            <text x="376" y="116" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;mediator&gt;&gt;</text>
            <text x="376" y="131" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">AirTrafficMediator</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="518" y="108" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="555" y="120.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Mediator Interface</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="470" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ notify(sender, event): void</text>
        
          <text x="470" y="179" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ registerFlight(flight)</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="100" y="310" width="220" height="130" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
