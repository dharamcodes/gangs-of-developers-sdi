          <line x1="0" y1="6" x2="18" y2="6" stroke="#f59e0b" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#f59e0b" stroke-width="1.2"/>
        </g>
          
          
            <text x="396" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#f59e0b" letter-spacing="0.04em">&lt;&lt;colleague&gt;&gt;</text>
            <text x="396" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">AirbusFlightA320</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="498" y="318" width="74" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="535" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Colleague B</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="470" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- mediator: AirTrafficMediator</text>
        
          <text x="470" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ holdInHoldingPattern()</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="620" y="310" width="220" height="130" rx="10" class="card-bg" stroke="#ef4444" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 621 311 L 839 311 A 9 9 0 0 1 840 320 L 840 350 L 620 350 L 620 320 A 9 9 0 0 1 621 311 Z" fill="#ef4444" opacity="0.12" />
        <line x1="620" y1="350" x2="840" y2="350" stroke="#ef4444" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(632, 321)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#ef4444" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#ef4444" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#ef4444" stroke-width="1.2"/>
        </g>
          
          
            <text x="656" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#ef4444" letter-spacing="0.04em">&lt;&lt;colleague&gt;&gt;</text>
            <text x="656" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ef4444">AirportRunway</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="758" y="318" width="74" height="18" rx="9" fill="#ef4444" opacity="0.18" />
          <text x="795" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#ef4444">Colleague C</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="730" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- mediator: AirTrafficMediator</text>
        
          <text x="730" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ lockRunway() / free()</text>
        
      </g>
    
</svg>