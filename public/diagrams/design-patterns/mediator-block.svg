            <text x="136" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;colleague&gt;&gt;</text>
            <text x="136" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">BoeingFlight747</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="238" y="318" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="275" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Colleague A</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="210" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- mediator: AirTrafficMediator</text>
        
          <text x="210" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ requestLanding()</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="360" y="310" width="220" height="130" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
