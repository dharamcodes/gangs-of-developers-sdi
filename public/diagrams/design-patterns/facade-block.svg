          <line x1="6" y1="1" x2="6" y2="5" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="12" y1="1" x2="12" y2="5" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
        </g>
          
          
            <text x="376" y="126" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;facade&gt;&gt;</text>
            <text x="376" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">CheckoutFacade</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="518" y="118" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="555" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Facade</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="470" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- inventory: StockSvc</text>
        
          <text x="470" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- payment: CardSvc</text>
        
          <text x="470" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- logistics: ShippingSvc</text>
        
          <text x="470" y="227" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ processOrder(): OrderId</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="680" y="70" width="230" height="90" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 681 71 L 909 71 A 9 9 0 0 1 910 80 L 910 110 L 680 110 L 680 80 A 9 9 0 0 1 681 71 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="680" y1="110" x2="910" y2="110" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(692, 81)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#f59e0b" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#f59e0b" stroke-width="1.2"/>
        </g>
          
          
            <text x="716" y="86" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#f59e0b" letter-spacing="0.04em">&lt;&lt;subsystem&gt;&gt;</text>
            <text x="716" y="101" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">Inventory Subsystem</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="828" y="78" width="74" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="865" y="90.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Subsystem A</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="795" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Lock SKU inventory</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="680" y="180" width="230" height="90" rx="10" class="card-bg" stroke="#ef4444" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 681 181 L 909 181 A 9 9 0 0 1 910 190 L 910 220 L 680 220 L 680 190 A 9 9 0 0 1 681 181 Z" fill="#ef4444" opacity="0.12" />
        <line x1="680" y1="220" x2="910" y2="220" stroke="#ef4444" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(692, 191)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#ef4444" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#ef4444" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#ef4444" stroke-width="1.2"/>
        </g>
          
          
            <text x="716" y="196" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#ef4444" letter-spacing="0.04em">&lt;&lt;subsystem&gt;&gt;</text>
            <text x="716" y="211" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ef4444">Payment Gateway</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="828" y="188" width="74" height="18" rx="9" fill="#ef4444" opacity="0.18" />
          <text x="865" y="200.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#ef4444">Subsystem B</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="795" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Stripe 3D-Secure auth</text>
        
      </g>
    
      <g id="node-4" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="680" y="290" width="230" height="90" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 681 291 L 909 291 A 9 9 0 0 1 910 300 L 910 330 L 680 330 L 680 300 A 9 9 0 0 1 681 291 Z" fill="#a855f7" opacity="0.12" />
        <line x1="680" y1="330" x2="910" y2="330" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(692, 301)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#a855f7" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#a855f7" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#a855f7" stroke-width="1.2"/>
        </g>
          
          
            <text x="716" y="306" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#a855f7" letter-spacing="0.04em">&lt;&lt;subsystem&gt;&gt;</text>
            <text x="716" y="321" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#a855f7">FedEx API Shipper</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="828" y="298" width="74" height="18" rx="9" fill="#a855f7" opacity="0.18" />
          <text x="865" y="310.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#a855f7">Subsystem C</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="795" y="350" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Generate waybill PDF</text>
        
      </g>
    
</svg>