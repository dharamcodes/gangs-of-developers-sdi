<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #0f172a; }
      .header-sub { fill: #475569; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .header-title { fill: #f8fafc; }
        .header-sub { fill: #94a3b8; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#10b981" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#10b981" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 175 310 L 175 250" class="arrow-line" stroke="#10b981" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="145" y="270" width="60" height="20" rx="6" class="pill-bg" stroke="#10b981" stroke-width="1.2" />
            <text x="175" y="283.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#10b981">implements</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 300 170 L 550 170" class="arrow-line" stroke="#10b981" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="395" y="145" width="60" height="20" rx="6" class="pill-bg" stroke="#10b981" stroke-width="1.2" />
            <text x="425" y="158.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#10b981">creates</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 675 310 L 675 250" class="arrow-line" stroke="#10b981" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="645" y="270" width="60" height="20" rx="6" class="pill-bg" stroke="#10b981" stroke-width="1.2" />
            <text x="675" y="283.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#10b981">implements</text>
          
        
      </g>
    
      <g id="conn-3">
        <path d="M 300 375 L 550 375" class="arrow-line" stroke="#10b981" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="395" y="350" width="60" height="20" rx="6" class="pill-bg" stroke="#10b981" stroke-width="1.2" />
            <text x="425" y="363.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#10b981">traverses</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="50" y="110" width="250" height="140" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 51 111 L 299 111 A 9 9 0 0 1 300 120 L 300 150 L 50 150 L 50 120 A 9 9 0 0 1 51 111 Z" fill="#10b981" opacity="0.12" />
        <line x1="50" y1="150" x2="300" y2="150" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(62, 121)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#10b981" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#10b981" stroke-width="1.2"/>
        </g>
          
          
            <text x="86" y="126" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;iterable&gt;&gt;</text>
            <text x="86" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">IterableAggregate&lt;T&gt;</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="218" y="118" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="255" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Aggregate</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="175" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ iterator(): Iterator&lt;T&gt;</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="50" y="310" width="250" height="130" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 51 311 L 299 311 A 9 9 0 0 1 300 320 L 300 350 L 50 350 L 50 320 A 9 9 0 0 1 51 311 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="50" y1="350" x2="300" y2="350" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(62, 321)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#38bdf8" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#38bdf8" stroke-width="1.2"/>
        </g>
          
          
            <text x="86" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;concrete-agg&gt;&gt;</text>
            <text x="86" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">BinaryTree&lt;T&gt;</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="218" y="318" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="255" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">ConcreteAggregate</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="175" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- root: Node&lt;T&gt;</text>
        
          <text x="175" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ iterator(): InOrderTreeIterator</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="550" y="110" width="250" height="140" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 551 111 L 799 111 A 9 9 0 0 1 800 120 L 800 150 L 550 150 L 550 120 A 9 9 0 0 1 551 111 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="550" y1="150" x2="800" y2="150" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(562, 121)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#f59e0b" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#f59e0b" stroke-width="1.2"/>
        </g>
          
          
            <text x="586" y="126" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#f59e0b" letter-spacing="0.04em">&lt;&lt;iterator&gt;&gt;</text>
            <text x="586" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">Iterator&lt;T&gt;</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="718" y="118" width="74" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="755" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Iterator</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="675" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ hasNext(): boolean</text>
        
          <text x="675" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ next(): T</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="550" y="310" width="250" height="130" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 551 311 L 799 311 A 9 9 0 0 1 800 320 L 800 350 L 550 350 L 550 320 A 9 9 0 0 1 551 311 Z" fill="#a855f7" opacity="0.12" />
        <line x1="550" y1="350" x2="800" y2="350" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(562, 321)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#a855f7" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#a855f7" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#a855f7" stroke-width="1.2"/>
        </g>
          
          
            <text x="586" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#a855f7" letter-spacing="0.04em">&lt;&lt;concrete-iter&gt;&gt;</text>
            <text x="586" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#a855f7">InOrderTreeIterator&lt;T&gt;</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="718" y="318" width="74" height="18" rx="9" fill="#a855f7" opacity="0.18" />
          <text x="755" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#a855f7">ConcreteIterator</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="675" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- stack: Deque&lt;Node&lt;T&gt;&gt;</text>
        
          <text x="675" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ next(): yields sorted node</text>
        
      </g>
    
</svg>