<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#10b981" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#10b981" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">PROTOTYPE PATTERN — UML ARCHITECTURE</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Specifies the kinds of objects to create using a prototypical instance, creating new objects by copying this prototype.</text>
  <rect x="810" y="18" width="162" height="26" rx="13" fill="#10b981" opacity="0.18" stroke="#10b981" stroke-width="1" />
  <text x="891" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#10b981">UML Class Architecture</text>

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 230 310 L 450 250" class="arrow-line" stroke="#10b981" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="310" y="270" width="60" height="20" rx="6" class="pill-bg" stroke="#10b981" stroke-width="1.2" />
            <text x="340" y="283.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#10b981">implements</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 640 380 L 360 380" class="arrow-line" stroke="#10b981" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="470" y="360" width="60" height="20" rx="6" class="pill-bg" stroke="#10b981" stroke-width="1.2" />
            <text x="500" y="373.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#10b981">clones &amp; returns</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="380" y="110" width="240" height="140" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 381 111 L 619 111 A 9 9 0 0 1 620 120 L 620 150 L 380 150 L 380 120 A 9 9 0 0 1 381 111 Z" fill="#10b981" opacity="0.12" />
        <line x1="380" y1="150" x2="620" y2="150" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(392, 121)">
          <circle cx="9" cy="9" r="6.5" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <circle cx="9" cy="9" r="2.5" fill="#10b981"/>
        </g>
          
          
            <text x="416" y="126" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;interface&gt;&gt;</text>
            <text x="416" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">&lt;&lt;interface&gt;&gt; Prototype</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="538" y="118" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="575" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Prototype Interface</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="500" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ clone(): Prototype</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="100" y="310" width="260" height="140" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 101 311 L 359 311 A 9 9 0 0 1 360 320 L 360 350 L 100 350 L 100 320 A 9 9 0 0 1 101 311 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="100" y1="350" x2="360" y2="350" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(112, 321)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#38bdf8" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#38bdf8" stroke-width="1.2"/>
        </g>
          
          
            <text x="136" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;concrete&gt;&gt;</text>
            <text x="136" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">GameUnitPrototype</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="278" y="318" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="315" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Heavy Asset</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="230" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- meshData: 3DModel</text>
        
          <text x="230" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- health: int</text>
        
          <text x="230" y="408" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ clone(): Prototype</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="640" y="310" width="260" height="140" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 641 311 L 899 311 A 9 9 0 0 1 900 320 L 900 350 L 640 350 L 640 320 A 9 9 0 0 1 641 311 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="640" y1="350" x2="900" y2="350" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(652, 321)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#f59e0b" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#f59e0b" stroke-width="1.2"/>
        </g>
          
          
            <text x="676" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#f59e0b" letter-spacing="0.04em">&lt;&lt;registry&gt;&gt;</text>
            <text x="676" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">PrototypeRegistry</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="818" y="318" width="74" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="855" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Central Cache</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="770" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- items: Map&lt;String, Prototype&gt;</text>
        
          <text x="770" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ register(key, p)</text>
        
          <text x="770" y="408" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ get(key): Prototype</text>
        
      </g>
    
</svg>