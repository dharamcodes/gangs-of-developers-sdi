<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">PROTOTYPE PATTERN — UML ARCHITECTURE</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Specifies the kinds of objects to create using a prototypical instance, and creates new objects by copying this prototype.</text>
  <rect x="810" y="18" width="162" height="26" rx="13" fill="#f59e0b" opacity="0.18" stroke="#f59e0b" stroke-width="1" />
  <text x="891" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#f59e0b">UML Class Architecture</text>

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 250 310 L 390 250" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="280" y="265" width="60" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="310" y="278.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">implements</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 690 310 L 550 250" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="600" y="265" width="60" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="630" y="278.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">implements</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="340" y="110" width="260" height="140" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 341 111 L 599 111 A 9 9 0 0 1 600 120 L 600 150 L 340 150 L 340 120 A 9 9 0 0 1 341 111 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="340" y1="150" x2="600" y2="150" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(352, 121)">
          <circle cx="9" cy="9" r="6.5" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
          <circle cx="9" cy="9" r="2.5" fill="#f59e0b"/>
        </g>
          
          
            <text x="376" y="126" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#f59e0b" letter-spacing="0.04em">&lt;&lt;interface&gt;&gt;</text>
            <text x="376" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">Prototype&lt;T&gt;</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="518" y="118" width="74" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="555" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Prototype</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="470" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ clone(): T</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="120" y="310" width="260" height="140" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 121 311 L 379 311 A 9 9 0 0 1 380 320 L 380 350 L 120 350 L 120 320 A 9 9 0 0 1 121 311 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="120" y1="350" x2="380" y2="350" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(132, 321)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#38bdf8" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#38bdf8" stroke-width="1.2"/>
        </g>
          
          
            <text x="156" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;concrete-prototype&gt;&gt;</text>
            <text x="156" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">NetworkPacket</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="298" y="318" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="335" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Cloneable A</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="250" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- header: byte[]</text>
        
          <text x="250" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- body: byte[]</text>
        
          <text x="250" y="408" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ clone(): Deep Copy</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="560" y="310" width="260" height="140" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 561 311 L 819 311 A 9 9 0 0 1 820 320 L 820 350 L 560 350 L 560 320 A 9 9 0 0 1 561 311 Z" fill="#10b981" opacity="0.12" />
        <line x1="560" y1="350" x2="820" y2="350" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(572, 321)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#10b981" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#10b981" stroke-width="1.2"/>
        </g>
          
          
            <text x="596" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;concrete-prototype&gt;&gt;</text>
            <text x="596" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">DocumentTemplate</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="738" y="318" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="775" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Cloneable B</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="690" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- metadata: Config</text>
        
          <text x="690" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- layout: AST</text>
        
          <text x="690" y="408" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ clone(): Deep Copy</text>
        
      </g>
    
</svg>