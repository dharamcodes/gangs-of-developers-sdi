<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #0f172a; }
      .header-sub { fill: #475569; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .header-title { fill: #f8fafc; }
        .header-sub { fill: #94a3b8; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#38bdf8" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#38bdf8" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="400" class="bg" />
  <rect width="1000" height="400" fill="url(#grid)" />

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 250 200 L 280 200" class="arrow-line" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="235" y="180" width="60" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="265" y="193.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">call</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 490 200 L 520 200" class="arrow-line" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="475" y="180" width="60" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="505" y="193.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">instantiate</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 730 200 L 760 200" class="arrow-line" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="715" y="180" width="60" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="745" y="193.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">render</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="50" y="140" width="200" height="140" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 51 141 L 249 141 A 9 9 0 0 1 250 150 L 250 174 L 50 174 L 50 150 A 9 9 0 0 1 51 141 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="50" y1="174" x2="250" y2="174" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Numbered Sequence Step Badge -->
          <circle cx="72" cy="157" r="11" fill="#38bdf8" />
          <text x="72" y="161" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#ffffff">1</text>
          <text x="92" y="162" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="800" fill="#38bdf8">Client Invocation</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="150" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Client calls dialog.render()</text>
        
          <text x="150" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Agnostic to OS platform</text>
        
          <text x="150" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Pure business logic layer</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="280" y="140" width="210" height="140" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 281 141 L 489 141 A 9 9 0 0 1 490 150 L 490 174 L 280 174 L 280 150 A 9 9 0 0 1 281 141 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="280" y1="174" x2="490" y2="174" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Numbered Sequence Step Badge -->
          <circle cx="302" cy="157" r="11" fill="#f59e0b" />
          <text x="302" y="161" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#ffffff">2</text>
          <text x="322" y="162" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="800" fill="#f59e0b">Virtual Factory Call</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="385" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">dialog invokes createButton()</text>
        
          <text x="385" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Polymorphic dispatch triggers</text>
        
          <text x="385" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Subclass hook executed</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="520" y="140" width="210" height="140" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 521 141 L 729 141 A 9 9 0 0 1 730 150 L 730 174 L 520 174 L 520 150 A 9 9 0 0 1 521 141 Z" fill="#10b981" opacity="0.12" />
        <line x1="520" y1="174" x2="730" y2="174" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Numbered Sequence Step Badge -->
          <circle cx="542" cy="157" r="11" fill="#10b981" />
          <text x="542" y="161" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#ffffff">3</text>
          <text x="562" y="162" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="800" fill="#10b981">Concrete Instance</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="625" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">WindowsDialog yields WinButton</text>
        
          <text x="625" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">WebDialog yields HTMLButton</text>
        
          <text x="625" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Returned as Button interface</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="760" y="140" width="200" height="140" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 761 141 L 959 141 A 9 9 0 0 1 960 150 L 960 174 L 760 174 L 760 150 A 9 9 0 0 1 761 141 Z" fill="#a855f7" opacity="0.12" />
        <line x1="760" y1="174" x2="960" y2="174" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Numbered Sequence Step Badge -->
          <circle cx="782" cy="157" r="11" fill="#a855f7" />
          <text x="782" y="161" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#ffffff">4</text>
          <text x="802" y="162" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="800" fill="#a855f7">Render Execution</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="860" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">button.render() is invoked</text>
        
          <text x="860" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Native hooks configured</text>
        
          <text x="860" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Zero coupling to client</text>
        
      </g>
    
</svg>