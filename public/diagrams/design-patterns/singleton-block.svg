<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #0f172a; }
      .header-sub { fill: #475569; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .header-title { fill: #f8fafc; }
        .header-sub { fill: #94a3b8; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#ef4444" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#ef4444" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 180 360 L 370 310" class="arrow-line" stroke="#ef4444" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="230" y="320" width="60" height="20" rx="6" class="pill-bg" stroke="#ef4444" stroke-width="1.2" />
            <text x="260" y="333.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ef4444">shared ref</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 470 360 L 470 310" class="arrow-line" stroke="#ef4444" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="440" y="325" width="60" height="20" rx="6" class="pill-bg" stroke="#ef4444" stroke-width="1.2" />
            <text x="470" y="338.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ef4444">shared ref</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 760 360 L 570 310" class="arrow-line" stroke="#ef4444" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="650" y="320" width="60" height="20" rx="6" class="pill-bg" stroke="#ef4444" stroke-width="1.2" />
            <text x="680" y="333.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ef4444">shared ref</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="300" y="110" width="340" height="200" rx="10" class="card-bg" stroke="#ef4444" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 301 111 L 639 111 A 9 9 0 0 1 640 120 L 640 150 L 300 150 L 300 120 A 9 9 0 0 1 301 111 Z" fill="#ef4444" opacity="0.12" />
        <line x1="300" y1="150" x2="640" y2="150" stroke="#ef4444" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(312, 121)">
          <rect x="1" y="7" width="15" height="11" rx="2" fill="none" stroke="#ef4444" stroke-width="1.5"/>
          <path d="M 4.5 7 V 4 a 4 4 0 0 1 8 0 V 7" fill="none" stroke="#ef4444" stroke-width="1.5"/>
          <circle cx="8.5" cy="12.5" r="1.3" fill="#ef4444"/>
        </g>
          
          
            <text x="336" y="126" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#ef4444" letter-spacing="0.04em">&lt;&lt;singleton&gt;&gt;</text>
            <text x="336" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ef4444">ConnectionPool (Singleton)</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="558" y="118" width="74" height="18" rx="9" fill="#ef4444" opacity="0.18" />
          <text x="595" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#ef4444">Singleton Instance</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="470" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- instance: ConnectionPool {volatile, static}</text>
        
          <text x="470" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- pool: BlockingQueue&lt;Connection&gt;</text>
        
          <text x="470" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- ConnectionPool() {private}</text>
        
          <text x="470" y="227" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ getInstance(): ConnectionPool {static}</text>
        
          <text x="470" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ getConnection(): Connection</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="80" y="360" width="200" height="100" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 81 361 L 279 361 A 9 9 0 0 1 280 370 L 280 400 L 80 400 L 80 370 A 9 9 0 0 1 81 361 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="80" y1="400" x2="280" y2="400" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(92, 371)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#38bdf8"/>
          <circle cx="6" cy="3" r="0.7" fill="#38bdf8"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#38bdf8"/>
        </g>
          
          
            <text x="116" y="376" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;client&gt;&gt;</text>
            <text x="116" y="391" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Worker Thread 1</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="198" y="368" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="235" y="380.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Client</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="180" y="420" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">getInstance() reference</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="370" y="360" width="200" height="100" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 371 361 L 569 361 A 9 9 0 0 1 570 370 L 570 400 L 370 400 L 370 370 A 9 9 0 0 1 371 361 Z" fill="#10b981" opacity="0.12" />
        <line x1="370" y1="400" x2="570" y2="400" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(382, 371)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#10b981"/>
          <circle cx="6" cy="3" r="0.7" fill="#10b981"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#10b981"/>
        </g>
          
          
            <text x="406" y="376" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;client&gt;&gt;</text>
            <text x="406" y="391" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">Worker Thread 2</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="488" y="368" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="525" y="380.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Client</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="470" y="420" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">getInstance() reference</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="660" y="360" width="200" height="100" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 661 361 L 859 361 A 9 9 0 0 1 860 370 L 860 400 L 660 400 L 660 370 A 9 9 0 0 1 661 361 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="660" y1="400" x2="860" y2="400" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(672, 371)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#f59e0b"/>
          <circle cx="6" cy="3" r="0.7" fill="#f59e0b"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#f59e0b"/>
        </g>
          
          
            <text x="696" y="376" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#f59e0b" letter-spacing="0.04em">&lt;&lt;client&gt;&gt;</text>
            <text x="696" y="391" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">Worker Thread 3</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="778" y="368" width="74" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="815" y="380.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Client</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="760" y="420" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">getInstance() reference</text>
        
      </g>
    
</svg>