<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #0f172a; }
      .header-sub { fill: #475569; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .header-title { fill: #f8fafc; }
        .header-sub { fill: #94a3b8; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#a855f7" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#a855f7" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 300 170 L 380 170" class="arrow-line" stroke="#a855f7" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="310" y="145" width="60" height="20" rx="6" class="pill-bg" stroke="#a855f7" stroke-width="1.2" />
            <text x="340" y="158.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#a855f7">caches</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 740 180 L 650 180" class="arrow-line" stroke="#a855f7" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="665" y="155" width="60" height="20" rx="6" class="pill-bg" stroke="#a855f7" stroke-width="1.2" />
            <text x="695" y="168.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#a855f7">references</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="50" y="110" width="250" height="140" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 51 111 L 299 111 A 9 9 0 0 1 300 120 L 300 150 L 50 150 L 50 120 A 9 9 0 0 1 51 111 Z" fill="#a855f7" opacity="0.12" />
        <line x1="50" y1="150" x2="300" y2="150" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(62, 121)">
          <rect x="1" y="1" width="16" height="16" rx="2.5" fill="none" stroke="#a855f7" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="3.5" fill="none" stroke="#a855f7" stroke-width="1.3"/>
          <line x1="9" y1="2" x2="9" y2="5" stroke="#a855f7" stroke-width="1.3"/>
          <line x1="9" y1="13" x2="9" y2="16" stroke="#a855f7" stroke-width="1.3"/>
          <line x1="2" y1="9" x2="5" y2="9" stroke="#a855f7" stroke-width="1.3"/>
          <line x1="13" y1="9" x2="16" y2="9" stroke="#a855f7" stroke-width="1.3"/>
        </g>
          
          
            <text x="86" y="126" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#a855f7" letter-spacing="0.04em">&lt;&lt;factory&gt;&gt;</text>
            <text x="86" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#a855f7">TreeTypeFactory</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="218" y="118" width="74" height="18" rx="9" fill="#a855f7" opacity="0.18" />
          <text x="255" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#a855f7">FlyweightFactory</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="175" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- cache: Map&lt;Key, TreeType&gt;</text>
        
          <text x="175" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ getTreeType(name, color, mesh): TreeType</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="380" y="100" width="270" height="160" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 381 101 L 649 101 A 9 9 0 0 1 650 110 L 650 140 L 380 140 L 380 110 A 9 9 0 0 1 381 101 Z" fill="#10b981" opacity="0.12" />
        <line x1="380" y1="140" x2="650" y2="140" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(392, 111)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#10b981" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#10b981" stroke-width="1.2"/>
        </g>
          
          
            <text x="416" y="116" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;flyweight&gt;&gt;</text>
            <text x="416" y="131" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">TreeType (Flyweight)</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="568" y="108" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="605" y="120.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Shared Memory</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="515" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- name: String [Intrinsic]</text>
        
          <text x="515" y="179" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- 3D Mesh: 50 MB [Intrinsic]</text>
        
          <text x="515" y="198" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- Texture: 20 MB [Intrinsic]</text>
        
          <text x="515" y="217" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ draw(x, y, zoom) [Extrinsic]</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="740" y="110" width="220" height="150" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 741 111 L 959 111 A 9 9 0 0 1 960 120 L 960 150 L 740 150 L 740 120 A 9 9 0 0 1 741 111 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="740" y1="150" x2="960" y2="150" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(752, 121)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#38bdf8" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#38bdf8" stroke-width="1.2"/>
        </g>
          
          
            <text x="776" y="126" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;context&gt;&gt;</text>
            <text x="776" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">TreeInstance (Context)</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="878" y="118" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="915" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">1M+ Instances</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="850" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- x: int, y: int [Extrinsic]</text>
        
          <text x="850" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- health: int [Extrinsic]</text>
        
          <text x="850" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- type: TreeType [Pointer]</text>
        
          <text x="850" y="227" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Cost: 16 bytes each!</text>
        
      </g>
    
</svg>