<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#a855f7" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#a855f7" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">COMMAND PATTERN — UML ARCHITECTURE</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Encapsulates a request as an object, thereby letting you parameterize clients with different requests, queue or log requests, and support undoable operations.</text>
  <rect x="810" y="18" width="162" height="26" rx="13" fill="#a855f7" opacity="0.18" stroke="#a855f7" stroke-width="1" />
  <text x="891" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#a855f7">UML Class Architecture</text>

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 270 170 L 380 170" class="arrow-line" stroke="#a855f7" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="295" y="145" width="60" height="20" rx="6" class="pill-bg" stroke="#a855f7" stroke-width="1.2" />
            <text x="325" y="158.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#a855f7">invokes</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 505 310 L 505 240" class="arrow-line" stroke="#a855f7" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="475" y="265" width="60" height="20" rx="6" class="pill-bg" stroke="#a855f7" stroke-width="1.2" />
            <text x="505" y="278.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#a855f7">implements</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 630 380 L 740 280" class="arrow-line" stroke="#a855f7" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="660" y="330" width="60" height="20" rx="6" class="pill-bg" stroke="#a855f7" stroke-width="1.2" />
            <text x="690" y="343.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#a855f7">operates on</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="50" y="120" width="220" height="140" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 51 121 L 269 121 A 9 9 0 0 1 270 130 L 270 160 L 50 160 L 50 130 A 9 9 0 0 1 51 121 Z" fill="#a855f7" opacity="0.12" />
        <line x1="50" y1="160" x2="270" y2="160" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(62, 131)">
          <circle cx="9" cy="9" r="7" fill="none" stroke="#a855f7" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="3" fill="none" stroke="#a855f7" stroke-width="1.3"/>
          <circle cx="9" cy="9" r="1.2" fill="#a855f7"/>
        </g>
          
          
            <text x="86" y="136" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#a855f7" letter-spacing="0.04em">&lt;&lt;invoker&gt;&gt;</text>
            <text x="86" y="151" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#a855f7">CommandInvoker</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="188" y="128" width="74" height="18" rx="9" fill="#a855f7" opacity="0.18" />
          <text x="225" y="140.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#a855f7">Invoker</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="160" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- history: Deque&lt;Command&gt;</text>
        
          <text x="160" y="199" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ executeCommand(cmd)</text>
        
          <text x="160" y="218" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ undoLast()</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="380" y="100" width="250" height="140" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 381 101 L 629 101 A 9 9 0 0 1 630 110 L 630 140 L 380 140 L 380 110 A 9 9 0 0 1 381 101 Z" fill="#10b981" opacity="0.12" />
        <line x1="380" y1="140" x2="630" y2="140" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(392, 111)">
          <circle cx="9" cy="9" r="6.5" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <circle cx="9" cy="9" r="2.5" fill="#10b981"/>
        </g>
          
          
            <text x="416" y="116" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;interface&gt;&gt;</text>
            <text x="416" y="131" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">Command</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="548" y="108" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="585" y="120.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Command Interface</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="505" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ execute(): void</text>
        
          <text x="505" y="179" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ undo(): void</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="380" y="310" width="250" height="140" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 381 311 L 629 311 A 9 9 0 0 1 630 320 L 630 350 L 380 350 L 380 320 A 9 9 0 0 1 381 311 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="380" y1="350" x2="630" y2="350" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(392, 321)">
          <circle cx="9" cy="9" r="7" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="3" fill="none" stroke="#38bdf8" stroke-width="1.3"/>
          <circle cx="9" cy="9" r="1.2" fill="#38bdf8"/>
        </g>
          
          
            <text x="416" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;concrete&gt;&gt;</text>
            <text x="416" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">InsertRowCommand</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="548" y="318" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="585" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">ConcreteCommand</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="505" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- db: DatabaseReceiver</text>
        
          <text x="505" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- rowId: UUID</text>
        
          <text x="505" y="408" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ execute(): db.insert()</text>
        
          <text x="505" y="427" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ undo(): db.delete()</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="740" y="200" width="220" height="140" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 741 201 L 959 201 A 9 9 0 0 1 960 210 L 960 240 L 740 240 L 740 210 A 9 9 0 0 1 741 201 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="740" y1="240" x2="960" y2="240" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(752, 211)">
          <ellipse cx="9" cy="3.5" rx="8" ry="2.8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
          <path d="M 1 3.5 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
          <path d="M 1 9 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
        </g>
          
          
            <text x="776" y="216" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#f59e0b" letter-spacing="0.04em">&lt;&lt;receiver&gt;&gt;</text>
            <text x="776" y="231" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">Database (Receiver)</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="878" y="208" width="74" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="915" y="220.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Receiver</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="850" y="260" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ insertRow(data)</text>
        
          <text x="850" y="279" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ deleteRow(id)</text>
        
      </g>
    
</svg>