<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">MEMENTO PATTERN — UML ARCHITECTURE</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Without violating encapsulation, captures and externalizes an object&apos;s internal state so that the object can be restored to this state later.</text>
  <rect x="810" y="18" width="162" height="26" rx="13" fill="#f59e0b" opacity="0.18" stroke="#f59e0b" stroke-width="1" />
  <text x="891" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#f59e0b">UML Class Architecture</text>

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 290 190 L 370 190" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="300" y="165" width="60" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="330" y="178.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">creates</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 690 190 L 620 190" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="625" y="165" width="60" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="655" y="178.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">stores</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="50" y="120" width="240" height="140" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 51 121 L 289 121 A 9 9 0 0 1 290 130 L 290 160 L 50 160 L 50 130 A 9 9 0 0 1 51 121 Z" fill="#a855f7" opacity="0.12" />
        <line x1="50" y1="160" x2="290" y2="160" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(62, 131)">
          <rect x="1" y="1" width="16" height="16" rx="2.5" fill="none" stroke="#a855f7" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="3.5" fill="none" stroke="#a855f7" stroke-width="1.3"/>
          <line x1="9" y1="2" x2="9" y2="5" stroke="#a855f7" stroke-width="1.3"/>
          <line x1="9" y1="13" x2="9" y2="16" stroke="#a855f7" stroke-width="1.3"/>
          <line x1="2" y1="9" x2="5" y2="9" stroke="#a855f7" stroke-width="1.3"/>
          <line x1="13" y1="9" x2="16" y2="9" stroke="#a855f7" stroke-width="1.3"/>
        </g>
          
          
            <text x="86" y="136" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#a855f7" letter-spacing="0.04em">&lt;&lt;originator&gt;&gt;</text>
            <text x="86" y="151" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#a855f7">TextEditor (Originator)</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="208" y="128" width="74" height="18" rx="9" fill="#a855f7" opacity="0.18" />
          <text x="245" y="140.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#a855f7">Originator</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="170" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- content: StringBuilder</text>
        
          <text x="170" y="199" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ save(): EditorMemento</text>
        
          <text x="170" y="218" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ restore(m: Memento)</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="370" y="120" width="250" height="140" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 371 121 L 619 121 A 9 9 0 0 1 620 130 L 620 160 L 370 160 L 370 130 A 9 9 0 0 1 371 121 Z" fill="#10b981" opacity="0.12" />
        <line x1="370" y1="160" x2="620" y2="160" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(382, 131)">
          <circle cx="9" cy="9" r="7" fill="none" stroke="#10b981" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="3" fill="none" stroke="#10b981" stroke-width="1.3"/>
          <circle cx="9" cy="9" r="1.2" fill="#10b981"/>
        </g>
          
          
            <text x="406" y="136" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;memento&gt;&gt;</text>
            <text x="406" y="151" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">EditorMemento (Opaque)</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="538" y="128" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="575" y="140.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Memento</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="495" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- state: String {private}</text>
        
          <text x="495" y="199" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- timestamp: Instant</text>
        
          <text x="495" y="218" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Private constructor</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="690" y="120" width="230" height="140" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 691 121 L 919 121 A 9 9 0 0 1 920 130 L 920 160 L 690 160 L 690 130 A 9 9 0 0 1 691 121 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="690" y1="160" x2="920" y2="160" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(702, 131)">
          <ellipse cx="9" cy="3.5" rx="8" ry="2.8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
          <path d="M 1 3.5 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
          <path d="M 1 9 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
        </g>
          
          
            <text x="726" y="136" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;caretaker&gt;&gt;</text>
            <text x="726" y="151" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">HistoryManager (Caretaker)</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="838" y="128" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="875" y="140.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Caretaker</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="805" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- snapshots: Deque&lt;Memento&gt;</text>
        
          <text x="805" y="199" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ backup(editor)</text>
        
          <text x="805" y="218" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ undo(editor)</text>
        
      </g>
    
</svg>