<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #0f172a; }
      .header-sub { fill: #475569; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .header-title { fill: #f8fafc; }
        .header-sub { fill: #94a3b8; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#38bdf8" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#38bdf8" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 160 310 L 160 250" class="arrow-line" stroke="#38bdf8" marker-end="url(#uml-inherit)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="130" y="270" width="60" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="160" y="283.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">extends</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 270 170 L 550 170" class="arrow-line" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="380" y="150" width="60" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="410" y="163.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">creates / uses</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 660 310 L 660 250" class="arrow-line" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="630" y="270" width="60" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="660" y="283.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">implements</text>
          
        
      </g>
    
      <g id="conn-3">
        <path d="M 270 370 L 550 370" class="arrow-dash" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="380" y="350" width="60" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="410" y="363.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">instantiates</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="50" y="110" width="220" height="140" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 51 111 L 269 111 A 9 9 0 0 1 270 120 L 270 150 L 50 150 L 50 120 A 9 9 0 0 1 51 111 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="50" y1="150" x2="270" y2="150" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(62, 121)">
          <rect x="1" y="1" width="16" height="16" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
          <line x1="5" y1="5" x2="13" y2="13" stroke="#38bdf8" stroke-width="1.3"/>
          <line x1="13" y1="5" x2="5" y2="13" stroke="#38bdf8" stroke-width="1.3"/>
        </g>
          
          
            <text x="86" y="126" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;creator&gt;&gt;</text>
            <text x="86" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Dialog (Abstract)</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="188" y="118" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="225" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Creator</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="160" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ render(): void</text>
        
          <text x="160" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted"># createButton(): Button</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="50" y="310" width="220" height="120" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 51 311 L 269 311 A 9 9 0 0 1 270 320 L 270 350 L 50 350 L 50 320 A 9 9 0 0 1 51 311 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="50" y1="350" x2="270" y2="350" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(62, 321)">
          <rect x="1" y="1" width="16" height="16" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
          <line x1="5" y1="5" x2="13" y2="13" stroke="#38bdf8" stroke-width="1.3"/>
          <line x1="13" y1="5" x2="5" y2="13" stroke="#38bdf8" stroke-width="1.3"/>
        </g>
          
          
            <text x="86" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;concrete&gt;&gt;</text>
            <text x="86" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">WindowsDialog</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="188" y="318" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="225" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">ConcreteCreator</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="160" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted"># createButton(): Button</text>
        
          <text x="160" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">  -&gt; return new WinButton()</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="550" y="110" width="220" height="140" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 551 111 L 769 111 A 9 9 0 0 1 770 120 L 770 150 L 550 150 L 550 120 A 9 9 0 0 1 551 111 Z" fill="#10b981" opacity="0.12" />
        <line x1="550" y1="150" x2="770" y2="150" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(562, 121)">
          <circle cx="9" cy="9" r="6.5" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <circle cx="9" cy="9" r="2.5" fill="#10b981"/>
        </g>
          
          
            <text x="586" y="126" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;interface&gt;&gt;</text>
            <text x="586" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">Button (Product)</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="688" y="118" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="725" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Product</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="660" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ render(): void</text>
        
          <text x="660" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ onClick(): void</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="550" y="310" width="220" height="120" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 551 311 L 769 311 A 9 9 0 0 1 770 320 L 770 350 L 550 350 L 550 320 A 9 9 0 0 1 551 311 Z" fill="#10b981" opacity="0.12" />
        <line x1="550" y1="350" x2="770" y2="350" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(562, 321)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#10b981" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#10b981" stroke-width="1.2"/>
        </g>
          
          
            <text x="586" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;concrete&gt;&gt;</text>
            <text x="586" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">WindowsButton</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="688" y="318" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="725" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">ConcreteProduct</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="660" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ render(): [Win API]</text>
        
          <text x="660" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ onClick(): [Win Event]</text>
        
      </g>
    
</svg>