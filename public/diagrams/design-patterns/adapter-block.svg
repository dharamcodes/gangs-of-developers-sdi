<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #0f172a; }
      .header-sub { fill: #475569; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .header-title { fill: #f8fafc; }
        .header-sub { fill: #94a3b8; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Realization / Implementation -->
    <marker id="uml-realize" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#38bdf8" stroke-width="1.8" />
    </marker>
    <!-- Hollow White Triangle Marker for UML Generalization / Inheritance -->
    <marker id="uml-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="1,1 11,6 1,11" fill="#ffffff" stroke="#38bdf8" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="500" class="bg" />
  <rect width="1000" height="500" fill="url(#grid)" />

  <!-- Connections and Numbered Method Invocations -->
  
      <g id="conn-0">
        <path d="M 250 170 L 340 170" class="arrow-line" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="265" y="150" width="60" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="295" y="163.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">uses</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 460 310 L 460 240" class="arrow-line" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="430" y="265" width="60" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="460" y="278.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">implements</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 580 380 L 670 380" class="arrow-line" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="595" y="360" width="60" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="625" y="373.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">delegates</text>
          
        
      </g>
    

  <!-- UML Class Nodes -->
  
      <g id="node-0" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="50" y="120" width="200" height="120" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 51 121 L 249 121 A 9 9 0 0 1 250 130 L 250 160 L 50 160 L 50 130 A 9 9 0 0 1 51 121 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="50" y1="160" x2="250" y2="160" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(62, 131)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#38bdf8"/>
          <circle cx="6" cy="3" r="0.7" fill="#38bdf8"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#38bdf8"/>
        </g>
          
          
            <text x="86" y="136" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.04em">&lt;&lt;client&gt;&gt;</text>
            <text x="86" y="151" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">PaymentService</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="168" y="128" width="74" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="205" y="140.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Client</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="150" y="180" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Client business logic</text>
        
          <text x="150" y="199" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Calls gateway.pay()</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="340" y="110" width="240" height="130" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 341 111 L 579 111 A 9 9 0 0 1 580 120 L 580 150 L 340 150 L 340 120 A 9 9 0 0 1 341 111 Z" fill="#10b981" opacity="0.12" />
        <line x1="340" y1="150" x2="580" y2="150" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(352, 121)">
          <circle cx="9" cy="9" r="6.5" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <circle cx="9" cy="9" r="2.5" fill="#10b981"/>
        </g>
          
          
            <text x="376" y="126" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.04em">&lt;&lt;interface&gt;&gt;</text>
            <text x="376" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">PaymentGateway</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="498" y="118" width="74" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="535" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Target Interface</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="460" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ pay(cents: long): bool</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="340" y="310" width="240" height="140" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 341 311 L 579 311 A 9 9 0 0 1 580 320 L 580 350 L 340 350 L 340 320 A 9 9 0 0 1 341 311 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="340" y1="350" x2="580" y2="350" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(352, 321)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#f59e0b"/>
          <circle cx="6" cy="3" r="0.7" fill="#f59e0b"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#f59e0b"/>
        </g>
          
          
            <text x="376" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#f59e0b" letter-spacing="0.04em">&lt;&lt;adapter&gt;&gt;</text>
            <text x="376" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">StripePaymentAdapter</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="498" y="318" width="74" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="535" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Adapter</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="460" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">- stripeClient: StripeSdk</text>
        
          <text x="460" y="389" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ pay(cents): bool</text>
        
          <text x="460" y="408" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">  -&gt; adapts dollars &amp; params</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main UML Class Card Container with Rounded Corners -->
        <rect x="670" y="310" width="230" height="140" rx="10" class="card-bg" stroke="#ef4444" stroke-width="1.8" />
        
        <!-- Header Compartment -->
        <path d="M 671 311 L 899 311 A 9 9 0 0 1 900 320 L 900 350 L 670 350 L 670 320 A 9 9 0 0 1 671 311 Z" fill="#ef4444" opacity="0.12" />
        <line x1="670" y1="350" x2="900" y2="350" stroke="#ef4444" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- UML Stereotype and Class Title with Component Icon -->
          
        <g transform="translate(682, 321)">
          <rect x="0" y="0" width="18" height="18" rx="2" fill="none" stroke="#ef4444" stroke-width="1.6"/>
          <line x1="0" y1="6" x2="18" y2="6" stroke="#ef4444" stroke-width="1.2"/>
          <line x1="0" y1="12" x2="18" y2="12" stroke="#ef4444" stroke-width="1.2"/>
        </g>
          
          
            <text x="706" y="326" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#ef4444" letter-spacing="0.04em">&lt;&lt;adaptee&gt;&gt;</text>
            <text x="706" y="341" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ef4444">StripeSdk (External)</text>
          
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="818" y="318" width="74" height="18" rx="9" fill="#ef4444" opacity="0.18" />
          <text x="855" y="330.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#ef4444">Adaptee</text>
        

        <!-- UML Methods & Attributes Section -->
        
          <text x="785" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">+ createCharge(amount: BigDecimal, curr: String)</text>
        
      </g>
    
</svg>