<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">KAFKA CONSUMER GROUPS &amp; PARTITION REBALANCING ARCHITECTURE</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Independent Offset High-Watermarks • 1:1 Partition-to-Consumer Assignment • Idle Consumer Trap</text>

  <g id="diagram-canvas">
    
      <!-- Kafka Topic Partitions -->
      <rect x="40" y="105" width="220" height="205" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="40" y="105" width="220" height="30" rx="8" fill="#0f172a" />
      <text x="150" y="125" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#ffffff">TOPIC: "orders" (4 Partitions)</text>

      <rect x="55" y="145" width="190" height="32" rx="4" fill="#e0f2fe" stroke="#38bdf8" />
      <text x="150" y="165" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">Partition 0 (Offset 10,482)</text>

      <rect x="55" y="185" width="190" height="32" rx="4" fill="#e0f2fe" stroke="#38bdf8" />
      <text x="150" y="205" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">Partition 1 (Offset 9,931)</text>

      <rect x="55" y="225" width="190" height="32" rx="4" fill="#e0f2fe" stroke="#38bdf8" />
      <text x="150" y="245" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">Partition 2 (Offset 12,014)</text>

      <rect x="55" y="265" width="190" height="32" rx="4" fill="#e0f2fe" stroke="#38bdf8" />
      <text x="150" y="285" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">Partition 3 (Offset 11,280)</text>

      <!-- Consumer Group 1: 2 Consumers -->
      <rect x="310" y="85" width="310" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="310" y="85" width="310" height="30" rx="8" fill="#f0fdf4" />
      <text x="465" y="105" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#15803d">CONSUMER GROUP 1: Billing Svc</text>

      <rect x="330" y="130" width="270" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8" />
      <text x="465" y="152" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Consumer Instance A</text>
      <text x="465" y="170" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#166534">Assigned: Partition 0 &amp; Partition 1</text>
      <text x="465" y="185" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#64748b">Maintains independent offset group</text>

      <rect x="330" y="220" width="270" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8" />
      <text x="465" y="242" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Consumer Instance B</text>
      <text x="465" y="260" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#166534">Assigned: Partition 2 &amp; Partition 3</text>
      <text x="465" y="275" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#64748b">Maintains independent offset group</text>

      <!-- Consumer Group 2: 5 Consumers (with 1 IDLE) -->
      <rect x="660" y="85" width="300" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="660" y="85" width="300" height="30" rx="8" fill="#fef2f2" />
      <text x="810" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#b91c1c">CONSUMER GROUP 2: Analytics</text>

      <rect x="680" y="125" width="260" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="810" y="144" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700">Consumer 1 → Partition 0</text>

      <rect x="680" y="160" width="260" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="810" y="179" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700">Consumer 2 → Partition 1</text>

      <rect x="680" y="195" width="260" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="810" y="214" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700">Consumer 3 → Partition 2</text>

      <rect x="680" y="230" width="260" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="810" y="249" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700">Consumer 4 → Partition 3</text>

      <rect x="680" y="268" width="260" height="42" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
      <text x="810" y="286" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#991b1b">Consumer 5: COMPLETELY IDLE!</text>
      <text x="810" y="300" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#7f1d1d">(Partitions = 4 &lt; Consumers = 5)</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Architecture Rule: Max parallel active consumers in one group = Partition count. Extra consumers remain idle waste unless partitions are scaled.</text>
    
  </g>
</svg>