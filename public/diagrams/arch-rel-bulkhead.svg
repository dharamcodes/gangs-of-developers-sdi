<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">BULKHEAD PATTERN: THREAD POOL &amp; SYSTEM FAULT ISOLATION</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Cascading Thread Exhaustion Prevention • Dedicated Service Pools • Compartmentalized Blast Radiuses</text>

  <g id="diagram-canvas">
    
      <!-- Left: Monolithic Shared Pool Outage -->
      <rect x="40" y="85" width="430" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="40" y="85" width="430" height="34" rx="8" fill="#fef2f2" />
      <text x="60" y="108" font-family="sans-serif" font-size="12" font-weight="800" fill="#b91c1c">WITHOUT BULKHEAD (Shared Thread Pool = Outage)</text>

      <rect x="60" y="130" width="390" height="95" rx="6" fill="#fee2e2" stroke="#ef4444" />
      <text x="255" y="152" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#991b1b">SHARED TOMCAT WORKER POOL (200 Threads)</text>
      <text x="255" y="172" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7f1d1d">Recommendation API hangs on 10s DB query</text>
      <text x="255" y="190" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#991b1b">All 200 worker threads consumed by recommendations!</text>
      <text x="255" y="210" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#dc2626">CHECKOUT API: 504 TIMEOUT (No available threads)</text>

      <rect x="60" y="235" width="390" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="75" y="255" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">Cascading Failure Chain:</text>
      <text x="75" y="272" font-family="sans-serif" font-size="8.5" fill="#334155">Non-critical auxiliary feature (Recommendations) saturates entire container.</text>
      <text x="75" y="288" font-family="sans-serif" font-size="8.5" fill="#334155">Critical revenue path (Checkout, Login) suffers 100% downtime.</text>

      <!-- Right: With Bulkhead Isolation -->
      <rect x="495" y="85" width="465" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="495" y="85" width="465" height="34" rx="8" fill="#f0fdf4" />
      <text x="515" y="108" font-family="sans-serif" font-size="12" font-weight="800" fill="#15803d">WITH BULKHEAD PATTERN (Thread Compartments)</text>

      <rect x="515" y="130" width="130" height="85" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
      <text x="580" y="152" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#15803d">Checkout Pool</text>
      <text x="580" y="170" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#166534">Max 60 Threads</text>
      <text x="580" y="195" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#15803d">100% HEALTHY</text>

      <rect x="660" y="130" width="130" height="85" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
      <text x="725" y="152" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#15803d">Login Pool</text>
      <text x="725" y="170" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#166534">Max 40 Threads</text>
      <text x="725" y="195" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#15803d">100% HEALTHY</text>

      <rect x="805" y="130" width="140" height="85" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
      <text x="875" y="152" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#b91c1c">Recs Pool</text>
      <text x="875" y="170" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#7f1d1d">Max 20 Threads</text>
      <text x="875" y="195" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#dc2626">TRIPPED / 503</text>

      <rect x="515" y="230" width="430" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="530" y="250" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#15803d">Fault Isolation Guarantee:</text>
      <text x="530" y="268" font-family="sans-serif" font-size="8.5" fill="#334155">Recommendation failure is quarantined to its 20 threads. Circuit opens fast.</text>
      <text x="530" y="284" font-family="sans-serif" font-size="8.5" fill="#334155">Core revenue flows (Checkout &amp; Login) process traffic with 0ms interruption.</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Architecture Rule: Compartmentalize connection pools and worker threads by business criticality. Never let secondary features starve revenue paths.</text>
    
  </g>
</svg>