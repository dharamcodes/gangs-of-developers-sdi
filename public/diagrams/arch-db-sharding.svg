<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">DATABASE HORIZONTAL SHARDING ARCHITECTURE</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Shard Key Hashing • Modulo &amp; Range Partitioning • Scatter-Gather Mitigation • Cross-Shard Joins</text>

  <g id="diagram-canvas">
    
      <!-- App Write Query -->
      <rect x="40" y="125" width="150" height="75" rx="6" fill="#0f172a" />
      <text x="115" y="148" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">App Application Server</text>
      <text x="115" y="165" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#38bdf8">INSERT INTO orders</text>
      <text x="115" y="180" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#f59e0b">user_id = 9182</text>

      <line x1="190" y1="162" x2="245" y2="162" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />

      <!-- Shard Router -->
      <rect x="250" y="110" width="180" height="105" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
      <rect x="250" y="110" width="180" height="28" rx="8" fill="#0284c7" />
      <text x="340" y="129" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff">SHARD ROUTING PROXY</text>
      <text x="340" y="155" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Vitess / Citus / App Code</text>
      <text x="340" y="172" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#0369a1">Hash(user_id) % 3</text>
      <text x="340" y="195" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#15803d">Target: Shard 2</text>

      <!-- Routing Lines -->
      <line x1="430" y1="135" x2="490" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
      <line x1="430" y1="162" x2="490" y2="162" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)" />
      <line x1="430" y1="185" x2="490" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

      <!-- Shards -->
      <rect x="500" y="85" width="220" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="610" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0f172a">SHARD 1 (User Hash 0 - 33%)</text>
      <text x="610" y="125" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#64748b">Primary DB + 2 Read Replicas</text>

      <rect x="500" y="150" width="220" height="60" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
      <text x="610" y="173" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#15803d">SHARD 2 (User Hash 34 - 66%)</text>
      <text x="610" y="190" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#166534">Target for user_id = 9182 ✓</text>

      <rect x="500" y="215" width="220" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="610" y="238" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#0f172a">SHARD 3 (User Hash 67 - 100%)</text>
      <text x="610" y="255" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#64748b">Primary DB + 2 Read Replicas</text>

      <!-- Warning card -->
      <rect x="745" y="100" width="215" height="155" rx="6" fill="#fef2f2" stroke="#ef4444" />
      <text x="852" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#b91c1c">⚠ Sharding Gotchas</text>
      <text x="760" y="148" font-family="sans-serif" font-size="8.5" fill="#7f1d1d">• Cross-Shard Joins require expensive scatter-gather</text>
      <text x="760" y="176" font-family="sans-serif" font-size="8.5" fill="#7f1d1d">• Resharding &amp; split requires zero-downtime dual writes</text>
      <text x="760" y="204" font-family="sans-serif" font-size="8.5" fill="#7f1d1d">• Hot-key celebrity accounts (Elon Musk problem)</text>
      <text x="760" y="232" font-family="sans-serif" font-size="8.5" fill="#7f1d1d">• Distributed ACID transactions need 2-Phase Commit</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Staff Rule: Co-locate related entities using compound shard keys (e.g. shard on tenant_id) so 95% of queries hit a single physical shard.</text>
    
  </g>
</svg>