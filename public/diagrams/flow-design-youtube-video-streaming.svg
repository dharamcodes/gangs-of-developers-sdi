  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#475569">Ingestion Path: GOP-Aligned Parallel Transcoding DAG || Playback Path: Adaptive Bitrate (ABR) HLS Streaming</text>

