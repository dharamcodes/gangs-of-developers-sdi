<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#ffffff" />
  <rect width="1000" height="360" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">CACHE-ASIDE (LAZY LOADING) ARCHITECTURE BLUEPRINT</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Read Path (Lazy Population on Miss) • Write Path (Delete on Write) • Cache Stampede &amp; Negative Caching</text>

  <g id="diagram-canvas">
    
      <rect x="50" y="140" width="160" height="110" rx="8" fill="url(#darkGrad)" stroke="#334155" stroke-width="2" />
      <text x="130" y="185" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">App Server Fleet</text>
      <text x="130" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">(Orchestrates Cache &amp; DB)</text>
      <rect x="390" y="100" width="190" height="85" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
      <text x="485" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#92400e">Redis Cache Cluster</text>
      <text x="485" y="155" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b45309">RAM • Fast Path (&lt;2ms)</text>
      <text x="485" y="172" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#78350f">Keys have jittered TTL</text>
      <rect x="390" y="215" width="190" height="85" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
      <text x="485" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#075985">PostgreSQL / Database</text>
      <text x="485" y="270" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0369a1">Disk • Authoritative Truth</text>
      <text x="485" y="287" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#0c4a6e">ACID Durable Transactions</text>
      <line x1="210" y1="160" x2="385" y2="135" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />
      <text x="290" y="140" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#b45309">1. GET key</text>
      <line x1="210" y1="210" x2="385" y2="245" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
      <text x="290" y="240" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0284c7">2. SELECT (on miss)</text>
      <path d="M 430 215 L 430 188" stroke="#059669" stroke-width="2" marker-end="url(#arrow)" />
      <text x="400" y="203" font-family="sans-serif" font-size="9" font-weight="700" fill="#059669">3. SETEX</text>
      <rect x="640" y="100" width="320" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="660" y="125" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">WRITE FLOW RULE (Delete vs Update)</text>
      <rect x="660" y="140" width="280" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" />
      <text x="670" y="160" font-family="sans-serif" font-size="10" font-weight="700" fill="#166534">CORRECT: Invalidate on Write</text>
      <text x="670" y="177" font-family="sans-serif" font-size="9" fill="#14532d">1. UPDATE row in Database (Committed)</text>
      <text x="670" y="191" font-family="sans-serif" font-size="9" fill="#14532d">2. DEL key in Redis (Next reader lazy-loads)</text>
      <rect x="660" y="215" width="280" height="60" rx="6" fill="#fef2f2" stroke="#fca5a5" />
      <text x="670" y="235" font-family="sans-serif" font-size="10" font-weight="700" fill="#991b1b">WRONG: Update Cache on Write</text>
      <text x="670" y="252" font-family="sans-serif" font-size="9" fill="#7f1d1d">Concurrent writers A &amp; B race:</text>
      <text x="670" y="266" font-family="sans-serif" font-size="9" fill="#7f1d1d">DB: A then B. Cache: B then A -&gt; Stale forever!</text>
    
  </g>
</svg>