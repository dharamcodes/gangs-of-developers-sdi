<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <rect width="1000" height="440" fill="#ffffff" />
  <rect width="1000" height="440" fill="url(#grid)" />
  <!-- Header Title (Clean Whiteboard) -->
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14.5" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">METRICS &amp; DISTRIBUTED LOGGING: DEEP-DIVE EXECUTION PIPELINES</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#475569">Ingestion Path: Gorilla Double-Delta &amp; XOR Compression || Query Path: Roaring Bitmap Inverted Index</text>

  <!-- LANE 1 CONTAINER -->
  <rect x="35" y="76" width="930" height="146" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="35" y="76" width="930" height="28" rx="8" fill="#f8fafc" />
  <rect x="45" y="82" width="170" height="16" rx="3" fill="#0284c7" />
  <text x="130" y="94" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">COMPRESSION PIPELINE</text>
  <text x="225" y="94" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">Gorilla Time-Series Compression (16 Bytes -&gt; 1.37 Bytes / Sample)</text>
  
        <rect x="55" y="118" width="150" height="66" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="69" cy="132" r="8" fill="#0284c7" />
        <text x="69" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">1</text>
        <text x="83" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Telemetry Agent</text>
        <text x="130" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Metric Sample</text>
        <text x="130" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">t=1020, val=12.50</text>
      
          <line x1="205" y1="151" x2="240" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="222.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Push Sample</text>
        
        <rect x="240" y="118" width="150" height="66" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="254" cy="132" r="8" fill="#0284c7" />
        <text x="254" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">2</text>
        <text x="268" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Delta Calculator</text>
        <text x="315" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Double-Delta Time</text>
        <text x="315" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">dod = (t2-t1)-(t1-t0) = 0</text>
      
          <line x1="390" y1="151" x2="425" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="407.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Store 0 Bit</text>
        
        <rect x="425" y="118" width="150" height="66" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" />
        <circle cx="439" cy="132" r="8" fill="#059669" />
        <text x="439" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">3</text>
        <text x="453" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">XOR Float Engine</text>
        <text x="500" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">XOR(12.50, 12.50)</text>
        <text x="500" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Same value -&gt; XOR = 0</text>
      
          <line x1="575" y1="151" x2="610" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="592.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Store 0 Bit</text>
        
        <rect x="610" y="118" width="150" height="66" rx="6" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5" />
        <circle cx="624" cy="132" r="8" fill="#7e22ce" />
        <text x="624" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">4</text>
        <text x="638" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Bit Stream</text>
        <text x="685" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Total = 2 Bits!</text>
        <text x="685" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">0.25 bytes instead of 16 bytes</text>
      
          <line x1="760" y1="151" x2="795" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="777.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">64x Compression</text>
        
        <rect x="795" y="118" width="150" height="66" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="809" cy="132" r="8" fill="#0284c7" />
        <text x="809" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">5</text>
        <text x="823" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Chunk Storage</text>
        <text x="870" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">2-Hour Block</text>
        <text x="870" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Flushes compressed block to S3</text>
      

  <!-- LANE 2 CONTAINER -->
  <rect x="35" y="234" width="930" height="146" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="35" y="234" width="930" height="28" rx="8" fill="#f8fafc" />
  <rect x="45" y="240" width="132.5" height="16" rx="3" fill="#d97706" />
  <text x="111.25" y="252" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">QUERY EXECUTION</text>
  <text x="187.5" y="252" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">PromQL Label Filtering via Inverted Index Roaring Bitmap Intersection</text>
  
        <rect x="55" y="276" width="150" height="66" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5" />
        <circle cx="69" cy="290" r="8" fill="#d97706" />
        <text x="69" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">1</text>
        <text x="83" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">PromQL Query</text>
        <text x="130" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Query Ingress</text>
        <text x="130" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">http_requests{status=500}</text>
      
          <line x1="205" y1="309" x2="240" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="222.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Parse Labels</text>
        
        <rect x="240" y="276" width="150" height="66" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5" />
        <circle cx="254" cy="290" r="8" fill="#d97706" />
        <text x="254" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">2</text>
        <text x="268" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Posting List 1</text>
        <text x="315" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">metric=http_requests</text>
        <text x="315" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Roaring Bitmap [10, 24, 88, 105]</text>
      
          <line x1="390" y1="309" x2="425" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="407.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Fetch Bitmap</text>
        
        <rect x="425" y="276" width="150" height="66" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5" />
        <circle cx="439" cy="290" r="8" fill="#d97706" />
        <text x="439" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">3</text>
        <text x="453" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Posting List 2</text>
        <text x="500" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">status=500</text>
        <text x="500" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Roaring Bitmap [24, 992]</text>
      
          <line x1="575" y1="309" x2="610" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="592.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Fetch Bitmap</text>
        
        <rect x="610" y="276" width="150" height="66" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" />
        <circle cx="624" cy="290" r="8" fill="#059669" />
        <text x="624" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">4</text>
        <text x="638" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Bitwise Engine</text>
        <text x="685" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Bitwise AND</text>
        <text x="685" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Intersect in CPU registers (0.02ms)</text>
      
          <line x1="760" y1="309" x2="795" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="777.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Series ID: [24]</text>
        
        <rect x="795" y="276" width="150" height="66" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="809" cy="290" r="8" fill="#0284c7" />
        <text x="809" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">5</text>
        <text x="823" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Data Chunk</text>
        <text x="870" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Read Series 24</text>
        <text x="870" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Decompresses Gorilla data</text>
      

  <!-- BOTTOM TAKEAWAY BANNER -->
  <rect x="35" y="392" width="930" height="36" rx="6" fill="#0f172a" />
  <text x="500" y="414" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Design Principle: Roaring bitmaps evaluate multi-tag time-series queries in sub-millisecond CPU register operations.</text>
</svg>