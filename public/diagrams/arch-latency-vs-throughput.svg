<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#ffffff" />
  <rect width="1000" height="360" fill="url(#grid)" />
  <!-- Header Title (Clean Whiteboard) -->
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">LATENCY VS THROUGHPUT ARCHITECTURE BLUEPRINT</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#475569">Little's Law (L = λW) • Queuing Knee • Tail Latency (p95/p99) Amplification across Microservice Fan-Out</text>

  <g id="diagram-canvas">
    
      <rect x="40" y="90" width="420" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="60" y="118" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Queuing Knee &amp; Saturation Cliff</text>
      <line x1="80" y1="280" x2="420" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
      <line x1="80" y1="280" x2="80" y2="135" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="400" y="300" font-family="sans-serif" font-size="10" fill="#64748b">Utilization (%)</text>
      <text x="50" y="140" font-family="sans-serif" font-size="10" fill="#64748b" transform="rotate(-90 50 140)">Latency (ms)</text>
      <path d="M 80 270 Q 280 265 330 220 T 380 145" fill="none" stroke="#ef4444" stroke-width="3" />
      <circle cx="330" cy="220" r="5" fill="#f59e0b" />
      <text x="240" y="210" font-family="sans-serif" font-size="10" font-weight="700" fill="#b45309">80% Knee Point</text>
      <text x="345" y="160" font-family="sans-serif" font-size="10" font-weight="700" fill="#dc2626">Exponential Delay Spike</text>

      <rect x="490" y="90" width="470" height="230" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="510" y="118" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Tail Latency Fan-Out Amplification</text>
      <rect x="640" y="135" width="170" height="38" rx="6" fill="#0f172a" />
      <text x="725" y="159" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">API Gateway (Aggregator)</text>
      <line x1="680" y1="173" x2="560" y2="225" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
      <line x1="725" y1="173" x2="725" y2="225" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
      <line x1="770" y1="173" x2="890" y2="225" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
      <rect x="510" y="225" width="100" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
      <text x="560" y="244" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Auth Svc</text>
      <text x="560" y="258" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#059669">p99 = 15ms</text>
      <rect x="675" y="225" width="100" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
      <text x="725" y="244" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Pricing Svc</text>
      <text x="725" y="258" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#059669">p99 = 20ms</text>
      <rect x="840" y="225" width="100" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
      <text x="890" y="244" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Inventory Svc</text>
      <text x="890" y="258" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#dc2626">p99 Spike (250ms)</text>
      <rect x="510" y="280" width="430" height="24" rx="4" fill="#fef3c7" />
      <text x="725" y="296" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#92400e">Fan-out to 20 Svcs with 99% fast: Overall user experience = 0.99^20 ≈ 81.8% (18.2% Slow!)</text>
    
  </g>
</svg>