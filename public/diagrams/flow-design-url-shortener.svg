<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <rect width="1000" height="440" fill="#ffffff" />
  <rect width="1000" height="440" fill="url(#grid)" />
  <!-- Header Title (Clean Whiteboard) -->
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14.5" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">URL SHORTENER: DEEP-DIVE EXECUTION PIPELINES</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#475569">Write Path: 64-Bit Range Leasing &amp; Base62 Encoding || Read Path: Multi-Tier Cache-Aside Resolution &amp; Bloom Filter</text>

  <!-- LANE 1 CONTAINER -->
  <rect x="35" y="76" width="930" height="146" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="35" y="76" width="930" height="28" rx="8" fill="#f8fafc" />
  <rect x="45" y="82" width="125" height="16" rx="3" fill="#0284c7" />
  <text x="107.5" y="94" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">WRITE PIPELINE</text>
  <text x="180" y="94" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">Collision-Free Short URL Creation (Range Allocator + Feistel Scramble + Base62)</text>
  
        <rect x="55" y="118" width="119" height="66" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="69" cy="132" r="8" fill="#0284c7" />
        <text x="69" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">1</text>
        <text x="83" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Client</text>
        <text x="114.5" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">POST /v1/urls</text>
        <text x="114.5" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">longUrl + customAlias</text>
      
          <line x1="174" y1="151" x2="209" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="191.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">HTTPS</text>
        
        <rect x="209" y="118" width="119" height="66" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="223" cy="132" r="8" fill="#0284c7" />
        <text x="223" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">2</text>
        <text x="237" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Gateway</text>
        <text x="268.5" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Envoy Gateway</text>
        <text x="268.5" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">JWT Auth &amp; Rate Limit</text>
      
          <line x1="328" y1="151" x2="363" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="345.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Forward</text>
        
        <rect x="363" y="118" width="119" height="66" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" />
        <circle cx="377" cy="132" r="8" fill="#059669" />
        <text x="377" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">3</text>
        <text x="391" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Write Svc</text>
        <text x="422.5" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">ID Allocator</text>
        <text x="422.5" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">AtomicLong nextId()</text>
      
          <line x1="482" y1="151" x2="517" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="499.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Lease 100k</text>
        
        <rect x="517" y="118" width="119" height="66" rx="6" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5" />
        <circle cx="531" cy="132" r="8" fill="#7e22ce" />
        <text x="531" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">4</text>
        <text x="545" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">etcd Cluster</text>
        <text x="576.5" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Lease Range</text>
        <text x="576.5" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">[1M - 1.1M] Block</text>
      
          <line x1="636" y1="151" x2="671" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="653.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Encode Base62</text>
        
        <rect x="671" y="118" width="119" height="66" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="685" cy="132" r="8" fill="#0284c7" />
        <text x="685" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">5</text>
        <text x="699" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Storage</text>
        <text x="730.5" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Cassandra DB</text>
        <text x="730.5" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">PK: short_code (Write)</text>
      
          <line x1="790" y1="151" x2="825" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="807.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Warm Cache</text>
        
        <rect x="825" y="118" width="119" height="66" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
        <circle cx="839" cy="132" r="8" fill="#ef4444" />
        <text x="839" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">6</text>
        <text x="853" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Cache Tier</text>
        <text x="884.5" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Redis Cluster</text>
        <text x="884.5" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Set key: url:9xK2p (24h)</text>
      

  <!-- LANE 2 CONTAINER -->
  <rect x="35" y="234" width="930" height="146" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="35" y="234" width="930" height="28" rx="8" fill="#f8fafc" />
  <rect x="45" y="240" width="117.5" height="16" rx="3" fill="#d97706" />
  <text x="103.75" y="252" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">READ PIPELINE</text>
  <text x="172.5" y="252" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">Sub-10ms Redirection Path (L1 Caffeine -&gt; L2 Redis -&gt; Bloom Filter -&gt; Cassandra)</text>
  
        <rect x="55" y="276" width="119" height="66" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5" />
        <circle cx="69" cy="290" r="8" fill="#d97706" />
        <text x="69" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">1</text>
        <text x="83" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Browser</text>
        <text x="114.5" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">GET /{shortCode}</text>
        <text x="114.5" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">sho.rt/9xK2p</text>
      
          <line x1="174" y1="309" x2="209" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="191.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Edge Ingress</text>
        
        <rect x="209" y="276" width="119" height="66" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" />
        <circle cx="223" cy="290" r="8" fill="#059669" />
        <text x="223" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">2</text>
        <text x="237" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Edge CDN</text>
        <text x="268.5" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Cloudflare PoP</text>
        <text x="268.5" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">301 Cached at Edge?</text>
      
          <line x1="328" y1="309" x2="363" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="345.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Hit: 301 (&lt;5ms)</text>
        
        <rect x="363" y="276" width="119" height="66" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5" />
        <circle cx="377" cy="290" r="8" fill="#d97706" />
        <text x="377" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">3</text>
        <text x="391" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Redirect Svc</text>
        <text x="422.5" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">L1 Local Cache</text>
        <text x="422.5" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Caffeine Top 10k Keys</text>
      
          <line x1="482" y1="309" x2="517" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="499.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Miss -&gt; L2</text>
        
        <rect x="517" y="276" width="119" height="66" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
        <circle cx="531" cy="290" r="8" fill="#ef4444" />
        <text x="531" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">4</text>
        <text x="545" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">L2 Cache</text>
        <text x="576.5" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Redis Cluster</text>
        <text x="576.5" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Hash Slots (1.5ms)</text>
      
          <line x1="636" y1="309" x2="671" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="653.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Miss -&gt; Bloom</text>
        
        <rect x="671" y="276" width="119" height="66" rx="6" fill="#fefce8" stroke="#d97706" stroke-width="1.5" />
        <circle cx="685" cy="290" r="8" fill="#d97706" />
        <text x="685" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">5</text>
        <text x="699" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Bloom Filter</text>
        <text x="730.5" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Code Exists?</text>
        <text x="730.5" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Definitely Not? -&gt; 404</text>
      
          <line x1="790" y1="309" x2="825" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="807.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Might Exist</text>
        
        <rect x="825" y="276" width="119" height="66" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="839" cy="290" r="8" fill="#0284c7" />
        <text x="839" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">6</text>
        <text x="853" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Datastore</text>
        <text x="884.5" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Cassandra Read</text>
        <text x="884.5" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Populate L1 &amp; L2 -&gt; 302</text>
      

  <!-- BOTTOM TAKEAWAY BANNER -->
  <rect x="35" y="392" width="930" height="36" rx="6" fill="#0f172a" />
  <text x="500" y="414" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Design Principle: Range-based numeric leasing eliminates database uniqueness check round-trips; Bloom filters block cache penetration.</text>
</svg>