<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">RATE LIMITING ALGORITHMS &amp; DISTRIBUTED ENFORCEMENT ARCHITECTURE</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Token Bucket vs Leaky Bucket vs Sliding Window Counter • Redis Lua Script Atomic Guarantees</text>

  <g id="diagram-canvas">
    
      <!-- Token Bucket -->
      <rect x="40" y="85" width="290" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="40" y="85" width="290" height="32" rx="8" fill="#f1f5f9" />
      <text x="55" y="106" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">1. TOKEN BUCKET</text>

      <rect x="90" y="130" width="190" height="75" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
      <text x="185" y="152" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#92400e">Bucket Capacity: B</text>
      <text x="185" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b45309">Refill Rate: r tokens / sec</text>
      <text x="185" y="188" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#b45309">Tokens available: 8 / 10</text>

      <rect x="55" y="220" width="260" height="85" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="68" y="238" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Burst Profile:</text>
      <text x="68" y="255" font-family="sans-serif" font-size="8.5" fill="#475569">• Consumes 1 token per request</text>
      <text x="68" y="270" font-family="sans-serif" font-size="8.5" fill="#475569">• Permits bursts up to bucket capacity B</text>
      <text x="68" y="285" font-family="sans-serif" font-size="8.5" fill="#15803d">✓ Standard for AWS / Stripe API limits</text>

      <!-- Leaky Bucket -->
      <rect x="355" y="85" width="290" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="355" y="85" width="290" height="32" rx="8" fill="#f1f5f9" />
      <text x="370" y="106" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">2. LEAKY BUCKET</text>

      <rect x="405" y="130" width="190" height="75" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
      <text x="500" y="152" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0369a1">FIFO Queue (Buffer)</text>
      <text x="500" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#0284c7">Constant leak rate: r / sec</text>
      <text x="500" y="188" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#0284c7">Overflow drops with 429</text>

      <rect x="370" y="220" width="260" height="85" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="383" y="238" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Traffic Shaping:</text>
      <text x="383" y="255" font-family="sans-serif" font-size="8.5" fill="#475569">• Smooths out sudden bursty spikes</text>
      <text x="383" y="270" font-family="sans-serif" font-size="8.5" fill="#475569">• Dispatches at fixed deterministic cadence</text>
      <text x="383" y="285" font-family="sans-serif" font-size="8.5" fill="#15803d">✓ Ideal for downstream DB write limits</text>

      <!-- Sliding Window Counter -->
      <rect x="670" y="85" width="290" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="670" y="85" width="290" height="32" rx="8" fill="#f1f5f9" />
      <text x="685" y="106" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">3. SLIDING WINDOW (REDIS)</text>

      <rect x="700" y="130" width="230" height="75" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
      <text x="815" y="152" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#15803d">Redis Sorted Set (ZSET)</text>
      <text x="815" y="170" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#166534">ZREMRANGEBYSCORE key 0 (now-60)</text>
      <text x="815" y="188" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#166534">ZCARD key → Check if &lt; Limit</text>

      <rect x="685" y="220" width="260" height="85" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="698" y="238" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Precision Guarantees:</text>
      <text x="698" y="255" font-family="sans-serif" font-size="8.5" fill="#475569">• Eliminates fixed window boundary resets</text>
      <text x="698" y="270" font-family="sans-serif" font-size="8.5" fill="#475569">• Atomic execution via Redis Lua script</text>
      <text x="698" y="285" font-family="sans-serif" font-size="8.5" fill="#15803d">✓ 100% strict rate enforcement</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Architecture Rule: Always execute distributed rate checks inside Redis via Lua scripts to eliminate race conditions between reads and increments.</text>
    
  </g>
</svg>