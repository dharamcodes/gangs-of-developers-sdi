<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />
  <!-- Header Title (Clean Whiteboard) -->
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#0f172a" letter-spacing="-0.01em">LOAD BALANCING ARCHITECTURE: LAYER 4 (TRANSPORT) VS LAYER 7 (APPLICATION)</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#475569">TCP/UDP Packet Routing vs HTTP/gRPC Contextual Routing, TLS Termination &amp; Header Shaping</text>

  <g id="diagram-canvas">
    
      <!-- L4 Section -->
      <rect x="40" y="85" width="430" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="40" y="85" width="430" height="34" rx="8" fill="#f1f5f9" />
      <text x="60" y="108" font-family="sans-serif" font-size="13" font-weight="800" fill="#0f172a">LAYER 4 (Transport / Packet Proxy)</text>
      <rect x="360" y="93" width="95" height="20" rx="4" fill="#0284c7" />
      <text x="407" y="107" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff">AWS NLB / IPVS</text>

      <rect x="60" y="130" width="100" height="60" rx="6" fill="#0f172a" />
      <text x="110" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">TCP SYN/ACK</text>
      <text x="110" y="172" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#94a3b8">IP + Port only</text>

      <line x1="160" y1="160" x2="220" y2="160" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />

      <rect x="220" y="135" width="120" height="50" rx="6" fill="#e0f2fe" stroke="#38bdf8" />
      <text x="280" y="158" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#0369a1">Packet NAT / DSR</text>
      <text x="280" y="174" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#0284c7">No TLS Decryption</text>

      <line x1="340" y1="160" x2="380" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
      <line x1="340" y1="160" x2="380" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

      <rect x="385" y="125" width="70" height="28" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="420" y="143" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700">TCP Node 1</text>
      <rect x="385" y="165" width="70" height="28" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="420" y="183" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700">TCP Node 2</text>

      <rect x="60" y="210" width="390" height="95" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="75" y="230" font-family="sans-serif" font-size="10" font-weight="700" fill="#0369a1">Key Characteristics:</text>
      <text x="75" y="248" font-family="sans-serif" font-size="9.5" fill="#334155">• Latency: Sub-millisecond (&lt; 100μs) • Throughput: Millions of req/s</text>
      <text x="75" y="264" font-family="sans-serif" font-size="9.5" fill="#334155">• Blind to payload: Cannot route by path, cookie, or gRPC method</text>
      <text x="75" y="280" font-family="sans-serif" font-size="9.5" fill="#334155">• TLS passes through to backend servers (or terminated at host)</text>

      <!-- L7 Section -->
      <rect x="495" y="85" width="465" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="495" y="85" width="465" height="34" rx="8" fill="#f1f5f9" />
      <text x="515" y="108" font-family="sans-serif" font-size="13" font-weight="800" fill="#0f172a">LAYER 7 (Application / Reverse Proxy)</text>
      <rect x="850" y="93" width="95" height="20" rx="4" fill="#7e22ce" />
      <text x="897" y="107" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#ffffff">AWS ALB / Envoy</text>

      <rect x="515" y="130" width="110" height="60" rx="6" fill="#0f172a" />
      <text x="570" y="154" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">HTTP/2 / gRPC</text>
      <text x="570" y="170" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#f59e0b">SSL Terminated</text>

      <line x1="625" y1="160" x2="670" y2="160" stroke="#7e22ce" stroke-width="2" marker-end="url(#arrow)" />

      <rect x="670" y="130" width="130" height="60" rx="6" fill="#faf5ff" stroke="#c084fc" />
      <text x="735" y="152" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#6b21a8">Path &amp; Header Rule</text>
      <text x="735" y="168" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#7e22ce">/api/v1/orders → Orders</text>
      <text x="735" y="180" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#7e22ce">/api/v1/users → Users</text>

      <line x1="800" y1="150" x2="840" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
      <line x1="800" y1="170" x2="840" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

      <rect x="845" y="125" width="100" height="28" rx="4" fill="#f0fdf4" stroke="#22c55e" />
      <text x="895" y="143" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#15803d">Orders Cluster</text>
      <rect x="845" y="165" width="100" height="28" rx="4" fill="#eff6ff" stroke="#3b82f6" />
      <text x="895" y="183" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1d4ed8">Users Cluster</text>

      <rect x="515" y="210" width="425" height="95" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="530" y="230" font-family="sans-serif" font-size="10" font-weight="700" fill="#6b21a8">Key Characteristics:</text>
      <text x="530" y="248" font-family="sans-serif" font-size="9.5" fill="#334155">• Full HTTP/gRPC inspection: Path routing, cookie stickiness, JWT auth</text>
      <text x="530" y="264" font-family="sans-serif" font-size="9.5" fill="#334155">• TLS termination offloads cryptographic load from app servers</text>
      <text x="530" y="280" font-family="sans-serif" font-size="9.5" fill="#334155">• Latency overhead: 1-5ms compute cost for packet parsing</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Architecture Strategy: Pair L4 at edge for line-rate packet dispatching with L7 Envoy sidecars for intelligent microservice routing.</text>
    
  </g>
</svg>