<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <rect width="1000" height="440" fill="#ffffff" />
  <rect width="1000" height="440" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="64" fill="url(#headerGrad)" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#blueGrad)" />
  <text x="36" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">DISTRIBUTED FILE STORAGE: DEEP-DIVE EXECUTION PIPELINES</text>
  <text x="36" y="49" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8">Upload Path: 4MB Chunk Deduplication &amp; Direct S3 || Sync Path: Block Delta Synchronization</text>

  <!-- LANE 1 CONTAINER -->
  <rect x="35" y="76" width="930" height="146" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="35" y="76" width="930" height="28" rx="8" fill="#f8fafc" />
  <rect x="45" y="82" width="125" height="16" rx="3" fill="#0284c7" />
  <text x="107.5" y="94" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">UPLOAD &amp; DEDUP</text>
  <text x="180" y="94" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">Chunk-Based Deduplication &amp; Parallel Multipart Upload to S3</text>
  
        <rect x="55" y="118" width="150" height="66" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="69" cy="132" r="8" fill="#0284c7" />
        <text x="69" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">1</text>
        <text x="83" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Client Desktop</text>
        <text x="130" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Split File (1GB)</text>
        <text x="130" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">250 x 4MB Chunks</text>
      
          <line x1="205" y1="151" x2="240" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="222.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">SHA-256 Hash</text>
        
        <rect x="240" y="118" width="150" height="66" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="254" cy="132" r="8" fill="#0284c7" />
        <text x="254" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">2</text>
        <text x="268" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Metadata Svc</text>
        <text x="315" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Check Chunk DB</text>
        <text x="315" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Do hashes already exist?</text>
      
          <line x1="390" y1="151" x2="425" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="407.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Dedup Check</text>
        
        <rect x="425" y="118" width="150" height="66" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" />
        <circle cx="439" cy="132" r="8" fill="#059669" />
        <text x="439" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">3</text>
        <text x="453" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Dedup Match</text>
        <text x="500" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Existing Chunks</text>
        <text x="500" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">180 chunks already in S3!</text>
      
          <line x1="575" y1="151" x2="610" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="592.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Link Pointers</text>
        
        <rect x="610" y="118" width="150" height="66" rx="6" fill="#fefce8" stroke="#d97706" stroke-width="1.5" />
        <circle cx="624" cy="132" r="8" fill="#d97706" />
        <text x="624" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">4</text>
        <text x="638" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Presigned URL</text>
        <text x="685" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">S3 Direct Ingress</text>
        <text x="685" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Upload only 70 new chunks</text>
      
          <line x1="760" y1="151" x2="795" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="777.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Parallel S3 PUT</text>
        
        <rect x="795" y="118" width="150" height="66" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="809" cy="132" r="8" fill="#0284c7" />
        <text x="809" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">5</text>
        <text x="823" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">AWS S3 Bucket</text>
        <text x="870" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Object Storage</text>
        <text x="870" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Encrypted at rest (AES-256)</text>
      

  <!-- LANE 2 CONTAINER -->
  <rect x="35" y="234" width="930" height="146" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="35" y="234" width="930" height="28" rx="8" fill="#f8fafc" />
  <rect x="45" y="240" width="147.5" height="16" rx="3" fill="#d97706" />
  <text x="118.75" y="252" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">CROSS-DEVICE SYNC</text>
  <text x="202.5" y="252" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">Cross-Device Delta Synchronization &amp; Conflict Resolution</text>
  
        <rect x="55" y="276" width="150" height="66" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5" />
        <circle cx="69" cy="290" r="8" fill="#d97706" />
        <text x="69" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">1</text>
        <text x="83" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Commit Event</text>
        <text x="130" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">File Saved</text>
        <text x="130" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Metadata DB increment version</text>
      
          <line x1="205" y1="309" x2="240" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="222.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Emit Kafka</text>
        
        <rect x="240" y="276" width="150" height="66" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5" />
        <circle cx="254" cy="290" r="8" fill="#d97706" />
        <text x="254" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">2</text>
        <text x="268" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Sync Engine</text>
        <text x="315" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Notification Svc</text>
        <text x="315" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">WebSocket push to Device B</text>
      
          <line x1="390" y1="309" x2="425" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="407.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Notify Change</text>
        
        <rect x="425" y="276" width="150" height="66" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5" />
        <circle cx="439" cy="290" r="8" fill="#d97706" />
        <text x="439" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">3</text>
        <text x="453" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Device B App</text>
        <text x="500" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Fetch Delta</text>
        <text x="500" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Requests modified chunk list</text>
      
          <line x1="575" y1="309" x2="610" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="592.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Download Delta</text>
        
        <rect x="610" y="276" width="150" height="66" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="624" cy="290" r="8" fill="#0284c7" />
        <text x="624" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">4</text>
        <text x="638" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">AWS S3 Bucket</text>
        <text x="685" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Stream 4MB Chunk</text>
        <text x="685" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Reassembles file locally</text>
      
          <line x1="760" y1="309" x2="795" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="777.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Replace Block</text>
        
        <rect x="795" y="276" width="150" height="66" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
        <circle cx="809" cy="290" r="8" fill="#ef4444" />
        <text x="809" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">5</text>
        <text x="823" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Conflict Svc</text>
        <text x="870" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Concurrent Edit?</text>
        <text x="870" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Fork file: (conflicted copy)</text>
      

  <!-- BOTTOM TAKEAWAY BANNER -->
  <rect x="35" y="392" width="930" height="36" rx="6" fill="#0f172a" />
  <text x="500" y="414" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Design Principle: Deduplicating fixed 4MB chunks at client edge cuts storage costs by 60%+ and speeds up sync by 4x.</text>
</svg>