  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#475569">Write Path: Fan-Out-on-Write for Normal Users || Read Path: Hybrid Fan-Out-on-Read for Celebrities</text>

