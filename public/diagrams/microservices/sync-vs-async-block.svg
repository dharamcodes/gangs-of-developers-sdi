<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #cbd5e1; }
      .header-title { fill: #0f172a; }
      .header-sub { fill: #475569; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }
      .tier-bg { fill: rgba(241, 245, 249, 0.45); }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-title { fill: #f8fafc; }
        .header-sub { fill: #94a3b8; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
        .tier-bg { fill: rgba(15, 23, 42, 0.35); }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="380" class="bg" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Clean Whiteboard Architectural Header -->
  <text x="28" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">SYNCHRONOUS RPC VS ASYNCHRONOUS MESSAGING TOPOLOGY</text>
  <text x="28" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Distributed Architecture Blueprint • 1. Foundations &amp; Boundaries</text>
  <rect x="820" y="18" width="152" height="26" rx="13" fill="#f59e0b" opacity="0.14" stroke="#f59e0b" stroke-width="1.2" />
  <text x="896" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#f59e0b">Foundations &amp; Boundaries</text>

  <!-- Tier Boundaries -->
  
        <g class="tier-group">
          <rect x="676" y="92" width="278" height="224" rx="12" class="tier-bg" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="688" y="82" width="128" height="18" rx="9" fill="#10b981" opacity="0.14" />
          <text x="752" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#10b981" letter-spacing="0.05em">SERVICES &amp; DATA TIER</text>
        </g>
      

  <!-- Connections and Numbered Step Flow Pipes -->
  
      <g id="conn-0">
        <path d="M 300 205 L 360 205" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="297.2" y="185" width="65.6" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="330" y="198.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">Publish</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 630 205 L 690 205" class="arrow-line" stroke="#10b981" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="627.2" y="185" width="65.6" height="20" rx="6" class="pill-bg" stroke="#10b981" stroke-width="1.2" />
            <text x="660" y="198.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#10b981">Consume</text>
          
        
      </g>
    

  <!-- Node Cards -->
  
      <g id="node-0" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="50" y="110" width="250" height="190" rx="10" class="card-bg" stroke="#ef4444" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 51 111 L 299 111 A 9 9 0 0 1 300 120 L 300 144 L 50 144 L 50 120 A 9 9 0 0 1 51 111 Z" fill="#ef4444" opacity="0.12" />
        <line x1="50" y1="144" x2="300" y2="144" stroke="#ef4444" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(62, 117.5)">
          <rect x="0" y="3" width="20" height="13" rx="2.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
          <line x1="5.5" y1="3" x2="5.5" y2="16" stroke="#ef4444" stroke-width="1.1"/>
          <line x1="10" y1="3" x2="10" y2="16" stroke="#ef4444" stroke-width="1.1"/>
          <line x1="14.5" y1="3" x2="14.5" y2="16" stroke="#ef4444" stroke-width="1.1"/>
          <circle cx="2.8" cy="9.5" r="1" fill="#ef4444"/>
          <circle cx="17.2" cy="9.5" r="1" fill="#ef4444"/>
        </g>
          <text x="88" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ef4444">Synchronous Chain</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="222" y="118" width="70" height="18" rx="9" fill="#ef4444" opacity="0.18" />
          <text x="257" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#ef4444">Temporal Coupling</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="175" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Order Svc -&gt; Billing Svc</text>
        
          <text x="175" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Blocking thread pool</text>
        
          <text x="175" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Cumulative latency hops</text>
        
          <text x="175" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Failure in downstream fails caller</text>
        
          <text x="175" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">High temporal coupling</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="360" y="90" width="270" height="230" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 361 91 L 629 91 A 9 9 0 0 1 630 100 L 630 124 L 360 124 L 360 100 A 9 9 0 0 1 361 91 Z" fill="#10b981" opacity="0.12" />
        <line x1="360" y1="124" x2="630" y2="124" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(372, 97.5)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#10b981"/>
          <circle cx="6" cy="3" r="0.7" fill="#10b981"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#10b981"/>
        </g>
          <text x="398" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">Event Broker (Buffer)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="552" y="98" width="70" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="587" y="110.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Decoupled Bus</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="495" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Kafka / RabbitMQ Broker</text>
        
          <text x="495" y="163" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Append-only distributed log</text>
        
          <text x="495" y="182" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Zero sender thread block</text>
        
          <text x="495" y="201" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Backpressure absorbed</text>
        
          <text x="495" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">At-least-once delivery</text>
        
          <text x="495" y="239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Independent consumer replay</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="690" y="110" width="250" height="190" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 691 111 L 939 111 A 9 9 0 0 1 940 120 L 940 144 L 690 144 L 690 120 A 9 9 0 0 1 691 111 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="690" y1="144" x2="940" y2="144" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(702, 117.5)">
          <rect x="0" y="3" width="20" height="13" rx="2.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
          <line x1="5.5" y1="3" x2="5.5" y2="16" stroke="#38bdf8" stroke-width="1.1"/>
          <line x1="10" y1="3" x2="10" y2="16" stroke="#38bdf8" stroke-width="1.1"/>
          <line x1="14.5" y1="3" x2="14.5" y2="16" stroke="#38bdf8" stroke-width="1.1"/>
          <circle cx="2.8" cy="9.5" r="1" fill="#38bdf8"/>
          <circle cx="17.2" cy="9.5" r="1" fill="#38bdf8"/>
        </g>
          <text x="728" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Decoupled Consumers</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="862" y="118" width="70" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="897" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Event Consumers</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="815" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Billing Service (Pull)</text>
        
          <text x="815" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Notification Svc (Pull)</text>
        
          <text x="815" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Analytics Svc (Pull)</text>
        
          <text x="815" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Independent scaling per topic</text>
        
          <text x="815" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Zero traffic surge impact</text>
        
      </g>
    
</svg>