          <path d="M 3 9 L 9 5 L 15 9 M 9 5 L 9 13" fill="none" stroke="#0284c7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="3" cy="9" r="1" fill="#0284c7"/>
          <circle cx="15" cy="9" r="1" fill="#0284c7"/>
