        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="552" y="88" width="70" height="18" rx="9" fill="#0284c7" opacity="0.18" />
          <text x="587" y="100.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#0284c7">Hop 1</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="500" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Deducts 200ms for auth</text>
        
          <text x="500" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Forwards 1800ms to Order Svc</text>
        
      </g>
    
