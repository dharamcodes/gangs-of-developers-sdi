        <rect x="370" y="195" width="260" height="115" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 371 196 L 629 196 A 9 9 0 0 1 630 205 L 630 229 L 370 229 L 370 205 A 9 9 0 0 1 371 196 Z" fill="#10b981" opacity="0.12" />
        <line x1="370" y1="229" x2="630" y2="229" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(382, 202.5)">
          <ellipse cx="9" cy="3.5" rx="8" ry="2.8" fill="none" stroke="#10b981" stroke-width="1.5"/>
          <path d="M 1 3.5 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#10b981" stroke-width="1.5"/>
          <path d="M 1 9 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#10b981" stroke-width="1.5"/>
        </g>
          <text x="408" y="217" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">Order Svc (Budget: 1200ms)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="552" y="203" width="70" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="587" y="215.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Hop 2</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="500" y="249" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Deducts 600ms for DB write</text>
        
          <text x="500" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Forwards 1200ms to Payment</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="690" y="110" width="260" height="200" rx="10" class="card-bg" stroke="#ef4444" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 691 111 L 949 111 A 9 9 0 0 1 950 120 L 950 144 L 690 144 L 690 120 A 9 9 0 0 1 691 111 Z" fill="#ef4444" opacity="0.12" />
        <line x1="690" y1="144" x2="950" y2="144" stroke="#ef4444" stroke-width="1.2" opacity="0.3" />
        
        
