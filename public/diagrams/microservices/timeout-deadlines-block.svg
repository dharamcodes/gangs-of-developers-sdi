          <text x="424" y="65" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#ef4444" letter-spacing="0.05em">EDGE &amp; ROUTING</text>
        </g>
      
        <g class="tier-group">
          <rect x="676" y="92" width="288" height="234" rx="12" class="tier-bg" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="688" y="82" width="128" height="18" rx="9" fill="#10b981" opacity="0.14" />
          <text x="752" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#10b981" letter-spacing="0.05em">SERVICES &amp; DATA TIER</text>
        </g>
      

  <!-- Connections and Numbered Step Flow Pipes -->
  
      <g id="conn-0">
        <path d="M 310 160 L 370 125" class="arrow-line" stroke="#ef4444" marker-end="url(#arrow)" />
        
          
            <!-- Flow Step Pill with Number Badge -->
            <rect x="299" y="124" width="82" height="22" rx="11" class="pill-bg" stroke="#ef4444" stroke-width="1.3" />
            <circle cx="310" cy="135" r="8" fill="#ef4444" />
            <text x="310" y="138.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="900" fill="#ffffff">2000</text>
            <text x="346" y="138.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ef4444">ms</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 470 170 L 470 195" class="arrow-line" stroke="#ef4444" marker-end="url(#arrow)" />
        
          
            <!-- Flow Step Pill with Number Badge -->
            <rect x="429" y="169" width="82" height="22" rx="11" class="pill-bg" stroke="#ef4444" stroke-width="1.3" />
            <circle cx="440" cy="180" r="8" fill="#ef4444" />
            <text x="440" y="183.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="900" fill="#ffffff">1800</text>
            <text x="476" y="183.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ef4444">ms</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 630 250 L 690 220" class="arrow-line" stroke="#ef4444" marker-end="url(#arrow)" />
        
          
            <!-- Flow Step Pill with Number Badge -->
            <rect x="619" y="229" width="82" height="22" rx="11" class="pill-bg" stroke="#ef4444" stroke-width="1.3" />
            <circle cx="630" cy="240" r="8" fill="#ef4444" />
            <text x="630" y="243.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="900" fill="#ffffff">1200</text>
            <text x="666" y="243.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ef4444">ms</text>
          
        
      </g>
    

  <!-- Node Cards -->
  
      <g id="node-0" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="50" y="110" width="260" height="200" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
