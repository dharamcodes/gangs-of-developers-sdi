          <path d="M 1 3.5 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
          <path d="M 1 9 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        </g>
          <text x="728" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ef4444">Payment Svc (Hangs at 1200ms)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="872" y="118" width="70" height="18" rx="9" fill="#ef4444" opacity="0.18" />
          <text x="907" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#ef4444">Canceled!</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="820" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Database lock hangs</text>
        
          <text x="820" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Deadline timer expires at 1200ms</text>
        
          <text x="820" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">gRPC context canceled instantly</text>
        
          <text x="820" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Frees socket &amp; threads</text>
        
      </g>
    
</svg>