        </g>
          <text x="88" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Edge Client (SLA: 2000ms)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="232" y="118" width="70" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="267" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Ingress</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="180" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">End-to-end latency budget</text>
        
          <text x="180" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Sets X-Request-Deadline header</text>
        
          <text x="180" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Injected into context</text>
        
      </g>
    
      <g id="node-1" class="node-card">
