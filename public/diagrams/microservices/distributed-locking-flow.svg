<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }
      .tier-bg { fill: rgba(241, 245, 249, 0.45); }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
        .tier-bg { fill: rgba(15, 23, 42, 0.35); }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="380" class="bg" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">DISTRIBUTED LOCKING &amp; CONCURRENCY EXECUTION FLOW</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Runtime Sequence &amp; Lifecycle Pipeline • 3. Distributed Data &amp; Consistency</text>
  <rect x="820" y="18" width="152" height="26" rx="13" fill="#ef4444" opacity="0.18" stroke="#ef4444" stroke-width="1" />
  <text x="896" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#ef4444">Runtime Flow</text>

  <!-- Tier Boundaries -->
  

  <!-- Connections and Numbered Step Flow Pipes -->
  
      <g id="conn-0">
        <path d="M 250 210 L 280 210" class="arrow-line" stroke="#ef4444" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="237" y="190" width="56" height="20" rx="6" class="pill-bg" stroke="#ef4444" stroke-width="1.2" />
            <text x="265" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ef4444">Token</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 490 210 L 520 210" class="arrow-line" stroke="#ef4444" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="477" y="190" width="56" height="20" rx="6" class="pill-bg" stroke="#ef4444" stroke-width="1.2" />
            <text x="505" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ef4444">Acquire</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 730 210 L 760 210" class="arrow-line" stroke="#ef4444" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="717" y="190" width="56" height="20" rx="6" class="pill-bg" stroke="#ef4444" stroke-width="1.2" />
            <text x="745" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ef4444">Execute</text>
          
        
      </g>
    

  <!-- Node Cards -->
  
      <g id="node-0" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="50" y="150" width="200" height="140" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 51 151 L 249 151 A 9 9 0 0 1 250 160 L 250 184 L 50 184 L 50 160 A 9 9 0 0 1 51 151 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="50" y1="184" x2="250" y2="184" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Numbered Step Circle Badge -->
          <circle cx="72" cy="167" r="11" fill="#38bdf8" />
          <text x="72" y="171" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#ffffff">1</text>
          <text x="90" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="800" fill="#38bdf8">Generate Token</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="150" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Client creates random UUID</text>
        
          <text x="150" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Unique token = tokenA</text>
        
          <text x="150" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Sets lock key = lock:ticket:42</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="280" y="150" width="210" height="140" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 281 151 L 489 151 A 9 9 0 0 1 490 160 L 490 184 L 280 184 L 280 160 A 9 9 0 0 1 281 151 Z" fill="#10b981" opacity="0.12" />
        <line x1="280" y1="184" x2="490" y2="184" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Numbered Step Circle Badge -->
          <circle cx="302" cy="167" r="11" fill="#10b981" />
          <text x="302" y="171" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#ffffff">2</text>
          <text x="320" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="800" fill="#10b981">Atomic Acquisition</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="385" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Executes SETNX with 10s TTL</text>
        
          <text x="385" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Redis returns 1 (Acquired)</text>
        
          <text x="385" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Watchdog thread renews lease</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="520" y="150" width="210" height="140" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 521 151 L 729 151 A 9 9 0 0 1 730 160 L 730 184 L 520 184 L 520 160 A 9 9 0 0 1 521 151 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="520" y1="184" x2="730" y2="184" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Numbered Step Circle Badge -->
          <circle cx="542" cy="167" r="11" fill="#f59e0b" />
          <text x="542" y="171" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#ffffff">3</text>
          <text x="560" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="800" fill="#f59e0b">Critical Section</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="625" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Mutates critical resource</text>
        
          <text x="625" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Zero concurrent corruption</text>
        
          <text x="625" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Completes business action</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="760" y="150" width="200" height="140" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 761 151 L 959 151 A 9 9 0 0 1 960 160 L 960 184 L 760 184 L 760 160 A 9 9 0 0 1 761 151 Z" fill="#a855f7" opacity="0.12" />
        <line x1="760" y1="184" x2="960" y2="184" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Numbered Step Circle Badge -->
          <circle cx="782" cy="167" r="11" fill="#a855f7" />
          <text x="782" y="171" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#ffffff">4</text>
          <text x="800" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="800" fill="#a855f7">Atomic Release</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="860" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Runs Lua script in Redis</text>
        
          <text x="860" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Verifies token == tokenA</text>
        
          <text x="860" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Deletes key atomically</text>
        
      </g>
    
</svg>