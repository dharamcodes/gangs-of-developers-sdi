<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #cbd5e1; }
      .header-title { fill: #0f172a; }
      .header-sub { fill: #475569; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }
      .tier-bg { fill: rgba(241, 245, 249, 0.45); }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-title { fill: #f8fafc; }
        .header-sub { fill: #94a3b8; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
        .tier-bg { fill: rgba(15, 23, 42, 0.35); }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="380" class="bg" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Clean Whiteboard Architectural Header -->
  <text x="28" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">MONOLITH VS MICROSERVICES ARCHITECTURE TOPOLOGY</text>
  <text x="28" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Distributed Architecture Blueprint • 1. Foundations &amp; Boundaries</text>
  <rect x="820" y="18" width="152" height="26" rx="13" fill="#38bdf8" opacity="0.14" stroke="#38bdf8" stroke-width="1.2" />
  <text x="896" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#38bdf8">Foundations &amp; Boundaries</text>

  <!-- Tier Boundaries -->
  
        <g class="tier-group">
          <rect x="34" y="92" width="262" height="234" rx="12" class="tier-bg" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="46" y="82" width="96" height="18" rx="9" fill="#0284c7" opacity="0.14" />
          <text x="94" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#0284c7" letter-spacing="0.05em">CLIENT TIER</text>
        </g>
      
        <g class="tier-group">
          <rect x="326" y="72" width="308" height="274" rx="12" class="tier-bg" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="338" y="62" width="112" height="18" rx="9" fill="#38bdf8" opacity="0.14" />
          <text x="394" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#38bdf8" letter-spacing="0.05em">EDGE &amp; ROUTING</text>
        </g>
      
        <g class="tier-group">
          <rect x="666" y="92" width="298" height="234" rx="12" class="tier-bg" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="678" y="82" width="128" height="18" rx="9" fill="#10b981" opacity="0.14" />
          <text x="742" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#10b981" letter-spacing="0.05em">SERVICES &amp; DATA TIER</text>
        </g>
      

  <!-- Connections and Numbered Step Flow Pipes -->
  
      <g id="conn-0">
        <path d="M 280 210 L 340 210" class="arrow-line" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="280" y="190" width="60" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="310" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">Evolve</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 620 210 L 680 210" class="arrow-line" stroke="#ef4444" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="620" y="190" width="60" height="20" rx="6" class="pill-bg" stroke="#ef4444" stroke-width="1.2" />
            <text x="650" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ef4444">Avoid!</text>
          
        
      </g>
    

  <!-- Node Cards -->
  
      <g id="node-0" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="50" y="110" width="230" height="200" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 51 111 L 279 111 A 9 9 0 0 1 280 120 L 280 144 L 50 144 L 50 120 A 9 9 0 0 1 51 111 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="50" y1="144" x2="280" y2="144" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(62, 117.5)">
          <ellipse cx="9" cy="3.5" rx="8" ry="2.8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
          <path d="M 1 3.5 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
          <path d="M 1 9 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
        </g>
          <text x="88" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Modular Monolith</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="202" y="118" width="70" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="237" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Single Host</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="165" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Single deployable binary</text>
        
          <text x="165" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">In-memory method calls</text>
        
          <text x="165" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Single ACID Database</text>
        
          <text x="165" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Zero serialization lag</text>
        
          <text x="165" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Compiler boundary checks</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="340" y="90" width="280" height="240" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 341 91 L 619 91 A 9 9 0 0 1 620 100 L 620 124 L 340 124 L 340 100 A 9 9 0 0 1 341 91 Z" fill="#10b981" opacity="0.12" />
        <line x1="340" y1="124" x2="620" y2="124" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(352, 97.5)">
          <ellipse cx="9" cy="3.5" rx="8" ry="2.8" fill="none" stroke="#10b981" stroke-width="1.5"/>
          <path d="M 1 3.5 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#10b981" stroke-width="1.5"/>
          <path d="M 1 9 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#10b981" stroke-width="1.5"/>
        </g>
          <text x="378" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">Distributed Microservices</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="542" y="98" width="70" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="577" y="110.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Autonomous</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="480" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Order Svc (Go) | DB A</text>
        
          <text x="480" y="163" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Inventory Svc (Java) | DB B</text>
        
          <text x="480" y="182" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Payment Svc (Rust) | DB C</text>
        
          <text x="480" y="201" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Kafka Event Streaming</text>
        
          <text x="480" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Isolated blast radius</text>
        
          <text x="480" y="239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Independent release cadence</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="680" y="110" width="270" height="200" rx="10" class="card-bg" stroke="#ef4444" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 681 111 L 949 111 A 9 9 0 0 1 950 120 L 950 144 L 680 144 L 680 120 A 9 9 0 0 1 681 111 Z" fill="#ef4444" opacity="0.12" />
        <line x1="680" y1="144" x2="950" y2="144" stroke="#ef4444" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(692, 117.5)">
          <ellipse cx="9" cy="3.5" rx="8" ry="2.8" fill="none" stroke="#ef4444" stroke-width="1.5"/>
          <path d="M 1 3.5 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
          <path d="M 1 9 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
        </g>
          <text x="718" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ef4444">Distributed Monolith</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="872" y="118" width="70" height="18" rx="9" fill="#ef4444" opacity="0.18" />
          <text x="907" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#ef4444">Anti-Pattern</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="815" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Shared PostgreSQL DB</text>
        
          <text x="815" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Lockstep synchronized PRs</text>
        
          <text x="815" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Chained synchronous RPCs</text>
        
          <text x="815" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Cascading failure blast</text>
        
          <text x="815" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Worst-case latency tax</text>
        
      </g>
    
</svg>