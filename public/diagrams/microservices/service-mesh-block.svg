<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }
      .tier-bg { fill: rgba(241, 245, 249, 0.45); }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
        .tier-bg { fill: rgba(15, 23, 42, 0.35); }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="380" class="bg" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">SERVICE MESH ARCHITECTURE (ISTIO / ENVOY) TOPOLOGY</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Distributed Architecture Blueprint • 2. Edge Ingress, Routing &amp; Service Mesh</text>
  <rect x="820" y="18" width="152" height="26" rx="13" fill="#ec4899" opacity="0.18" stroke="#ec4899" stroke-width="1" />
  <text x="896" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#ec4899">Edge Ingress, Routing &amp; Service Mesh</text>

  <!-- Tier Boundaries -->
  
        <g class="tier-group">
          <rect x="676" y="102" width="288" height="214" rx="12" class="tier-bg" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="688" y="92" width="128" height="18" rx="9" fill="#10b981" opacity="0.14" />
          <text x="752" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#10b981" letter-spacing="0.05em">SERVICES &amp; DATA TIER</text>
        </g>
      

  <!-- Connections and Numbered Step Flow Pipes -->
  
      <g id="conn-0">
        <path d="M 310 180 L 370 180" class="arrow-line" stroke="#ec4899" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="312" y="160" width="56" height="20" rx="6" class="pill-bg" stroke="#ec4899" stroke-width="1.2" />
            <text x="340" y="173.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ec4899">xDS</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 630 180 L 690 180" class="arrow-line" stroke="#ec4899" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="632" y="160" width="56" height="20" rx="6" class="pill-bg" stroke="#ec4899" stroke-width="1.2" />
            <text x="660" y="173.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ec4899">xDS</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 200 300 Q 500 360 800 300" class="arrow-line" stroke="#10b981" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="472" y="335" width="56" height="20" rx="6" class="pill-bg" stroke="#10b981" stroke-width="1.2" />
            <text x="500" y="348.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#10b981">Encrypted mTLS Link</text>
          
        
      </g>
    

  <!-- Node Cards -->
  
      <g id="node-0" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="50" y="120" width="260" height="180" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 51 121 L 309 121 A 9 9 0 0 1 310 130 L 310 154 L 50 154 L 50 130 A 9 9 0 0 1 51 121 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="50" y1="154" x2="310" y2="154" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(62, 127.5)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#38bdf8"/>
          <circle cx="6" cy="3" r="0.7" fill="#38bdf8"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#38bdf8"/>
        </g>
          <text x="88" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Pod A (Data Plane)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="232" y="128" width="70" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="267" y="140.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Client Pod</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="180" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Order Service Pod</text>
        
          <text x="180" y="193" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Envoy Sidecar Proxy</text>
        
          <text x="180" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Transparent iptables capture</text>
        
          <text x="180" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Zero-code instrumentation</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="370" y="90" width="260" height="230" rx="10" class="card-bg" stroke="#ec4899" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 371 91 L 629 91 A 9 9 0 0 1 630 100 L 630 124 L 370 124 L 370 100 A 9 9 0 0 1 371 91 Z" fill="#ec4899" opacity="0.12" />
        <line x1="370" y1="124" x2="630" y2="124" stroke="#ec4899" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(382, 97.5)">
          <rect x="0" y="0" width="19" height="18" rx="2" fill="none" stroke="#ec4899" stroke-width="1.6"/>
          <line x1="0" y1="9" x2="19" y2="9" stroke="#ec4899" stroke-width="1.1"/>
          <circle cx="3.5" cy="4.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="4.5" x2="15.5" y2="4.5" stroke="#ec4899" stroke-width="1.1" stroke-linecap="round"/>
          <circle cx="3.5" cy="13.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="13.5" x2="15.5" y2="13.5" stroke="#ec4899" stroke-width="1.1" stroke-linecap="round"/>
        </g>
          <text x="408" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ec4899">Control Plane (Istiod)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="552" y="98" width="70" height="18" rx="9" fill="#ec4899" opacity="0.18" />
          <text x="587" y="110.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#ec4899">Control Plane</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="500" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">1. Citadel: Root CA / mTLS</text>
        
          <text x="500" y="163" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">2. Pilot: xDS Configuration</text>
        
          <text x="500" y="182" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">3. Galley: CRD Validation</text>
        
          <text x="500" y="201" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Pushes dynamic rules via gRPC</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="690" y="120" width="260" height="180" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 691 121 L 949 121 A 9 9 0 0 1 950 130 L 950 154 L 690 154 L 690 130 A 9 9 0 0 1 691 121 Z" fill="#10b981" opacity="0.12" />
        <line x1="690" y1="154" x2="950" y2="154" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(702, 127.5)">
          <rect x="0" y="1" width="18" height="16" rx="2.5" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <path d="M 3 9 L 9 5 L 15 9 M 9 5 L 9 13" fill="none" stroke="#10b981" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="3" cy="9" r="1" fill="#10b981"/>
          <circle cx="15" cy="9" r="1" fill="#10b981"/>
          <circle cx="9" cy="13" r="1" fill="#10b981"/>
        </g>
          <text x="728" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">Pod B (Data Plane)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="872" y="128" width="70" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="907" y="140.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Server Pod</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="820" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Billing Service Pod</text>
        
          <text x="820" y="193" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Envoy Sidecar Proxy</text>
        
          <text x="820" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">mTLS Termination &amp; AuthZ</text>
        
          <text x="820" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Emits RED metrics to Prometheus</text>
        
      </g>
    
</svg>