<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }
      .tier-bg { fill: rgba(241, 245, 249, 0.45); }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
        .tier-bg { fill: rgba(15, 23, 42, 0.35); }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="380" class="bg" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">SERVICE MESH ARCHITECTURE (ISTIO / ENVOY) TOPOLOGY</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Distributed Architecture Blueprint • 2. Edge Ingress, Routing &amp; Service Mesh</text>
  <rect x="820" y="18" width="152" height="26" rx="13" fill="#6366f1" opacity="0.18" stroke="#6366f1" stroke-width="1" />
  <text x="896" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#6366f1">Edge Ingress, Routing &amp; Service Mesh</text>

  <!-- Tier Boundaries -->
  
        <g class="tier-group">
          <rect x="34" y="92" width="292" height="234" rx="12" class="tier-bg" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="46" y="82" width="96" height="18" rx="9" fill="#0284c7" opacity="0.14" />
          <text x="94" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#0284c7" letter-spacing="0.05em">CLIENT TIER</text>
        </g>
      

  <!-- Connections and Numbered Step Flow Pipes -->
  
      <g id="conn-0">
        <path d="M 310 210 L 360 210" class="arrow-line" stroke="#6366f1" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="307" y="190" width="56" height="20" rx="6" class="pill-bg" stroke="#6366f1" stroke-width="1.2" />
            <text x="335" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#6366f1">Outbound</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 580 210 L 630 210" class="arrow-line" stroke="#6366f1" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="577" y="190" width="56" height="20" rx="6" class="pill-bg" stroke="#6366f1" stroke-width="1.2" />
            <text x="605" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#6366f1">Inbound</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 470 100 L 470 150" class="arrow-line" stroke="#6366f1" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="442" y="115" width="56" height="20" rx="6" class="pill-bg" stroke="#6366f1" stroke-width="1.2" />
            <text x="470" y="128.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#6366f1">Policy</text>
          
        
      </g>
    

  <!-- Node Cards -->
  
      <g id="node-0" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="50" y="110" width="260" height="200" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 51 111 L 309 111 A 9 9 0 0 1 310 120 L 310 144 L 50 144 L 50 120 A 9 9 0 0 1 51 111 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="50" y1="144" x2="310" y2="144" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(62, 117.5)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#38bdf8"/>
          <circle cx="6" cy="3" r="0.7" fill="#38bdf8"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#38bdf8"/>
        </g>
          <text x="88" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Service A Pod (Client)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="232" y="118" width="70" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="267" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Data Plane A</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="180" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Order Service Container</text>
        
          <text x="180" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Envoy Sidecar Proxy</text>
        
          <text x="180" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Intercepts all outbound TCP</text>
        
          <text x="180" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Injects trace headers</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="360" y="150" width="220" height="120" rx="10" class="card-bg" stroke="#6366f1" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 361 151 L 579 151 A 9 9 0 0 1 580 160 L 580 184 L 360 184 L 360 160 A 9 9 0 0 1 361 151 Z" fill="#6366f1" opacity="0.12" />
        <line x1="360" y1="184" x2="580" y2="184" stroke="#6366f1" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(372, 157.5)">
          <rect x="0" y="0" width="19" height="18" rx="2" fill="none" stroke="#6366f1" stroke-width="1.6"/>
          <line x1="0" y1="9" x2="19" y2="9" stroke="#6366f1" stroke-width="1.1"/>
          <circle cx="3.5" cy="4.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="4.5" x2="15.5" y2="4.5" stroke="#6366f1" stroke-width="1.1" stroke-linecap="round"/>
          <circle cx="3.5" cy="13.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="13.5" x2="15.5" y2="13.5" stroke="#6366f1" stroke-width="1.1" stroke-linecap="round"/>
        </g>
          <text x="398" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#6366f1">Mutual TLS Tunnel</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="502" y="158" width="70" height="18" rx="9" fill="#6366f1" opacity="0.18" />
          <text x="537" y="170.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#6366f1">Secure Wire</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="470" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Cryptographic Identity (SPIFFE)</text>
        
          <text x="470" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">TLS 1.3 Wire Encryption</text>
        
          <text x="470" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Zero-Trust Network Mesh</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="630" y="110" width="260" height="200" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 631 111 L 889 111 A 9 9 0 0 1 890 120 L 890 144 L 630 144 L 630 120 A 9 9 0 0 1 631 111 Z" fill="#10b981" opacity="0.12" />
        <line x1="630" y1="144" x2="890" y2="144" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(642, 117.5)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#10b981"/>
          <circle cx="6" cy="3" r="0.7" fill="#10b981"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#10b981"/>
        </g>
          <text x="668" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">Service B Pod (Target)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="812" y="118" width="70" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="847" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Data Plane B</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="760" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Payment Service Container</text>
        
          <text x="760" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Envoy Sidecar Proxy</text>
        
          <text x="760" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Validates client cert</text>
        
          <text x="760" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Applies canary traffic split</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="340" y="20" width="260" height="80" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 341 21 L 599 21 A 9 9 0 0 1 600 30 L 600 54 L 340 54 L 340 30 A 9 9 0 0 1 341 21 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="340" y1="54" x2="600" y2="54" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(352, 27.5)">
          <rect x="0" y="0" width="19" height="18" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
          <line x1="0" y1="9" x2="19" y2="9" stroke="#f59e0b" stroke-width="1.1"/>
          <circle cx="3.5" cy="4.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="4.5" x2="15.5" y2="4.5" stroke="#f59e0b" stroke-width="1.1" stroke-linecap="round"/>
          <circle cx="3.5" cy="13.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="13.5" x2="15.5" y2="13.5" stroke="#f59e0b" stroke-width="1.1" stroke-linecap="round"/>
        </g>
          <text x="378" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">Istio Control Plane (Istiod)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="522" y="28" width="70" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="557" y="40.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Control Plane</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="470" y="74" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Pushes dynamic xDS configs</text>
        
          <text x="470" y="93" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Rotates TLS certificates</text>
        
      </g>
    
</svg>