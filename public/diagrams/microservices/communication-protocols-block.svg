<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }
      .tier-bg { fill: rgba(241, 245, 249, 0.45); }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
        .tier-bg { fill: rgba(15, 23, 42, 0.35); }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="380" class="bg" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">COMMUNICATION PROTOCOLS: REST VS GRPC VS GRAPHQL TOPOLOGY</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Distributed Architecture Blueprint • 1. Foundations &amp; Boundaries</text>
  <rect x="820" y="18" width="152" height="26" rx="13" fill="#10b981" opacity="0.18" stroke="#10b981" stroke-width="1" />
  <text x="896" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#10b981">Foundations &amp; Boundaries</text>

  <!-- Tier Boundaries -->
  
        <g class="tier-group">
          <rect x="34" y="102" width="262" height="214" rx="12" class="tier-bg" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="46" y="92" width="96" height="18" rx="9" fill="#0284c7" opacity="0.14" />
          <text x="94" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#0284c7" letter-spacing="0.05em">CLIENT TIER</text>
        </g>
      
        <g class="tier-group">
          <rect x="656" y="102" width="288" height="214" rx="12" class="tier-bg" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="668" y="92" width="128" height="18" rx="9" fill="#10b981" opacity="0.14" />
          <text x="732" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#10b981" letter-spacing="0.05em">SERVICES &amp; DATA TIER</text>
        </g>
      

  <!-- Connections and Numbered Step Flow Pipes -->
  
      <g id="conn-0">
        <path d="M 280 210 L 340 210" class="arrow-line" stroke="#10b981" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="282" y="190" width="56" height="20" rx="6" class="pill-bg" stroke="#10b981" stroke-width="1.2" />
            <text x="310" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#10b981">Ingress</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 610 210 L 670 210" class="arrow-line" stroke="#10b981" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="612" y="190" width="56" height="20" rx="6" class="pill-bg" stroke="#10b981" stroke-width="1.2" />
            <text x="640" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#10b981">Federate</text>
          
        
      </g>
    

  <!-- Node Cards -->
  
      <g id="node-0" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="50" y="120" width="230" height="180" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 51 121 L 279 121 A 9 9 0 0 1 280 130 L 280 154 L 50 154 L 50 130 A 9 9 0 0 1 51 121 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="50" y1="154" x2="280" y2="154" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(62, 127.5)">
          <rect x="0" y="0" width="13" height="21" rx="2.5" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="4" y1="3" x2="9" y2="3" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="6.5" cy="17.5" r="1.1" fill="#38bdf8"/>
        </g>
          <text x="88" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Edge REST Clients</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="202" y="128" width="70" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="237" y="140.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">North-South</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="165" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Public Web &amp; Mobile</text>
        
          <text x="165" y="193" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">HTTP/1.1 or HTTP/2 JSON</text>
        
          <text x="165" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Standard HTTP Statuses</text>
        
          <text x="165" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">CDN Edge Caching</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="340" y="100" width="270" height="220" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 341 101 L 609 101 A 9 9 0 0 1 610 110 L 610 134 L 340 134 L 340 110 A 9 9 0 0 1 341 101 Z" fill="#10b981" opacity="0.12" />
        <line x1="340" y1="134" x2="610" y2="134" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(352, 107.5)">
          <rect x="0" y="3" width="20" height="13" rx="2.5" fill="none" stroke="#10b981" stroke-width="1.5"/>
          <line x1="5.5" y1="3" x2="5.5" y2="16" stroke="#10b981" stroke-width="1.1"/>
          <line x1="10" y1="3" x2="10" y2="16" stroke="#10b981" stroke-width="1.1"/>
          <line x1="14.5" y1="3" x2="14.5" y2="16" stroke="#10b981" stroke-width="1.1"/>
          <circle cx="2.8" cy="9.5" r="1" fill="#10b981"/>
          <circle cx="17.2" cy="9.5" r="1" fill="#10b981"/>
        </g>
          <text x="378" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">gRPC Inter-Service Bus</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="532" y="108" width="70" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="567" y="120.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">East-West RPC</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="475" y="154" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Protocol Buffers (Binary)</text>
        
          <text x="475" y="173" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">HTTP/2 Single TCP Conn</text>
        
          <text x="475" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Bidirectional Streaming</text>
        
          <text x="475" y="211" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Strict Contract Schemas</text>
        
          <text x="475" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Deadlines &amp; Metadata</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="670" y="120" width="260" height="180" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 671 121 L 929 121 A 9 9 0 0 1 930 130 L 930 154 L 670 154 L 670 130 A 9 9 0 0 1 671 121 Z" fill="#a855f7" opacity="0.12" />
        <line x1="670" y1="154" x2="930" y2="154" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(682, 127.5)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#a855f7" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#a855f7"/>
          <circle cx="6" cy="3" r="0.7" fill="#a855f7"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#a855f7"/>
        </g>
          <text x="708" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#a855f7">GraphQL Gateway (BFF)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="852" y="128" width="70" height="18" rx="9" fill="#a855f7" opacity="0.18" />
          <text x="887" y="140.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#a855f7">Edge Aggregator</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="800" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Schema Federation</text>
        
          <text x="800" y="193" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Declarative Client Query</text>
        
          <text x="800" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Zero Over/Under fetching</text>
        
          <text x="800" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Apollo Gateway Router</text>
        
      </g>
    
</svg>