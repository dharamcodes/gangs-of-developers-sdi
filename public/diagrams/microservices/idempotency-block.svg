<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }
      .tier-bg { fill: rgba(241, 245, 249, 0.45); }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
        .tier-bg { fill: rgba(15, 23, 42, 0.35); }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="380" class="bg" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">CONSUMER &amp; PRODUCER IDEMPOTENCY TOPOLOGY</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Distributed Architecture Blueprint • 3. Distributed Data &amp; Consistency</text>
  <rect x="820" y="18" width="152" height="26" rx="13" fill="#38bdf8" opacity="0.18" stroke="#38bdf8" stroke-width="1" />
  <text x="896" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#38bdf8">Distributed Data &amp; Consistency</text>

  <!-- Tier Boundaries -->
  
        <g class="tier-group">
          <rect x="34" y="92" width="252" height="214" rx="12" class="tier-bg" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="46" y="82" width="96" height="18" rx="9" fill="#0284c7" opacity="0.14" />
          <text x="94" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#0284c7" letter-spacing="0.05em">CLIENT TIER</text>
        </g>
      
        <g class="tier-group">
          <rect x="316" y="82" width="308" height="234" rx="12" class="tier-bg" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="328" y="72" width="112" height="18" rx="9" fill="#38bdf8" opacity="0.14" />
          <text x="384" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#38bdf8" letter-spacing="0.05em">EDGE &amp; ROUTING</text>
        </g>
      
        <g class="tier-group">
          <rect x="656" y="92" width="288" height="214" rx="12" class="tier-bg" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="668" y="82" width="128" height="18" rx="9" fill="#10b981" opacity="0.14" />
          <text x="732" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#10b981" letter-spacing="0.05em">SERVICES &amp; DATA TIER</text>
        </g>
      

  <!-- Connections and Numbered Step Flow Pipes -->
  
      <g id="conn-0">
        <path d="M 270 200 L 330 200" class="arrow-line" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="272" y="180" width="56" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="300" y="193.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">Idempotency-Key</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 610 200 L 670 200" class="arrow-line" stroke="#38bdf8" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="612" y="180" width="56" height="20" rx="6" class="pill-bg" stroke="#38bdf8" stroke-width="1.2" />
            <text x="640" y="193.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#38bdf8">Durable Check</text>
          
        
      </g>
    

  <!-- Node Cards -->
  
      <g id="node-0" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="50" y="110" width="220" height="180" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 51 111 L 269 111 A 9 9 0 0 1 270 120 L 270 144 L 50 144 L 50 120 A 9 9 0 0 1 51 111 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="50" y1="144" x2="270" y2="144" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(62, 117.5)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#38bdf8"/>
          <circle cx="6" cy="3" r="0.7" fill="#38bdf8"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#38bdf8"/>
        </g>
          <text x="88" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Client / Producer</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="192" y="118" width="70" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="227" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Client</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="160" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Generates Idempotency-Key</text>
        
          <text x="160" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">UUID v4 per user intent</text>
        
          <text x="160" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Sends header on every retry</text>
        
          <text x="160" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Agnostic to network glitch</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="330" y="100" width="280" height="200" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 331 101 L 609 101 A 9 9 0 0 1 610 110 L 610 134 L 330 134 L 330 110 A 9 9 0 0 1 331 101 Z" fill="#10b981" opacity="0.12" />
        <line x1="330" y1="134" x2="610" y2="134" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(342, 107.5)">
          <rect x="0" y="1" width="18" height="16" rx="2.5" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <path d="M 3 9 L 9 5 L 15 9 M 9 5 L 9 13" fill="none" stroke="#10b981" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="3" cy="9" r="1" fill="#10b981"/>
          <circle cx="15" cy="9" r="1" fill="#10b981"/>
          <circle cx="9" cy="13" r="1" fill="#10b981"/>
        </g>
          <text x="368" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">Payment Ingress API</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="532" y="108" width="70" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="567" y="120.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Idempotency Gate</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="470" y="154" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">1. Check Redis for Key</text>
        
          <text x="470" y="173" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">2. If PENDING -&gt; 409 Conflict</text>
        
          <text x="470" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">3. If COMPLETED -&gt; return cached</text>
        
          <text x="470" y="211" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">4. If NEW -&gt; acquire atomic lock</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="670" y="110" width="260" height="180" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 671 111 L 929 111 A 9 9 0 0 1 930 120 L 930 144 L 670 144 L 670 120 A 9 9 0 0 1 671 111 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="670" y1="144" x2="930" y2="144" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(682, 117.5)">
          <ellipse cx="9" cy="3.5" rx="8" ry="2.8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
          <path d="M 1 3.5 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
          <path d="M 1 9 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
        </g>
          <text x="708" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">Primary Database</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="852" y="118" width="70" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="887" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Durable Store</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="800" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">INSERT INTO processed_keys</text>
        
          <text x="800" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Unique Constraint on key</text>
        
          <text x="800" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Atomic rollback on error</text>
        
          <text x="800" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Durable consistency</text>
        
      </g>
    
</svg>