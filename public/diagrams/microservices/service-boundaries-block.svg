          <circle cx="3.5" cy="4.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="4.5" x2="15.5" y2="4.5" stroke="#f59e0b" stroke-width="1.1" stroke-linecap="round"/>
          <circle cx="3.5" cy="13.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="13.5" x2="15.5" y2="13.5" stroke="#f59e0b" stroke-width="1.1" stroke-linecap="round"/>
        </g>
          <text x="408" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">Supporting Subdomain</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="552" y="128" width="70" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="587" y="140.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Supporting</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="500" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Complements the core domain</text>
        
          <text x="500" y="193" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Order notification pipeline</text>
        
          <text x="500" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">In-house customized service</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="690" y="120" width="260" height="180" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 691 121 L 949 121 A 9 9 0 0 1 950 130 L 950 154 L 690 154 L 690 130 A 9 9 0 0 1 691 121 Z" fill="#a855f7" opacity="0.12" />
        <line x1="690" y1="154" x2="950" y2="154" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(702, 127.5)">
          <rect x="0" y="0" width="19" height="18" rx="2" fill="none" stroke="#a855f7" stroke-width="1.6"/>
          <line x1="0" y1="9" x2="19" y2="9" stroke="#a855f7" stroke-width="1.1"/>
          <circle cx="3.5" cy="4.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="4.5" x2="15.5" y2="4.5" stroke="#a855f7" stroke-width="1.1" stroke-linecap="round"/>
          <circle cx="3.5" cy="13.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="13.5" x2="15.5" y2="13.5" stroke="#a855f7" stroke-width="1.1" stroke-linecap="round"/>
        </g>
          <text x="728" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#a855f7">Generic Subdomain</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="872" y="128" width="70" height="18" rx="9" fill="#a855f7" opacity="0.18" />
          <text x="907" y="140.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#a855f7">Generic</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="820" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Standard industry function</text>
        
          <text x="820" y="193" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Identity/SSO (Okta/Keycloak)</text>
        
          <text x="820" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Off-the-shelf or SaaS integration</text>
        
      </g>
    
</svg>