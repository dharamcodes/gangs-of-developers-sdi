          <circle cx="3.5" cy="3" r="0.7" fill="#10b981"/>
          <circle cx="6" cy="3" r="0.7" fill="#10b981"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#10b981"/>
        </g>
          <text x="88" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">Main App Container</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="232" y="118" width="70" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="267" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Primary App</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="180" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Node.js / Java App</text>
        
          <text x="180" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Focuses purely on business rules</text>
        
          <text x="180" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Writes logs to shared /var/log</text>
        
          <text x="180" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Calls 127.0.0.1:9000 for egress</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="370" y="90" width="260" height="105" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 371 91 L 629 91 A 9 9 0 0 1 630 100 L 630 124 L 370 124 L 370 100 A 9 9 0 0 1 371 91 Z" fill="#38bdf8" opacity="0.12" />
