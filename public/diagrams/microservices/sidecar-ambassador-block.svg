          <circle cx="3.5" cy="4.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="4.5" x2="15.5" y2="4.5" stroke="#38bdf8" stroke-width="1.1" stroke-linecap="round"/>
          <circle cx="3.5" cy="13.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="13.5" x2="15.5" y2="13.5" stroke="#38bdf8" stroke-width="1.1" stroke-linecap="round"/>
        </g>
          <text x="408" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Logging Sidecar (FluentBit)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="552" y="98" width="70" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="587" y="110.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Sidecar A</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="500" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Tails shared /var/log</text>
        
          <text x="500" y="163" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Parses JSON &amp; redacts PII</text>
        
          <text x="500" y="182" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Flushes to ElasticSearch</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="370" y="205" width="260" height="105" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 371 206 L 629 206 A 9 9 0 0 1 630 215 L 630 239 L 370 239 L 370 215 A 9 9 0 0 1 371 206 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="370" y1="239" x2="630" y2="239" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(382, 212.5)">
          <rect x="0" y="1" width="18" height="16" rx="2.5" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
          <path d="M 3 9 L 9 5 L 15 9 M 9 5 L 9 13" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="3" cy="9" r="1" fill="#f59e0b"/>
          <circle cx="15" cy="9" r="1" fill="#f59e0b"/>
          <circle cx="9" cy="13" r="1" fill="#f59e0b"/>
        </g>
          <text x="408" y="227" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">Ambassador Proxy</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="552" y="213" width="70" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="587" y="225.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Ambassador</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="500" y="259" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Proxies outbound Stripe calls</text>
        
          <text x="500" y="278" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Injects Vault secrets &amp; mTLS</text>
        
          <text x="500" y="297" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Handles external retries</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="690" y="110" width="260" height="200" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 691 111 L 949 111 A 9 9 0 0 1 950 120 L 950 144 L 690 144 L 690 120 A 9 9 0 0 1 691 111 Z" fill="#a855f7" opacity="0.12" />
        <line x1="690" y1="144" x2="950" y2="144" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(702, 117.5)">
