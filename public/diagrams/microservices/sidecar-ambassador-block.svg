<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }
      .tier-bg { fill: rgba(241, 245, 249, 0.45); }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
        .tier-bg { fill: rgba(15, 23, 42, 0.35); }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="380" class="bg" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">SIDECAR &amp; AMBASSADOR PROXY PATTERNS TOPOLOGY</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Distributed Architecture Blueprint • 2. Edge Ingress, Routing &amp; Service Mesh</text>
  <rect x="820" y="18" width="152" height="26" rx="13" fill="#f59e0b" opacity="0.18" stroke="#f59e0b" stroke-width="1" />
  <text x="896" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#f59e0b">Edge Ingress, Routing &amp; Service Mesh</text>

  <!-- Tier Boundaries -->
  
        <g class="tier-group">
          <rect x="356" y="187" width="288" height="139" rx="12" class="tier-bg" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="368" y="177" width="112" height="18" rx="9" fill="#f59e0b" opacity="0.14" />
          <text x="424" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#f59e0b" letter-spacing="0.05em">EDGE &amp; ROUTING</text>
        </g>
      
        <g class="tier-group">
          <rect x="676" y="92" width="288" height="234" rx="12" class="tier-bg" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="688" y="82" width="128" height="18" rx="9" fill="#10b981" opacity="0.14" />
          <text x="752" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#10b981" letter-spacing="0.05em">SERVICES &amp; DATA TIER</text>
        </g>
      

  <!-- Connections and Numbered Step Flow Pipes -->
  
      <g id="conn-0">
        <path d="M 310 160 L 370 140" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="312" y="135" width="56" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="340" y="148.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">Shared Disk</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 310 240 L 370 240" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
