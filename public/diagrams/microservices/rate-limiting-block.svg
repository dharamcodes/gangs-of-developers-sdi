<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #cbd5e1; }
      .header-title { fill: #0f172a; }
      .header-sub { fill: #475569; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }
      .tier-bg { fill: rgba(241, 245, 249, 0.45); }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-title { fill: #f8fafc; }
        .header-sub { fill: #94a3b8; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
        .tier-bg { fill: rgba(15, 23, 42, 0.35); }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="380" class="bg" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Clean Whiteboard Architectural Header -->
  <text x="28" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">RATE LIMITING &amp; THROTTLING: TOKEN BUCKET &amp; LEAKY BUCKET TOPOLOGY</text>
  <text x="28" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Distributed Architecture Blueprint • 4. Resilience &amp; Fault Tolerance</text>
  <rect x="820" y="18" width="152" height="26" rx="13" fill="#ec4899" opacity="0.14" stroke="#ec4899" stroke-width="1.2" />
  <text x="896" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#ec4899">Resilience &amp; Fault Tolerance</text>

  <!-- Tier Boundaries -->
  
        <g class="tier-group">
          <rect x="34" y="92" width="272" height="234" rx="12" class="tier-bg" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="46" y="82" width="96" height="18" rx="9" fill="#0284c7" opacity="0.14" />
          <text x="94" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#0284c7" letter-spacing="0.05em">CLIENT TIER</text>
        </g>
      
        <g class="tier-group">
          <rect x="336" y="72" width="308" height="274" rx="12" class="tier-bg" stroke="#ec4899" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="348" y="62" width="112" height="18" rx="9" fill="#ec4899" opacity="0.14" />
          <text x="404" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#ec4899" letter-spacing="0.05em">EDGE &amp; ROUTING</text>
        </g>
      
        <g class="tier-group">
          <rect x="676" y="92" width="288" height="234" rx="12" class="tier-bg" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="688" y="82" width="128" height="18" rx="9" fill="#10b981" opacity="0.14" />
          <text x="752" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#10b981" letter-spacing="0.05em">SERVICES &amp; DATA TIER</text>
        </g>
      

  <!-- Connections and Numbered Step Flow Pipes -->
  
      <g id="conn-0">
        <path d="M 290 210 L 350 210" class="arrow-line" stroke="#ec4899" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="270.2" y="190" width="99.6" height="20" rx="6" class="pill-bg" stroke="#ec4899" stroke-width="1.2" />
            <text x="320" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ec4899">Inbound HTTP</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 630 210 L 690 210" class="arrow-line" stroke="#10b981" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="600" y="190" width="120" height="20" rx="6" class="pill-bg" stroke="#10b981" stroke-width="1.2" />
            <text x="660" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#10b981">Eval Lua Script</text>
          
        
      </g>
    

  <!-- Node Cards -->
  
      <g id="node-0" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="50" y="110" width="240" height="200" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 51 111 L 289 111 A 9 9 0 0 1 290 120 L 290 144 L 50 144 L 50 120 A 9 9 0 0 1 51 111 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="50" y1="144" x2="290" y2="144" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(62, 117.5)">
          <rect x="1" y="0" width="18" height="12" rx="1.8" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="0" y1="15" x2="20" y2="15" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="3.5" cy="3" r="0.7" fill="#38bdf8"/>
          <circle cx="6" cy="3" r="0.7" fill="#38bdf8"/>
          <circle cx="8.5" cy="3" r="0.7" fill="#38bdf8"/>
        </g>
          <text x="88" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Public Client</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="212" y="118" width="70" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="247" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Client Caller</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="170" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Sends 1,000 QPS burst</text>
        
          <text x="170" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Identified by API Key / IP</text>
        
          <text x="170" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Reads 429 response headers</text>
        
          <text x="170" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Respects Retry-After timing</text>
        
          <text x="170" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Throttled gracefully</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="350" y="90" width="280" height="240" rx="10" class="card-bg" stroke="#ec4899" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 351 91 L 629 91 A 9 9 0 0 1 630 100 L 630 124 L 350 124 L 350 100 A 9 9 0 0 1 351 91 Z" fill="#ec4899" opacity="0.12" />
        <line x1="350" y1="124" x2="630" y2="124" stroke="#ec4899" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(362, 97.5)">
          <rect x="0" y="1" width="18" height="16" rx="2.5" fill="none" stroke="#ec4899" stroke-width="1.6"/>
          <path d="M 3 9 L 9 5 L 15 9 M 9 5 L 9 13" fill="none" stroke="#ec4899" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="3" cy="9" r="1" fill="#ec4899"/>
          <circle cx="15" cy="9" r="1" fill="#ec4899"/>
          <circle cx="9" cy="13" r="1" fill="#ec4899"/>
        </g>
          <text x="388" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ec4899">API Gateway (Rate Limiter)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="552" y="98" width="70" height="18" rx="9" fill="#ec4899" opacity="0.18" />
          <text x="587" y="110.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#ec4899">Edge Throttle</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="490" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Intercepts request at edge</text>
        
          <text x="490" y="163" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Executes atomic Redis Lua script</text>
        
          <text x="490" y="182" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Tracks Token Bucket per user</text>
        
          <text x="490" y="201" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Decides PASS or THROTTLE in &lt;1ms</text>
        
          <text x="490" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Decorates response headers</text>
        
          <text x="490" y="239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Protects internal clusters</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="690" y="110" width="260" height="200" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 691 111 L 949 111 A 9 9 0 0 1 950 120 L 950 144 L 690 144 L 690 120 A 9 9 0 0 1 691 111 Z" fill="#10b981" opacity="0.12" />
        <line x1="690" y1="144" x2="950" y2="144" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(702, 117.5)">
          <rect x="0" y="1" width="18" height="16" rx="2.5" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <path d="M 10 3 L 5 9.5 L 9 9.5 L 8 15 L 13 8.5 L 9.5 8.5 Z" fill="#10b981"/>
        </g>
          <text x="728" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">Redis Cluster</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="872" y="118" width="70" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="907" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Distributed State</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="820" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">High-throughput key-value tier</text>
        
          <text x="820" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Atomic Lua script execution</text>
        
          <text x="820" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Zero race conditions</text>
        
          <text x="820" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Stores (tokens, last_refill)</text>
        
          <text x="820" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Sets auto-expiring key TTL</text>
        
          <text x="820" y="259" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Handles 200,000 evaluations/s</text>
        
      </g>
    
</svg>