<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }
      .tier-bg { fill: rgba(241, 245, 249, 0.45); }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
        .tier-bg { fill: rgba(15, 23, 42, 0.35); }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="380" class="bg" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">APACHE KAFKA PARTITIONING &amp; CONSUMER GROUPS TOPOLOGY</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Distributed Architecture Blueprint • 5. Event-Driven Architecture &amp; Messaging</text>
  <rect x="820" y="18" width="152" height="26" rx="13" fill="#f59e0b" opacity="0.18" stroke="#f59e0b" stroke-width="1" />
  <text x="896" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#f59e0b">Event-Driven Architecture &amp; Messaging</text>

  <!-- Tier Boundaries -->
  
        <g class="tier-group">
          <rect x="676" y="92" width="288" height="234" rx="12" class="tier-bg" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="688" y="82" width="128" height="18" rx="9" fill="#10b981" opacity="0.14" />
          <text x="752" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#10b981" letter-spacing="0.05em">SERVICES &amp; DATA TIER</text>
        </g>
      

  <!-- Connections and Numbered Step Flow Pipes -->
  
      <g id="conn-0">
        <path d="M 310 210 L 370 210" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="312" y="190" width="56" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="340" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">Hash Key</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 630 210 L 690 210" class="arrow-line" stroke="#f59e0b" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="632" y="190" width="56" height="20" rx="6" class="pill-bg" stroke="#f59e0b" stroke-width="1.2" />
            <text x="660" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#f59e0b">Pull Stream</text>
          
        
      </g>
    

  <!-- Node Cards -->
  
      <g id="node-0" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="50" y="110" width="260" height="200" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 51 111 L 309 111 A 9 9 0 0 1 310 120 L 310 144 L 50 144 L 50 120 A 9 9 0 0 1 51 111 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="50" y1="144" x2="310" y2="144" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(62, 117.5)">
          <rect x="0" y="0" width="19" height="18" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="0" y1="9" x2="19" y2="9" stroke="#38bdf8" stroke-width="1.1"/>
          <circle cx="3.5" cy="4.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="4.5" x2="15.5" y2="4.5" stroke="#38bdf8" stroke-width="1.1" stroke-linecap="round"/>
          <circle cx="3.5" cy="13.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="13.5" x2="15.5" y2="13.5" stroke="#38bdf8" stroke-width="1.1" stroke-linecap="round"/>
        </g>
          <text x="88" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Producers &amp; Partition Key</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="232" y="118" width="70" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="267" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Producers</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="180" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Order Service Producer</text>
        
          <text x="180" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Key: user_id or order_id</text>
        
          <text x="180" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">MurmurHash2(key) % 4</text>
        
          <text x="180" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Routes related events to same part</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="370" y="110" width="260" height="200" rx="10" class="card-bg" stroke="#f59e0b" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 371 111 L 629 111 A 9 9 0 0 1 630 120 L 630 144 L 370 144 L 370 120 A 9 9 0 0 1 371 111 Z" fill="#f59e0b" opacity="0.12" />
        <line x1="370" y1="144" x2="630" y2="144" stroke="#f59e0b" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(382, 117.5)">
          <rect x="0" y="3" width="20" height="13" rx="2.5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
          <line x1="5.5" y1="3" x2="5.5" y2="16" stroke="#f59e0b" stroke-width="1.1"/>
          <line x1="10" y1="3" x2="10" y2="16" stroke="#f59e0b" stroke-width="1.1"/>
          <line x1="14.5" y1="3" x2="14.5" y2="16" stroke="#f59e0b" stroke-width="1.1"/>
          <circle cx="2.8" cy="9.5" r="1" fill="#f59e0b"/>
          <circle cx="17.2" cy="9.5" r="1" fill="#f59e0b"/>
        </g>
          <text x="408" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">Kafka Topic (4 Partitions)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="552" y="118" width="70" height="18" rx="9" fill="#f59e0b" opacity="0.18" />
          <text x="587" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#f59e0b">Broker</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="500" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Partition 0 | Partition 1</text>
        
          <text x="500" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Partition 2 | Partition 3</text>
        
          <text x="500" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Strict in-order commit log</text>
        
          <text x="500" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">High disk sequential I/O</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="690" y="110" width="260" height="200" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 691 111 L 949 111 A 9 9 0 0 1 950 120 L 950 144 L 690 144 L 690 120 A 9 9 0 0 1 691 111 Z" fill="#10b981" opacity="0.12" />
        <line x1="690" y1="144" x2="950" y2="144" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(702, 117.5)">
          <rect x="0" y="0" width="19" height="18" rx="2" fill="none" stroke="#10b981" stroke-width="1.6"/>
          <line x1="0" y1="9" x2="19" y2="9" stroke="#10b981" stroke-width="1.1"/>
          <circle cx="3.5" cy="4.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="4.5" x2="15.5" y2="4.5" stroke="#10b981" stroke-width="1.1" stroke-linecap="round"/>
          <circle cx="3.5" cy="13.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="13.5" x2="15.5" y2="13.5" stroke="#10b981" stroke-width="1.1" stroke-linecap="round"/>
        </g>
          <text x="728" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">Consumer Group (Workers)</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="872" y="118" width="70" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="907" y="130.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Scale Out</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="820" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Worker 1 -&gt; Partition 0</text>
        
          <text x="820" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Worker 2 -&gt; Partition 1</text>
        
          <text x="820" y="202" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Worker 3 -&gt; Partition 2</text>
        
          <text x="820" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Worker 4 -&gt; Partition 3</text>
        
      </g>
    
</svg>