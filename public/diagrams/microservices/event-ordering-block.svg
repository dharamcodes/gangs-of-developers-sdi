<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #e2e8f0; }
      .header-bg { fill: #0b1120; }
      .header-title { fill: #ffffff; }
      .header-sub { fill: #94a3b8; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }
      .tier-bg { fill: rgba(241, 245, 249, 0.45); }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-bg { fill: #030712; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
        .tier-bg { fill: rgba(15, 23, 42, 0.35); }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="380" class="bg" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Architectural Banner Header -->
  <rect x="0" y="0" width="1000" height="64" class="header-bg" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#headerGrad)" />
  <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">DISTRIBUTED EVENT ORDERING &amp; KEY SKEW MITIGATION TOPOLOGY</text>
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Distributed Architecture Blueprint • 5. Event-Driven Architecture &amp; Messaging</text>
  <rect x="820" y="18" width="152" height="26" rx="13" fill="#ec4899" opacity="0.18" stroke="#ec4899" stroke-width="1" />
  <text x="896" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#ec4899">Event-Driven Architecture &amp; Messaging</text>

  <!-- Tier Boundaries -->
  
        <g class="tier-group">
          <rect x="676" y="102" width="278" height="214" rx="12" class="tier-bg" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5,4" />
          <rect x="688" y="92" width="128" height="18" rx="9" fill="#10b981" opacity="0.14" />
          <text x="752" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="850" fill="#10b981" letter-spacing="0.05em">SERVICES &amp; DATA TIER</text>
        </g>
      

  <!-- Connections and Numbered Step Flow Pipes -->
  
      <g id="conn-0">
        <path d="M 300 210 L 360 210" class="arrow-line" stroke="#ec4899" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="302" y="190" width="56" height="20" rx="6" class="pill-bg" stroke="#ec4899" stroke-width="1.2" />
            <text x="330" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ec4899">Inspect</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 630 210 L 690 210" class="arrow-line" stroke="#ec4899" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="632" y="190" width="56" height="20" rx="6" class="pill-bg" stroke="#ec4899" stroke-width="1.2" />
            <text x="660" y="203.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ec4899">In-Order</text>
          
        
      </g>
    

  <!-- Node Cards -->
  
      <g id="node-0" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="50" y="120" width="250" height="180" rx="10" class="card-bg" stroke="#ef4444" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 51 121 L 299 121 A 9 9 0 0 1 300 130 L 300 154 L 50 154 L 50 130 A 9 9 0 0 1 51 121 Z" fill="#ef4444" opacity="0.12" />
        <line x1="50" y1="154" x2="300" y2="154" stroke="#ef4444" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(62, 127.5)">
          <rect x="0" y="3" width="20" height="13" rx="2.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
          <line x1="5.5" y1="3" x2="5.5" y2="16" stroke="#ef4444" stroke-width="1.1"/>
          <line x1="10" y1="3" x2="10" y2="16" stroke="#ef4444" stroke-width="1.1"/>
          <line x1="14.5" y1="3" x2="14.5" y2="16" stroke="#ef4444" stroke-width="1.1"/>
          <circle cx="2.8" cy="9.5" r="1" fill="#ef4444"/>
          <circle cx="17.2" cy="9.5" r="1" fill="#ef4444"/>
        </g>
          <text x="88" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#ef4444">Out-of-Order Events</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="222" y="128" width="70" height="18" rx="9" fill="#ef4444" opacity="0.18" />
          <text x="257" y="140.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#ef4444">Hazard</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="175" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Kafka network retry delay</text>
        
          <text x="175" y="193" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Version 3 arrives before 2</text>
        
          <text x="175" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Risk: Invalid state transition</text>
        
          <text x="175" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Payment marked after ship</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="360" y="100" width="270" height="220" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 361 101 L 629 101 A 9 9 0 0 1 630 110 L 630 134 L 360 134 L 360 110 A 9 9 0 0 1 361 101 Z" fill="#10b981" opacity="0.12" />
        <line x1="360" y1="134" x2="630" y2="134" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(372, 107.5)">
          <ellipse cx="9" cy="3.5" rx="8" ry="2.8" fill="none" stroke="#10b981" stroke-width="1.5"/>
          <path d="M 1 3.5 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#10b981" stroke-width="1.5"/>
          <path d="M 1 9 v 5.5 a 8 2.8 0 0 0 16 0 v -5.5" fill="none" stroke="#10b981" stroke-width="1.5"/>
        </g>
          <text x="398" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#10b981">Reordering Buffer</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="552" y="108" width="70" height="18" rx="9" fill="#10b981" opacity="0.18" />
          <text x="587" y="120.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#10b981">Sequence Guard</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="495" y="154" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Checks current DB version</text>
        
          <text x="495" y="173" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Buffers version &gt; current + 1</text>
        
          <text x="495" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Redis sorted set storage</text>
        
          <text x="495" y="211" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Releases when gap closes</text>
        
          <text x="495" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Guarantees monotonic order</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="690" y="120" width="250" height="180" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 691 121 L 939 121 A 9 9 0 0 1 940 130 L 940 154 L 690 154 L 690 130 A 9 9 0 0 1 691 121 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="690" y1="154" x2="940" y2="154" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Component Icon & Title -->
          
        <g transform="translate(702, 127.5)">
          <rect x="0" y="0" width="19" height="18" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
          <line x1="0" y1="9" x2="19" y2="9" stroke="#38bdf8" stroke-width="1.1"/>
          <circle cx="3.5" cy="4.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="4.5" x2="15.5" y2="4.5" stroke="#38bdf8" stroke-width="1.1" stroke-linecap="round"/>
          <circle cx="3.5" cy="13.5" r="1.2" fill="#10b981"/>
          <line x1="7" y1="13.5" x2="15.5" y2="13.5" stroke="#38bdf8" stroke-width="1.1" stroke-linecap="round"/>
        </g>
          <text x="728" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Consistent State</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        
          <rect x="862" y="128" width="70" height="18" rx="9" fill="#38bdf8" opacity="0.18" />
          <text x="897" y="140.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#38bdf8">Protected Aggregate</text>
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="815" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">OrderCreated (v1) -&gt; OK</text>
        
          <text x="815" y="193" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">OrderPaid (v2) -&gt; OK</text>
        
          <text x="815" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">OrderShipped (v3) -&gt; OK</text>
        
          <text x="815" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Zero state corruption</text>
        
      </g>
    
</svg>