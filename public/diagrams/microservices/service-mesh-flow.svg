<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-dot { fill: #cbd5e1; }
      .header-title { fill: #0f172a; }
      .header-sub { fill: #475569; }
      .card-bg { fill: #ffffff; }
      .text-muted { fill: #475569; }
      .arrow-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,4; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #64748b; }
      .pill-bg { fill: #ffffff; }
      .tier-bg { fill: rgba(241, 245, 249, 0.45); }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #070b14; }
        .grid-dot { fill: #1e293b; }
        .header-title { fill: #f8fafc; }
        .header-sub { fill: #94a3b8; }
        .card-bg { fill: #0f172a; }
        .text-muted { fill: #94a3b8; }
        .arrow-line { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .pill-bg { fill: #0f172a; }
        .tier-bg { fill: rgba(15, 23, 42, 0.35); }
      }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" class="grid-dot" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Clean Canvas Background with Dot Matrix Grid -->
  <rect width="1000" height="380" class="bg" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Clean Whiteboard Architectural Header -->
  <text x="28" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="900" class="header-title" letter-spacing="0.04em">SERVICE MESH: CONTROL PLANE VS DATA PLANE EXECUTION FLOW</text>
  <text x="28" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" class="header-sub">Runtime Sequence &amp; Lifecycle Pipeline • 2. Ingress &amp; Traffic Management</text>
  <rect x="820" y="18" width="152" height="26" rx="13" fill="#ec4899" opacity="0.14" stroke="#ec4899" stroke-width="1.2" />
  <text x="896" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#ec4899">Runtime Flow</text>

  <!-- Tier Boundaries -->
  

  <!-- Connections and Numbered Step Flow Pipes -->
  
      <g id="conn-0">
        <path d="M 250 215 L 280 215" class="arrow-line" stroke="#ec4899" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="225.4" y="195" width="79.19999999999999" height="20" rx="6" class="pill-bg" stroke="#ec4899" stroke-width="1.2" />
            <text x="265" y="208.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ec4899">Bootstrap</text>
          
        
      </g>
    
      <g id="conn-1">
        <path d="M 490 215 L 520 215" class="arrow-line" stroke="#ec4899" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="475" y="195" width="60" height="20" rx="6" class="pill-bg" stroke="#ec4899" stroke-width="1.2" />
            <text x="505" y="208.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ec4899">Sync</text>
          
        
      </g>
    
      <g id="conn-2">
        <path d="M 730 215 L 760 215" class="arrow-line" stroke="#ec4899" marker-end="url(#arrow)" />
        
          
            <!-- Standard Label Pill -->
            <rect x="695.2" y="195" width="99.6" height="20" rx="6" class="pill-bg" stroke="#ec4899" stroke-width="1.2" />
            <text x="745" y="208.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="750" fill="#ec4899">Authenticate</text>
          
        
      </g>
    

  <!-- Node Cards -->
  
      <g id="node-0" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="50" y="140" width="200" height="150" rx="10" class="card-bg" stroke="#ec4899" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 51 141 L 249 141 A 9 9 0 0 1 250 150 L 250 174 L 50 174 L 50 150 A 9 9 0 0 1 51 141 Z" fill="#ec4899" opacity="0.12" />
        <line x1="50" y1="174" x2="250" y2="174" stroke="#ec4899" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Numbered Step Circle Badge -->
          <circle cx="72" cy="157" r="11" fill="#ec4899" />
          <text x="72" y="161" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#ffffff">1</text>
          <text x="90" y="162" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="800" fill="#ec4899">Cert Issuance</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="150" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Pod boots in cluster</text>
        
          <text x="150" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Envoy generates private key</text>
        
          <text x="150" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Sends CSR to Istiod CA</text>
        
          <text x="150" y="251" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Receives SPIFFE X.509 cert</text>
        
      </g>
    
      <g id="node-1" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="280" y="140" width="210" height="150" rx="10" class="card-bg" stroke="#38bdf8" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 281 141 L 489 141 A 9 9 0 0 1 490 150 L 490 174 L 280 174 L 280 150 A 9 9 0 0 1 281 141 Z" fill="#38bdf8" opacity="0.12" />
        <line x1="280" y1="174" x2="490" y2="174" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Numbered Step Circle Badge -->
          <circle cx="302" cy="157" r="11" fill="#38bdf8" />
          <text x="302" y="161" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#ffffff">2</text>
          <text x="320" y="162" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="800" fill="#38bdf8">Config Streaming</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="385" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Envoy connects to xDS server</text>
        
          <text x="385" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Subscribes to LDS, CDS, EDS</text>
        
          <text x="385" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Receives real-time endpoint IPs</text>
        
          <text x="385" y="251" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Initializes local routing tables</text>
        
      </g>
    
      <g id="node-2" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="520" y="140" width="210" height="150" rx="10" class="card-bg" stroke="#10b981" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 521 141 L 729 141 A 9 9 0 0 1 730 150 L 730 174 L 520 174 L 520 150 A 9 9 0 0 1 521 141 Z" fill="#10b981" opacity="0.12" />
        <line x1="520" y1="174" x2="730" y2="174" stroke="#10b981" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Numbered Step Circle Badge -->
          <circle cx="542" cy="157" r="11" fill="#10b981" />
          <text x="542" y="161" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#ffffff">3</text>
          <text x="560" y="162" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="800" fill="#10b981">Cryptographic Call</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="625" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">App calls remote service</text>
        
          <text x="625" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Envoy initiates mTLS handshake</text>
        
          <text x="625" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Presents client X.509 cert</text>
        
          <text x="625" y="251" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Validates server SPIFFE identity</text>
        
      </g>
    
      <g id="node-3" class="node-card">
        <!-- Main Card Container with Soft Shadow and Rounded Corners -->
        <rect x="760" y="140" width="200" height="150" rx="10" class="card-bg" stroke="#a855f7" stroke-width="1.8" />
        
        <!-- Distinct Header Strip -->
        <path d="M 761 141 L 959 141 A 9 9 0 0 1 960 150 L 960 174 L 760 174 L 760 150 A 9 9 0 0 1 761 141 Z" fill="#a855f7" opacity="0.12" />
        <line x1="760" y1="174" x2="960" y2="174" stroke="#a855f7" stroke-width="1.2" opacity="0.3" />
        
        
          <!-- Numbered Step Circle Badge -->
          <circle cx="782" cy="157" r="11" fill="#a855f7" />
          <text x="782" y="161" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#ffffff">4</text>
          <text x="800" y="162" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="800" fill="#a855f7">Policy Check</text>
        

        <!-- Component Tag Badge on Top Right of Card -->
        

        <!-- Technical Description Lines / Subsystems -->
        
          <text x="860" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Server Envoy inspects cert URI</text>
        
          <text x="860" y="213" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Verifies service account allowed</text>
        
          <text x="860" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Rejects unauthorized caller (403)</text>
        
          <text x="860" y="251" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" class="text-muted">Delivers payload to target app</text>
        
      </g>
    
</svg>