<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <rect width="1000" height="440" fill="#ffffff" />
  <rect width="1000" height="440" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="64" fill="url(#headerGrad)" />
  <rect x="0" y="62" width="1000" height="2.5" fill="url(#blueGrad)" />
  <text x="36" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">CHAT &amp; MESSAGING SYSTEM: DEEP-DIVE EXECUTION PIPELINES</text>
  <text x="36" y="49" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#94a3b8">1:1 Real-Time WebSocket Epoll Route || Group Fan-Out Pipeline &amp; Offline Push Notifications</text>

  <!-- LANE 1 CONTAINER -->
  <rect x="35" y="76" width="930" height="146" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="35" y="76" width="930" height="28" rx="8" fill="#f8fafc" />
  <rect x="45" y="82" width="155" height="16" rx="3" fill="#0284c7" />
  <text x="122.5" y="94" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">1:1 DIRECT ROUTING</text>
  <text x="210" y="94" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">Real-Time 1:1 Message Routing via Persistent WebSockets &amp; Redis Session Index</text>
  
        <rect x="55" y="118" width="119" height="66" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="69" cy="132" r="8" fill="#0284c7" />
        <text x="69" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">1</text>
        <text x="83" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">User A (App)</text>
        <text x="114.5" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Send Message</text>
        <text x="114.5" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">POST ws://msg payload</text>
      
          <line x1="174" y1="151" x2="209" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="191.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">WS Packet</text>
        
        <rect x="209" y="118" width="119" height="66" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="223" cy="132" r="8" fill="#0284c7" />
        <text x="223" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">2</text>
        <text x="237" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">WS Gateway 1</text>
        <text x="268.5" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Epoll Gateway</text>
        <text x="268.5" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Holds User A connection</text>
      
          <line x1="328" y1="151" x2="363" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="345.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Session Lookup</text>
        
        <rect x="363" y="118" width="119" height="66" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
        <circle cx="377" cy="132" r="8" fill="#ef4444" />
        <text x="377" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">3</text>
        <text x="391" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Redis Cluster</text>
        <text x="422.5" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Session Map</text>
        <text x="422.5" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">User B is on WS Gateway 4</text>
      
          <line x1="482" y1="151" x2="517" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="499.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Publish Route</text>
        
        <rect x="517" y="118" width="119" height="66" rx="6" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5" />
        <circle cx="531" cy="132" r="8" fill="#7e22ce" />
        <text x="531" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">4</text>
        <text x="545" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Redis PubSub</text>
        <text x="576.5" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Internal Bus</text>
        <text x="576.5" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">channel:gw4_userB</text>
      
          <line x1="636" y1="151" x2="671" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="653.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Direct Forward</text>
        
        <rect x="671" y="118" width="119" height="66" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" />
        <circle cx="685" cy="132" r="8" fill="#059669" />
        <text x="685" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">5</text>
        <text x="699" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">WS Gateway 4</text>
        <text x="730.5" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Epoll Gateway</text>
        <text x="730.5" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Pushes frame to socket</text>
      
          <line x1="790" y1="151" x2="825" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
          <text x="807.5" y="145" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">WS Delivery</text>
        
        <rect x="825" y="118" width="119" height="66" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" />
        <circle cx="839" cy="132" r="8" fill="#059669" />
        <text x="839" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">6</text>
        <text x="853" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">User B (App)</text>
        <text x="884.5" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Message Render</text>
        <text x="884.5" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Sub-20ms delivery latency</text>
      

  <!-- LANE 2 CONTAINER -->
  <rect x="35" y="234" width="930" height="146" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="35" y="234" width="930" height="28" rx="8" fill="#f8fafc" />
  <rect x="45" y="240" width="132.5" height="16" rx="3" fill="#d97706" />
  <text x="111.25" y="252" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">GROUP &amp; OFFLINE</text>
  <text x="187.5" y="252" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">Group Message Fan-Out &amp; Offline Push Notification Fallback</text>
  
        <rect x="55" y="276" width="150" height="66" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5" />
        <circle cx="69" cy="290" r="8" fill="#d97706" />
        <text x="69" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">1</text>
        <text x="83" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">User A (App)</text>
        <text x="130" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Group Message</text>
        <text x="130" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">500-member group chat</text>
      
          <line x1="205" y1="309" x2="240" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="222.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Submit WS</text>
        
        <rect x="240" y="276" width="150" height="66" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="254" cy="290" r="8" fill="#0284c7" />
        <text x="254" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">2</text>
        <text x="268" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Chat Svc</text>
        <text x="315" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Store Message</text>
        <text x="315" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Cassandra: partition convId</text>
      
          <line x1="390" y1="309" x2="425" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="407.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Kafka Fanout</text>
        
        <rect x="425" y="276" width="150" height="66" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5" />
        <circle cx="439" cy="290" r="8" fill="#d97706" />
        <text x="439" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">3</text>
        <text x="453" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Fan-Out Svc</text>
        <text x="500" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Member Resolver</text>
        <text x="500" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Split Online vs Offline</text>
      
          <line x1="575" y1="309" x2="610" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="592.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Check Presence</text>
        
        <rect x="610" y="276" width="150" height="66" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" />
        <circle cx="624" cy="290" r="8" fill="#059669" />
        <text x="624" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">4</text>
        <text x="638" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Online Pool</text>
        <text x="685" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Broadcast WS</text>
        <text x="685" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Push to 420 active members</text>
      
          <line x1="760" y1="309" x2="795" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="777.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Delivered</text>
        
        <rect x="795" y="276" width="150" height="66" rx="6" fill="#fefce8" stroke="#d97706" stroke-width="1.5" />
        <circle cx="809" cy="290" r="8" fill="#d97706" />
        <text x="809" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">5</text>
        <text x="823" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Offline Pool</text>
        <text x="870" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">APNs / FCM Push</text>
        <text x="870" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Push to 80 offline members</text>
      

  <!-- BOTTOM TAKEAWAY BANNER -->
  <rect x="35" y="392" width="930" height="36" rx="6" fill="#0f172a" />
  <text x="500" y="414" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Design Principle: Separate persistent stateful WebSocket gateways from stateless message routing and persistence microservices.</text>
</svg>