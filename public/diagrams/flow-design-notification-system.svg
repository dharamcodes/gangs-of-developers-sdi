        <text x="870" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Priority Queues</text>
        <text x="870" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">P0 (OTP) vs P2 (Marketing)</text>
      

  <!-- LANE 2 CONTAINER -->
