        <text x="315" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">HTTP/2 push token</text>
      
          <line x1="390" y1="309" x2="425" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="407.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Delivered</text>
        
