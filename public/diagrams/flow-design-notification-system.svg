  <text x="210" y="94" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">Priority Ingestion, User Preference Filter &amp; Template Hydration</text>
  
        <rect x="55" y="118" width="150" height="66" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="69" cy="132" r="8" fill="#0284c7" />
        <text x="69" y="135" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">1</text>
        <text x="83" y="135" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Producer Svc</text>
