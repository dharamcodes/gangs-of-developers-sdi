        <text x="685" y="154" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Template Engine</text>
        <text x="685" y="170" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Hydrate Mustache template</text>
      
          <line x1="760" y1="151" x2="795" y2="151" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowBlue)" />
