        <text x="453" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Google FCM</text>
        <text x="500" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Android Push</text>
        <text x="500" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Firebase Cloud Messaging</text>
      
          <line x1="575" y1="309" x2="610" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="592.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Delivered</text>
        
        <rect x="610" y="276" width="150" height="66" rx="6" fill="#fefce8" stroke="#d97706" stroke-width="1.5" />
        <circle cx="624" cy="290" r="8" fill="#d97706" />
        <text x="624" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">4</text>
        <text x="638" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">SMS Gateway</text>
        <text x="685" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Twilio / Infobip</text>
        <text x="685" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">E.164 phone dispatch</text>
      
          <line x1="760" y1="309" x2="795" y2="309" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" />
          <text x="777.5" y="303" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#64748b">Transient 5xx?</text>
        
        <rect x="795" y="276" width="150" height="66" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
        <circle cx="809" cy="290" r="8" fill="#ef4444" />
        <text x="809" y="293" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">5</text>
        <text x="823" y="293" font-family="sans-serif" font-size="9.5" font-weight="750" fill="#0f172a">Retry / DLQ</text>
        <text x="870" y="312" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Dead-Letter Queue</text>
        <text x="870" y="328" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Exponential backoff + DLQ</text>
      

  <!-- BOTTOM TAKEAWAY BANNER -->
  <rect x="35" y="392" width="930" height="36" rx="6" fill="#0f172a" />
  <text x="500" y="414" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Staff Principle: Isolate OTP and transactional alerts from bulk marketing queues to prevent thread starvation during promo blasts.</text>
</svg>