<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#ffffff" />
  <rect width="1000" height="380" fill="url(#grid)" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="1000" height="68" fill="#0f172a" />
  <rect x="0" y="66" width="1000" height="3" fill="url(#primaryGrad)" />
  <text x="36" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">STAFF+ ARCHITECTURAL TRADE-OFF DECISION FRAMEWORK</text>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Navigating Non-Negotiable Tensions: Consistency vs Latency vs Cost vs Operational Simplicity</text>

  <g id="diagram-canvas">
    
      <!-- Pillar 1: CAP Spectrum -->
      <rect x="40" y="85" width="220" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="40" y="85" width="220" height="30" rx="8" fill="#f1f5f9" />
      <text x="150" y="105" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">1. CONSISTENCY SPECTRUM</text>

      <rect x="55" y="125" width="190" height="42" rx="4" fill="#e0f2fe" stroke="#38bdf8" />
      <text x="150" y="143" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">Strict Serializability</text>
      <text x="150" y="157" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#0284c7">ACID • Synchronous • High Latency</text>

      <text x="150" y="185" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#64748b">↕ TRADE-OFF AXIS ↕</text>

      <rect x="55" y="200" width="190" height="42" rx="4" fill="#f0fdf4" stroke="#22c55e" />
      <text x="150" y="218" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#15803d">Eventual Consistency</text>
      <text x="150" y="232" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#166534">BASE • Asynchronous • Low Latency</text>

      <text x="150" y="265" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Financial Ledgers: Strict ACID</text>
      <text x="150" y="280" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Social Feeds / Metrics: Eventual</text>

      <!-- Pillar 2: Topology -->
      <rect x="275" y="85" width="220" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="275" y="85" width="220" height="30" rx="8" fill="#f1f5f9" />
      <text x="385" y="105" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">2. TOPOLOGY &amp; MODULARITY</text>

      <rect x="290" y="125" width="190" height="42" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="385" y="143" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700">Modular Monolith</text>
      <text x="385" y="157" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Zero Network Overhead • Fast Iteration</text>

      <text x="385" y="185" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#64748b">↕ TRADE-OFF AXIS ↕</text>

      <rect x="290" y="200" width="190" height="42" rx="4" fill="#faf5ff" stroke="#c084fc" />
      <text x="385" y="218" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#7e22ce">Microservices Fleet</text>
      <text x="385" y="232" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6b21a8">Independent Scaling • High Ops Burden</text>

      <text x="385" y="265" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Early Stage (&lt; 20 eng): Monolith</text>
      <text x="385" y="280" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Hypergrowth (200+ eng): Microservices</text>

      <!-- Pillar 3: Latency vs Cost -->
      <rect x="510" y="85" width="220" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="510" y="85" width="220" height="30" rx="8" fill="#f1f5f9" />
      <text x="620" y="105" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">3. LATENCY VS COST</text>

      <rect x="525" y="125" width="190" height="42" rx="4" fill="#fefce8" stroke="#f59e0b" />
      <text x="620" y="143" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#854d0e">Sub-ms In-Memory (Redis)</text>
      <text x="620" y="157" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#713f12">Cost: ~$5.00 / GB RAM / month</text>

      <text x="620" y="185" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#64748b">↕ TRADE-OFF AXIS ↕</text>

      <rect x="525" y="200" width="190" height="42" rx="4" fill="#f8fafc" stroke="#94a3b8" />
      <text x="620" y="218" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700">Disk Storage (S3 / NVMe)</text>
      <text x="620" y="232" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Cost: ~$0.02 / GB Storage / month</text>

      <text x="620" y="265" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Tiered Caching: 20% hot data in RAM</text>
      <text x="620" y="280" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Cold historical logs archived in S3</text>

      <!-- Pillar 4: Blast Radius -->
      <rect x="745" y="85" width="215" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="745" y="85" width="215" height="30" rx="8" fill="#f1f5f9" />
      <text x="852" y="105" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">4. BLAST RADIUS</text>

      <rect x="760" y="125" width="185" height="42" rx="4" fill="#fee2e2" stroke="#ef4444" />
      <text x="852" y="143" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#991b1b">Global Shared Cluster</text>
      <text x="852" y="157" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#7f1d1d">High Utilization • Full Outage Risk</text>

      <text x="852" y="185" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#64748b">↕ TRADE-OFF AXIS ↕</text>

      <rect x="760" y="200" width="185" height="42" rx="4" fill="#f0fdf4" stroke="#22c55e" />
      <text x="852" y="218" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#15803d">Cell-Based Architecture</text>
      <text x="852" y="232" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#166534">Isolated Cells • Blast Radius &lt; 5%</text>

      <text x="852" y="265" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Amazon / Slack cell architecture</text>
      <text x="852" y="280" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#475569">Cell failure isolates outage to 1 tenant</text>

      <!-- Bottom Banner -->
      <rect x="40" y="332" width="920" height="34" rx="6" fill="#0f172a" />
      <text x="500" y="353" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Staff Golden Rule: There are no best solutions in software architecture, only optimal trade-offs given your specific constraints.</text>
    
  </g>
</svg>